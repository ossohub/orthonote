name: OssoHUB quality checks

on:
  push:
    branches:
      - feature/audit-baseline
      - develop/ossohub-modernization
  pull_request:
    branches:
      - develop/ossohub-modernization

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ossohub-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint baseline (non-blocking during migration)
        run: npm run lint
        continue-on-error: true
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
