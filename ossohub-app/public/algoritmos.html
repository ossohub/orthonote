<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algoritmos de Tratamento Ortopédico</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#0e1117;color:#e2e8f0;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#header{background:linear-gradient(135deg,#1a1f2e 0%,#12161f 100%);border-bottom:1px solid #2a3347;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#header h1{font-size:15px;font-weight:700;color:#e2a84b;letter-spacing:.3px}
#header .sub{font-size:10px;color:#4a5568;margin-left:auto}
#header .badge{background:#e2a84b22;color:#e2a84b;border:1px solid #e2a84b44;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600}
#regions-bar{background:#0d1119;border-bottom:1px solid #1a2030;padding:0 12px;display:flex;gap:1px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#regions-bar::-webkit-scrollbar{display:none}
.rbtn{display:flex;align-items:center;gap:5px;padding:9px 12px;background:transparent;border:none;border-bottom:2px solid transparent;color:#4a5568;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.rbtn:hover{color:#94a3b8;background:#111827}
.rbtn.active{color:var(--rc);border-bottom-color:var(--rc)}
.rbtn .ico{font-size:13px}
#content{flex:1;overflow-y:auto;padding:18px;background:#0e1117}
.rh{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1a2030}
.rh-icon{font-size:26px}
.rh h2{font-size:17px;font-weight:700;color:var(--rc)}
.rh-count{background:#1a2030;color:#4a5568;border-radius:20px;padding:2px 10px;font-size:10px;margin-left:4px}
.alg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.acard{background:#111827;border:1px solid #1a2030;border-left:3px solid var(--rc);border-radius:8px;padding:13px;cursor:pointer;transition:all .15s}
.acard:hover{background:#161f30;transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.4);border-color:var(--rc)}
.acard .cn{font-size:9px;color:#374151;font-weight:700;margin-bottom:3px;letter-spacing:.5px}
.acard .ct{font-size:12px;font-weight:600;color:#e2e8f0;margin-bottom:5px;line-height:1.35}
.acard .cs{font-size:10px;color:#374151}
.acard .ctags{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600}
.tag-c{background:#14532d33;color:#4ade80}
.tag-s{background:#1e3a5f33;color:#60a5fa}
.tag-sm{background:#4c1d9533;color:#a78bfa}
.tag-e{background:#7f1d1d33;color:#f87171}
.tag-p{background:#0c4a6e33;color:#38bdf8}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
#ov.hidden{display:none}
#mod{background:#111827;border:1px solid #2a3347;border-radius:12px;width:100%;max-width:660px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#mhd{background:linear-gradient(135deg,#161f30 0%,#111827 100%);border-bottom:1px solid #2a3347;padding:14px 18px;display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
#mhd .mhi{font-size:22px;flex-shrink:0;margin-top:2px}
#mhd .mhinfo{flex:1}
#mhd h3{font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:2px;line-height:1.3}
#mhd .mhsrc{font-size:10px;color:#374151}
#mclose{background:#1a2030;border:1px solid #2a3347;color:#4a5568;width:26px;height:26px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .15s}
#mclose:hover{background:#7f1d1d;color:#f87171;border-color:#7f1d1d}
#mprog{background:#0d1119;border-bottom:1px solid #1a2030;padding:7px 18px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.pbar{flex:1;height:3px;background:#1a2030;border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--rc,#e2a84b);border-radius:2px;transition:width .3s}
.ptxt{font-size:10px;color:#374151;white-space:nowrap}
#mbody{flex:1;overflow-y:auto;padding:18px}
.breadcrumbs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.bc{font-size:9px;background:#1a2030;color:#374151;padding:2px 7px;border-radius:3px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc.cur{background:var(--rc-dim,#e2a84b22);color:var(--rc,#e2a84b)}
.nq{background:#161f30;border:1px solid #2a3347;border-radius:10px;padding:18px;margin-bottom:14px}
.nq-lbl{font-size:9px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.nq-txt{font-size:14px;font-weight:600;color:#e2e8f0;line-height:1.5}
.nq-ctx{font-size:11px;color:#4a5568;margin-top:7px;line-height:1.55}
.opts{display:grid;gap:7px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:#1a2030;border:1px solid #2a3347;border-radius:8px;padding:11px 14px;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:flex-start;gap:9px}
.opt:hover{background:#1e293b;border-color:var(--rc)}
.opt.yes:hover{background:#14532d22;border-color:#4ade80}
.opt.no:hover{background:#7c3aed22;border-color:#a78bfa}
.opt-ico{font-size:15px;flex-shrink:0;margin-top:1px}
.opt-lbl{font-size:12px;font-weight:600;color:#e2e8f0}
.opt-dsc{font-size:10px;color:#4a5568;margin-top:2px;line-height:1.4}
.rn{border-radius:10px;padding:18px;margin-bottom:14px}
.rn.conservative{background:#14532d22;border:1px solid #4ade8033}
.rn.surgical{background:#1e3a5f22;border:1px solid #60a5fa33}
.rn.surgical-major{background:#4c1d9522;border:1px solid #a78bfa33}
.rn.emergency{background:#7f1d1d33;border:1px solid #f8717133}
.rn-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:2px 9px;border-radius:4px;margin-bottom:10px}
.conservative .rn-badge{background:#14532d44;color:#4ade80}
.surgical .rn-badge{background:#1e3a5f44;color:#60a5fa}
.surgical-major .rn-badge{background:#4c1d9544;color:#a78bfa}
.emergency .rn-badge{background:#7f1d1d55;color:#f87171}
.rn-title{font-size:15px;font-weight:700;color:#e2e8f0;margin-bottom:8px}
.rn-txt{font-size:11px;color:#94a3b8;line-height:1.65}
.rn-details{margin-top:12px;border-top:1px solid #2a3347;padding-top:10px}
.rn-di{display:flex;gap:8px;font-size:11px;color:#94a3b8;padding:4px 0;border-bottom:1px solid #1a2030}
.rn-di:last-child{border-bottom:none}
.rn-di .dil{color:#374151;min-width:110px;flex-shrink:0;font-weight:600}
#mft{border-top:1px solid #1a2030;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
.btn{padding:7px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-sec{background:#1a2030;color:#4a5568}.btn-sec:hover{background:#2a3347;color:#94a3b8}
.btn-pri{background:var(--rc,#e2a84b);color:#0e1117}.btn-pri:hover{opacity:.9}
.btn:disabled{opacity:.3;cursor:not-allowed}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#2a3347;border-radius:3px}
.r-geral{--rc:#f59e0b;--rc-dim:#f59e0b22}
.r-ombro{--rc:#3b82f6;--rc-dim:#3b82f622}
.r-cotovelo{--rc:#8b5cf6;--rc-dim:#8b5cf622}
.r-punho{--rc:#ec4899;--rc-dim:#ec489922}
.r-coluna{--rc:#14b8a6;--rc-dim:#14b8a622}
.r-pelve{--rc:#f97316;--rc-dim:#f9731622}
.r-quadril{--rc:#ef4444;--rc-dim:#ef444422}
.r-joelho{--rc:#10b981;--rc-dim:#10b98122}
.r-perna{--rc:#6366f1;--rc-dim:#6366f122}
.r-pediatria{--rc:#06b6d4;--rc-dim:#06b6d422}
.r-fraturas-pediatricas{--rc:#d946ef;--rc-dim:#d946ef22}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <span style="font-size:20px">🦴</span>
  <div>
    <h1>Algoritmos de Tratamento Ortopédico</h1>
    <div class="sub">Campbell's 15ª ed. · Rockwood Adults 10ª ed. · Rockwood Children 10ª ed.</div>
  </div>
  <span class="badge">Beta</span>
</div>
<div id="regions-bar">
  <button class="rbtn active" data-r="geral" onclick="showRegion('geral',this)"><span class="ico">⚙️</span>Princípios Gerais</button>
  <button class="rbtn" data-r="ombro" onclick="showRegion('ombro',this)"><span class="ico">🦴</span>Ombro e Clavícula</button>
  <button class="rbtn" data-r="cotovelo" onclick="showRegion('cotovelo',this)"><span class="ico">💪</span>Cotovelo</button>
  <button class="rbtn" data-r="punho" onclick="showRegion('punho',this)"><span class="ico">✋</span>Punho e Mão</button>
  <button class="rbtn" data-r="coluna" onclick="showRegion('coluna',this)"><span class="ico">🧱</span>Coluna Vertebral</button>
  <button class="rbtn" data-r="pelve" onclick="showRegion('pelve',this)"><span class="ico">🦋</span>Pelve e Acetábulo</button>
  <button class="rbtn" data-r="quadril" onclick="showRegion('quadril',this)"><span class="ico">🦵</span>Quadril e Fêmur</button>
  <button class="rbtn" data-r="joelho" onclick="showRegion('joelho',this)"><span class="ico">🦿</span>Joelho</button>
  <button class="rbtn" data-r="perna" onclick="showRegion('perna',this)"><span class="ico">🦶</span>Perna, Tornozelo e Pé</button>
  <button class="rbtn" data-r="pediatria" onclick="showRegion('pediatria',this)"><span class="ico">👶</span>Pediatria</button>
  <button class="rbtn" data-r="fraturas-pediatricas" onclick="showRegion('fraturas-pediatricas',this)"><span class="ico">🦴</span>Fraturas Pediátricas</button>
</div>
<div id="content"></div>
</div>

<div id="ov" class="hidden" onclick="if(event.target===this)closeModal()">
<div id="mod">
  <div id="mhd">
    <div class="mhi" id="mhd-icon">🔀</div>
    <div class="mhinfo">
      <h3 id="mhd-title">Título</h3>
      <div class="mhsrc" id="mhd-src">Fonte</div>
    </div>
    <button id="mclose" onclick="closeModal()">✕</button>
  </div>
  <div id="mprog">
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    <div class="ptxt" id="ptxt">Passo 1</div>
  </div>
  <div id="mbody"></div>
  <div id="mft">
    <button class="btn btn-sec" id="btn-back" onclick="goBack()" disabled>← Voltar</button>
    <div id="mft-info" style="font-size:10px;color:#374151"></div>
    <button class="btn btn-pri" id="btn-restart" onclick="restartAlg()">↺ Reiniciar</button>
  </div>
</div>
</div>

<script>
const REGIONS = {
  geral:{label:"Princípios Gerais",icon:"⚙️",cls:"r-geral"},
  ombro:{label:"Ombro e Clavícula",icon:"🦴",cls:"r-ombro"},
  cotovelo:{label:"Cotovelo",icon:"💪",cls:"r-cotovelo"},
  punho:{label:"Punho e Mão",icon:"✋",cls:"r-punho"},
  coluna:{label:"Coluna Vertebral",icon:"🧱",cls:"r-coluna"},
  pelve:{label:"Pelve e Acetábulo",icon:"🦋",cls:"r-pelve"},
  quadril:{label:"Quadril e Fêmur",icon:"🦵",cls:"r-quadril"},
  joelho:{label:"Joelho",icon:"🦿",cls:"r-joelho"},
  perna:{label:"Perna, Tornozelo e Pé",icon:"🦶",cls:"r-perna"},
  pediatria:{label:"Pediatria",icon:"👶",cls:"r-pediatria"},
  'fraturas-pediatricas':{label:"Fraturas Pediátricas",icon:"🦴",cls:"r-fraturas-pediatricas"}
};

const ALGS = {

// ═══════════════════════════════════════
// PRINCÍPIOS GERAIS
// ═══════════════════════════════════════
sca:{
  region:"geral", num:"RWA Alg.17-1",
  title:"Síndrome Compartimental Aguda",
  src:"Rockwood Adults 10ª ed. · Cap. 17",
  icon:"🚨", tags:["e"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Paciente de alto risco para SCA?",
      ctx:"Paciente jovem + fratura diafisária de tíbia, fratura do antebraço, trauma de alta energia ou com distúrbio da coagulação?",
      yes:"q2", no:"q3"},
    q2:{type:"q",text:"Monitorização contínua da pressão intracompartimental (PIC) indicada?",
      ctx:"Recomendada em TODOS os pacientes de alto risco. Compartimento anterior da perna é o prioritário.",
      yes:"q4", no:"q4"},
    q3:{type:"q",text:"Sinais e sintomas clínicos sugestivos de SCA?",
      ctx:"Dor desproporcional ao exame, dor à extensão passiva dos dedos, endurecimento do compartimento, parestesias.",
      yes:"q4", no:"r1"},
    r1:{type:"r",cls:"conservative",title:"Conduta Expectante",
      txt:"Sem sinais ou risco: observação rigorosa. Reavaliar a cada 1-2 horas. Manter perfusão sistêmica adequada.",
      details:[["Posição","Membro ao nível do coração — NÃO elevar"],["Gesso","Abrir qualquer imobilização circunferencial"],["Reavaliação","Horária nas primeiras 6h"]]},
    q4:{type:"q",text:"Pressão Diferencial de Perfusão (PDP) < 30 mmHg persistente?",
      ctx:"PDP = Pressão Diastólica − PIC. PDP < 30 mmHg por mais de 2h indica fasciotomia independentemente dos sintomas.",
      yes:"r2", no:"q5"},
    q5:{type:"q",text:"Sintomas clínicos francos + múltiplos sinais presentes?",
      ctx:"Dor intensa, compartimento tenso, déficit neurológico progressivo, dor à extensão passiva.",
      yes:"r2", no:"r3"},
    r2:{type:"r",cls:"emergency",title:"Fasciotomia de Urgência — Imediata",
      txt:"Fasciotomia descompressiva urgente. Não aguardar confirmação laboratorial ou radiológica. Tempo é músculo.",
      details:[["Perna","4 compartimentos via 2 incisões longitudinais"],["Antebraço","3 compartimentos via incisão volar e/ou dorsal"],["Coxa","3 compartimentos via incisão lateral"],["Cobertura","Curativo de pressão negativa (VAC); fechamento tardio em 5-7 dias"],["Fasciotomia tardia","Se > 6h: ainda indicada, mas prognóstico reservado"]]},
    r3:{type:"r",cls:"surgical",title:"Monitorização Contínua — Repetir Avaliação",
      txt:"PDP ainda adequada mas paciente de alto risco. Manter monitorização contínua. Reavaliação frequente.",
      details:[["Frequência","Leitura a cada 30 minutos"],["Limiar","Fasciotomia se PDP cair < 30 mmHg por > 2h"],["Analgesia","Controle da dor sem mascarar sintomas"]]}}
},

frat_patol:{
  region:"geral", num:"RWA Alg.25-1",
  title:"Fratura Patológica",
  src:"Rockwood Adults 10ª ed. · Cap. 25",
  icon:"🦴", tags:["s","sm"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Paciente tem diagnóstico de neoplasia maligna primária ou doença óssea primária conhecida?",
      ctx:"Metástases ósseas são a causa mais comum de fratura patológica no adulto. Mieloma, linfoma e carcinoma (mama, pulmão, próstata, rim, tireoide) lideram.",
      yes:"q2", no:"q6"},
    q2:{type:"q",text:"Fratura em osso longo de membro inferior (fêmur ou tíbia)?",
      ctx:"Fraturas de fêmur proximal têm maior morbimortalidade e menor probabilidade de consolidação espontânea.",
      yes:"q3", no:"q4"},
    q3:{type:"q",text:"Expectativa de vida > 3 meses E paciente clinicamente operável?",
      yes:"r1", no:"r2"},
    r1:{type:"r",cls:"surgical-major",title:"Fixação Cirúrgica + Radioterapia Adjuvante",
      txt:"Hastes intramedulares são o padrão-ouro para fraturas patológicas de ossos longos. Preferir haste longa cobrindo todo o osso. Radioterapia pós-operatória em 2-3 semanas.",
      details:[["Implante","Haste intramedular bloqueada (cobre osso inteiro)"],["Cimento","Augmentação com PMMA se necessário"],["Radioterapia","Iniciar 2-3 sem pós-op; 30 Gy em 10 frações"],["Carga","Carga total imediata no pós-op"],["Critério de Mirels","Score ≥ 9 → fixação profilática"]]},
    r2:{type:"r",cls:"conservative",title:"Cuidados Paliativos / Fixação Paliativa Mínima",
      txt:"Expectativa de vida curta ou alto risco cirúrgico: imobilização paliativa, controle da dor, radioterapia isolada se possível.",
      details:[["Analgesia","Opioide forte + bisfosfonato IV"],["Radioterapia","Dose única (8 Gy) para controle da dor"],["Imobilização","Órtese ou tração, se tolerável"]]},
    q4:{type:"q",text:"Fratura de coluna vertebral com déficit neurológico?",
      yes:"r3", no:"q5"},
    r3:{type:"r",cls:"emergency",title:"Descompressão Cirúrgica Urgente — Coluna",
      txt:"Déficit neurológico progressivo em fratura patológica de coluna: cirurgia de descompressão + estabilização em até 24-48h.",
      details:[["Abordagem","Corpectomia + fusão instrumentada"],["Radioterapia","Pós-op para controle local"],["Corticóide","Dexametasona 10 mg IV bolus + 4 mg 6/6h"]]},
    q5:{type:"q",text:"Fratura de membro superior com dor incapacitante ou instabilidade funcional significativa?",
      yes:"r4", no:"r5"},
    r4:{type:"r",cls:"surgical",title:"Fixação Percutânea ou Placa + Cimento",
      txt:"Úmero proximal e distal: haste ou placa com augmentação de cimento. Preservar função de preensão e ADM.",
      details:[["Úmero proximal","Haste anterógrada + cimento se necessário"],["Úmero distal","Placa + cimento ou artroplastia"],["Rádio/ulna","Placa convencional"]]},
    r5:{type:"r",cls:"conservative",title:"Tratamento Conservador + Radioterapia",
      txt:"Fraturas de membros superiores com boa estabilidade relativa: imobilização + radioterapia para controle da dor e do tumor.",
      details:[["Imobilização","Órtese funcional (Sarmiento)"],["Radioterapia","30 Gy em 10 frações"]]},
    q6:{type:"q",text:"Fratura em paciente jovem com lesão óssea expansiva / aspecto agressivo no RX?",
      yes:"r6", no:"r7"},
    r6:{type:"r",cls:"surgical",title:"Biópsia Antes de Qualquer Fixação",
      txt:"NUNCA fixar fratura óssea patológica de origem desconhecida em paciente jovem sem biópsia prévia. Risco de contaminar planos cirúrgicos e prejudicar cirurgia oncológica definitiva.",
      details:[["Biópsia","Tru-cut ou excisional pelo oncologista ortopédico"],["Encaminhamento","Centro de referência em oncologia musculoesquelética"],["Estabilização","Tração esquelética provisória se instável"]]},
    r7:{type:"r",cls:"conservative",title:"Fratura de Insuficiência / Estresse — Avaliação Metabólica",
      txt:"Afastar osteoporose, osteomalacia, hiperparatireoidismo. Tratar causa base antes de definir conduta definitiva.",
      details:[["Exames","DXA, PTH, vitamina D, Ca, fósforo, TSH"],["Tratamento","Bisfosfonatos + vitamina D + cálcio"],["Consolidação","Geralmente conservadora com descarga progressiva"]]}}
},

tev:{
  region:"geral", num:"RWA Alg.26-1",
  title:"Profilaxia de TEV em Trauma",
  src:"Rockwood Adults 10ª ed. · Cap. 26",
  icon:"🩸", tags:["c","s"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Paciente tem contraindicação ABSOLUTA à profilaxia farmacológica?",
      ctx:"TCE com sangramento ativo, hemorragia medular, trombocitopenia < 50k, coagulopatia não corrigida, lesão vascular ativa.",
      yes:"r1", no:"q2"},
    r1:{type:"r",cls:"conservative",title:"Profilaxia Mecânica Exclusiva",
      txt:"Dispositivos de compressão pneumática intermitente (CPI) em ambos os MMII desde a admissão. Reavaliação diária para iniciar farmacológica assim que seguro.",
      details:[["CPI","Aplicar bilateralmente, inclusive no membro lesado se possível"],["Meias","Meias elásticas de compressão graduada"],["Reavaliação","Diária para transição para profilaxia farmacológica"]]},
    q2:{type:"q",text:"Paciente de alto risco para TEV?",
      ctx:"Fratura de pelve, acetábulo, colo femoral, trocantérica, diáfise femoral; cirurgia de grande porte; imobilização > 72h; história de TVP/TEP.",
      yes:"q3", no:"q4"},
    q3:{type:"q",text:"Cirurgia de grande porte programada nas próximas 12h?",
      yes:"r2", no:"r3"},
    r2:{type:"r",cls:"surgical",title:"Iniciar Profilaxia Farmacológica 6-12h Pós-op",
      txt:"Heparina de baixo peso molecular (HBPM) deve ser iniciada 6-12h após hemostasia cirúrgica satisfatória. Associar CPI no intraoperatório.",
      details:[["HBPM","Enoxaparina 40 mg SC 1x/dia (ou 30 mg 12/12h se alto risco)"],["Início","6-12h pós-op em pacientes de baixo risco hemorrágico"],["Duração","Mínimo 14 dias; até 35 dias em cirurgia de quadril"],["CPI","Manter até deambulação total"]]},
    r3:{type:"r",cls:"surgical",title:"Profilaxia Farmacológica Imediata",
      txt:"Iniciar HBPM o mais precocemente possível, idealmente nas primeiras 12-24h após o trauma.",
      details:[["HBPM","Enoxaparina 40 mg SC 1x/dia"],["Alternativa","Rivaroxabana 10 mg VO 1x/dia após cirurgia de quadril/joelho"],["Duração","14-35 dias dependendo do procedimento"],["CPI","Associar sempre"]]},

    q3:{type:"q",text:"Fratura instável ou irredutível: inclinação dorsal > 20°, comprimento ulnar perdido > 3 mm, intraarticular deslocada > 2 mm?",

    r3:{type:"r",cls:"surgical",title:"Placa Volar de Ângulo Fixo (Placa de Bloqueio Volar)",
      txt:"Padrão-ouro para fraturas articulares e instáveis: placa de ângulo fixo pela via de Henry modificada (FCR). Proporciona suporte a toda a cortical articular.",
      details:[["Via","Henry (FCR) — entre FCR e artéria radial"],["Placa","Volar de ângulo fixo com parafusos de bloqueio subcondrais"],["Posição dos parafusos","1-2 mm abaixo da superfície articular"],["Pós-op","Mobilização ativa do punho em 2-3 semanas"],["Artroscopia","Associar se suspeita de TFCC ou cárpica"]]},
    q5:{type:"q",text:"Fratura dorsal de cisalhamento com cominuição articular severa?",
      yes:"r4", no:"r5"},
    r4:{type:"r",cls:"surgical",title:"Placa Dorsal de Bloqueio",
      txt:"Fratura de Barton dorsal ou cominuição articular dorsal: abordagem dorsal com placa de bloqueio; elevação de fragmentos impactados + enxerto.",
      details:[["Via","Dorsal entre os compartimentos extensores 3 e 4"],["Placa","Dorsal de bloqueio (atenção ao EPL — transpor)"],["Enxerto","Cimento de fosfato de cálcio em fragmentos impactados"],["Pós-op","Mobilização após 2-3 semanas"]]},
    r5:{type:"r",cls:"surgical",title:"Redução Incruenta + Fios de Kirschner ou Fixador Externo",
      txt:"Fraturas simples instáveis, osso de boa qualidade: redução incruenta + 2-3 fios K percutâneos (técnica de Kapandji). Fixador externo para fraturas cominutivas sem osso adequado.",
      details:[["Fios K","2 radiais + 1 ulnar (Kapandji); gesso adicional 4-6 semanas"],["Fixador externo","Ponte entre 2º metacárpico e rádio; 6-8 semanas"],["Desvantagem","Rigidez do punho e dedos mais frequente"]]}}
},

frat_escafoide:{

    q2:{type:"q",text:"Fratura do polo proximal?",

    r2:{type:"r",cls:"surgical",title:"Parafuso Compressivo — Polo Proximal",

    q3:{type:"q",text:"Fratura do terço médio (cintura do escafoide) com desvio > 1 mm ou angulação DISI > 15°?",

    r3:{type:"r",cls:"surgical",title:"RAFI — Parafuso Compressivo via Percutânea ou Aberta",

      details:[["Percutâneo","Via palmar: parafuso de 3,5-4 mm canulado"],["Aberto","Via palmar (Henry FCR) se desvio severo — restaurar comprimento"],["Pós-op","Gesso 4-6 semanas; carga progressiva"],["Taxa de consolidação","90-95% com fixação"]]},
    q4:{type:"q",text:"Fratura não deslocada do terço médio ou distal?",

    r4:{type:"r",cls:"conservative",title:"Fratura do Polo Distal — Conservador",

    q5:{type:"q",text:"Paciente jovem, ativo, e aceita tratamento cirúrgico para retorno mais precoce?",
      yes:"r3", no:"r5"},
    r5:{type:"r",cls:"conservative",title:"Fratura Não Deslocada da Cintura — Gesso",
      txt:"Fratura não deslocada: gesso antebraquial com polegar por 8-12 semanas. Taxa de consolidação > 90% com imobilização adequada.",
      details:[["Gesso","Antebraquial com polegar em extensão leve e desvio radial"],["Duração","8-12 semanas dependendo do RX/TC"],["TC","Para confirmar consolidação antes de liberar carga"]]}}
},

libera_coluna_cerv:{

      details:[["RX","AP + Lateral + Odontoide (3 incidências obrigatórias)"],["C7-T1","Obrigatória visualização da junção C7-T1"],["Se inadequado","RM ou manter colarinho 48h"]]},
    q6:{type:"q",text:"TC cervical sem alterações ósseas?",

    r3:{type:"r",cls:"emergency",title:"TC Anormal — Avaliação Especializada + Manutenção do Colarinho",
      txt:"Qualquer achado na TC: manter colarinho, neurocirurgia/ortopedia de coluna, RM complementar se suspeita de lesão ligamentar.",
      details:[["RM","Indicada se déficit neurológico ou suspeita de lesão disco-ligamentar"],["Consulta","Neurocirurgia ou ortopedia de coluna"],["Colarinho","Rígido até definição do especialista"]]},
    q8:{type:"q",text:"TC normal mas paciente com dor cervical persistente ou mecanismo de alta energia?",
      yes:"r4", no:"r1"},
    r4:{type:"r",cls:"conservative",title:"RM Cervical Complementar para Lesão Ligamentar",
      txt:"TC normal + sintomas persistentes: RM para afastar lesão disco-ligamentar oculta (SCIWORA, injúria ligamentar pura).",
      details:[["RM","Protocolo STIR + T2 para lesão ligamentar e medular"],["Se RM normal","Liberação com colarinho macio 2-4 semanas (sintomático)"],["Flexão-extensão","Apenas em paciente alerta, após 2 semanas se dúvida"]]},
    q7:{type:"q",text:"Paciente inconsciente, entubado ou com GCS < 15?",
      yes:"r5", no:"r5"},
    r5:{type:"r",cls:"conservative",title:"TC Obrigatória — Colarinho Mantido Até Liberação",
      txt:"Paciente sem condições de avaliação clínica: TC multicorte obrigatória. Se TC normal: RM para lesão ligamentar. Colarinho removido apenas após protocolo completo.",
      details:[["TC","Toda a coluna cervical em cortes finos"],["Se TC normal","RM STIR cervical para ligamentos"],["Colarinho","Manter até avaliação completa (TC + RM se indicado)"]]}}
},

frat_toracolombar:{
  region:"coluna", num:"RWA Cap.49 · TLICS",
  title:"Fratura Toracolombar — Score TLICS",
  src:"Rockwood Adults 10ª ed. · Cap. 49",
  icon:"🧱", tags:["c","s","sm"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Calcular o Score TLICS (Thoracolumbar Injury Classification and Severity Score)",
      ctx:"TLICS avalia 3 domínios: (A) Morfologia da fratura; (B) Integridade do complexo ligamentar posterior (CLP); (C) Status neurológico.",
      type:"multi", options:[
        {label:"Score TLICS ≤ 3", desc:"Soma dos 3 domínios: morfologia + CLP + neurologia", next:"r1"},
        {label:"Score TLICS = 4", desc:"Indeterminado — decisão individualizada", next:"r2"},
        {label:"Score TLICS ≥ 5", desc:"Indica cirurgia", next:"q2"}
      ]},
    r1:{type:"r",cls:"conservative",title:"TLICS ≤ 3 — Tratamento Conservador",
      txt:"Fratura estável: colete TLSO por 8-12 semanas (ou mobilização precoce sem colete em fraturas por compressão simples). Deambulação precoce.",
      details:[["Compressão simples < 50%","Sem colete; deambulação com dor como guia"],["Compressão > 50% ou lesão CLP parcial","TLSO 8-12 semanas"],["Controle","RX em posição ortostática 6 semanas"],["Fisio","Programa de estabilização lombar"]]},
    r2:{type:"r",cls:"conservative",title:"TLICS = 4 — Decisão Individualizada",
      txt:"Score 4 é zona de indecisão. Avaliar individualmente: paciente jovem ativo com lesão CLP suspeita → tendência cirúrgica. Idoso frágil com lesão neurológica incompleta → conservador.",
      details:[["Jovem ativo","Tendência à cirurgia se CLP lesado"],["Idoso frágil","Conservador com TLSO"],["RM","Obrigatória para definir CLP e avaliação da medula"],["Decisão","Neurocirurgia/coluna"]]},
    q2:{type:"q",text:"Déficit neurológico completo abaixo do nível de lesão (ASIA A)?",
      ctx:"Lesão completa: objetivos são estabilização, posicionamento e prevenção de complicações.",
      yes:"r3", no:"q3"},
    r3:{type:"r",cls:"surgical-major",title:"Fixação Cirúrgica — Estabilização e Posicionamento",
      txt:"Lesão completa ASIA A: cirurgia para estabilização e facilitar cuidados/reabilitação. Descompressão tem benefício questionável mas pode melhorar nível da lesão.",
      details:[["Objetivos","Estabilização + posicionamento + prevenção de úlceras"],["Descompressão","Discutível; pode melhorar 1-2 níveis neurológicos"],["Corticóide","Não recomendado rotineiramente (NASCIS III)"],["Timing","< 24h nas lesões incompletas progressivas"]]},
    q3:{type:"q",text:"Lesão neurológica incompleta ou cauda equina?",
      yes:"r4", no:"r5"},
    r4:{type:"r",cls:"emergency",title:"Cirurgia Urgente — Descompressão em < 24h",
      txt:"Lesão incompleta ou síndrome da cauda equina: descompressão cirúrgica precoce (< 24h) melhora prognóstico neurológico. Evidência nível I-II.",
      details:[["Timing","< 24h — especialmente na síndrome da cauda equina"],["Acesso","Posterior com pedicular screws + descompressão direta"],["Instrumentação","Fusão curta (2 níveis acima e abaixo)"],["UTI","Manejo da pressão arterial (PAM > 85 mmHg por 7 dias)"]]},
    r5:{type:"r",cls:"surgical-major",title:"Cirurgia Eletiva — Estabilização Posterior",
      txt:"TLICS ≥ 5 sem déficit: cirurgia para estabilização da coluna instável. Fusão posterior percutânea ou aberta.",
      details:[["Fusão","2 níveis acima e abaixo (para explosão); 1 nível em disrupção pura"],["Percutânea","Preferida em lesões sem componente neurológico"],["Timing","48-72h (após estabilização clínica)"]]}}
},

  nodes:{

      details:[["RM","STIR coronal + axial para edema ósseo do sacro"],["Cintilografia","Alternativa: scintigrafia com Tc99m"],["Manejo","Imobilizar e analgesia enquanto aguarda imagem"]]},

      details:[["Analgesia","AINE + paracetamol + tramadol; opioides com cautela"],["Mobilização","Com andador a partir do 1º dia se tolerado"],["Bisfosfonatos","Iniciar após exclusão de osteomalacia"],["Vitamina D","Reposição obrigatória"],["Sacroplastia","Considerar em fraturas do sacro refratárias"]]},
    r4:{type:"r",cls:"conservative",title:"Alta Hospitalar Precoce com Suporte Ambulatorial",

    q5:{type:"q",text:"Paciente jovem com trauma de alta energia e instabilidade hemodinâmica?",

    r5:{type:"r",cls:"surgical-major",title:"RAFI Eletiva — Pelve Instável Sem Choque",
      txt:"Pelve instável (Tile B ou C) sem choque: fixação cirúrgica definitiva em 3-5 dias após estabilização clínica.",
      details:[["Anterior","Fixador externo ou placa de pubis"],["Posterior","Parafusos iliosacral percutâneo ou fixação de SI"],["Timing","3-5 dias pós-trauma (partes moles adequadas)"]]}}
},

},

luxacao_quadril:{

  nodes:{

frat_colo_femoral:{

      txt:"Prioridade: preservar a cabeça femoral. Redução fechada na mesa + 3 parafusos canulados. Se irredutível: via anterior (Smith-Petersen). Sem urgência após 24h, mas dentro das primeiras 12-24h é ideal.",

      details:[["Hemiartroplastia","Austin-Moore (não cimentada) ou Thompsons (cimentada — preferida)"],["ATQ","Em ativos > 65 anos sem artrose: excelentes resultados"],["Via","Posterior (MacFarland-Osborne) ou anterior direta"],["Carga","Total imediata no pós-op"]]},
    r4:{type:"r",cls:"surgical-major",title:"ATQ (Artroplastia Total do Quadril)",

    q5:{type:"q",text:"Paciente com demência severa, não deambulante ou alto risco anestésico?",

    r5:{type:"r",cls:"conservative",title:"Conservador Paliativo — Casos Selecionados",
      txt:"Paciente não cirúrgico: analgesia + mobilização em leito + cuidados de enfermagem. Tração de conforto pode ajudar. Discutir com família.",

},

  nodes:{
    q1:{type:"q",text:"Déficit neurovascular: pulso poplíteo ausente ou assimétrico?",

      details:[["1º tempo","RAFI do platô ou côndilos em 1-2 semanas"],["2º tempo","Reconstrução LCA/LCP/canto com aloenxerto 2-4 semanas após"],["Imobilização","Órtese articulada; mobilização após estabilização"]]},

    r5:{type:"r",cls:"surgical",title:"KD I/II — Reconstrução Precoce em 2-4 Semanas",

    q3:{type:"q",text:"TCE com GCS < 13 ou anisocoria?",
      ctx:"TCE grave em criança: hipertensão intracraniana + Cushing (bradicardia + hipertensão + Cheyne-Stokes).",
      yes:"r3", no:"q4"},
    r3:{type:"r",cls:"emergency",title:"Medidas Anti-hipertensão Intracraniana",
      txt:"HIC pediátrica: cabeceira 30°, normoventilar (pCO2 35-40 mmHg), manitol 0,25-1 g/kg. Neurocirurgia urgente se hematoma expansivo.",
      details:[["Cabeceira","30°, linha média"],["Manitol","0,25-1 g/kg IV; hiperventilação apenas se herniação iminente"],["pCO2","Manter 35-40 mmHg; hiperventilação temporária se herniação"],["Neurocirurgia","Hematoma epidural: craniectomia de urgência"]]},
    q4:{type:"q",text:"Abdome instável (FAST positivo com hipotensão)?",
      yes:"r4", no:"r5"},
    r4:{type:"r",cls:"emergency",title:"Laparotomia Exploradora de Urgência",
      txt:"FAST positivo + instabilidade: laparotomia de urgência. Em crianças estáveis: TC abdominal antes da cirurgia.",
      details:[["Estável","TC abdominal + manejo conservador de órgãos sólidos (baço, fígado)"],["Instável","Laparotomia imediata"],["Baço","Salvar se possível — criança: risco de sepse pós-esplenectomia"]]},
    r5:{type:"r",cls:"surgical",title:"Fraturas do Esqueleto — Estabilização em Ordem de Prioridade",
      txt:"Após estabilização das lesões vitais: tratar fraturas por ordem de prioridade (coluna > pelve > fêmur > outros).",
      details:[["Coluna","Imobilizar e confirmar via TC e RM"],["Pelve","Cinta pélvica se instável; fixação diferida"],["Fêmur","TENS ou gesso espica dependendo da idade"],["Membro superior","Fios K ou gesso; pode diferir 24-48h se estável"]]}}
},

osteomielite_septica_ped:{
  region:"pediatria", num:"CAP.12",
  title:"Suspeita de Osteomielite/Artrite Séptica na Criança",
  src:"Lovell and Winter's Pediatric Orthopaedics, 8th ed. — Cap. 12 Musculoskeletal Infection",
  icon:"🦠", tags:["p","e","s"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Há sinal clínico de comprometimento articular (derrame, dor à mobilização passiva, postura antálgica) associado à claudicação ou recusa de apoio de carga?",
      ctx:"Diferencia artrite séptica (processo articular, emergência principalmente no quadril) de osteomielite hematogênica aguda isolada (processo ósseo, sem sinais articulares). É essencial localizar clinicamente o foco antes de escolher a via diagnóstica.",
      yes:"q2", no:"q4"},
    q2:{type:"q",text:"Aplicando os critérios de Kocher, a criança apresenta 3 ou mais dos 4 preditores: recusa de sustentar peso, febre >38,5°C, VHS ≥40mm/h e leucócitos >12.000/mm³?",
      ctx:"Com 3 preditores a probabilidade estimada de artrite séptica é de aproximadamente 93%; com os 4, aproximadamente 99% (estudo original). O escore complementa, mas não substitui, a punção articular e o julgamento clínico.",
      yes:"q3", no:"r1"},
    q3:{type:"q",text:"A punção articular (guiada por USG quando disponível) confirma líquido purulento/turvo e/ou leucocitose sinovial compatível com infecção (tipicamente >50.000/mm³, com predomínio de polimorfonucleares)?",
      ctx:"A aspiração articular é o padrão-ouro diagnóstico e, sempre que possível, deve ser realizada antes do início do antibiótico para não comprometer a cultura.",
      yes:"r2", no:"r3"},
    q4:{type:"q",text:"A RM (ou radiografia simples/cintilografia óssea, se RM indisponível) demonstra abscesso subperiosteal ou intraósseo?",
      ctx:"Na osteomielite hematogênica aguda sem sinais articulares, a indicação cirúrgica depende da presença de coleção purulenta demonstrada por imagem. A aspiração óssea para cultura deve ser realizada sempre que possível antes do antibiótico.",
      yes:"r4", no:"r5"},
    r1:{type:"r",cls:"conservative",title:"Provável Sinovite Transitória — Conduta Conservadora",
      txt:"Baixa probabilidade de artrite séptica pelos critérios de Kocher. Manter observação clínica, repouso relativo, analgesia e reavaliação em 24-48 horas, com repetição de exames se a claudicação ou a febre persistirem.",
      details:[["Critérios de Kocher positivos","0-2 de 4"],["Probabilidade estimada de artrite séptica","≈2-40%"],["Conduta","Observação clínica + reavaliação em 24-48h"],["Sinal de alerta","Piora clínica, febre persistente ou claudicação além de 72h → reavaliar e considerar punção"]]},
    r2:{type:"r",cls:"emergency",title:"Artrite Séptica Confirmada — Drenagem Cirúrgica de Urgência",
      txt:"Líquido purulento/turvo e/ou leucocitose sinovial confirmam artrite séptica. No quadril, trata-se de verdadeira emergência cirúrgica pelo risco de necrose avascular da cabeça femoral por hipertensão intra-articular. Indicada artrotomia/drenagem cirúrgica (abordagem anterior preferencial no quadril) associada a antibioticoterapia parenteral imediata após coleta de culturas.",
      details:[["Líquido sinovial","Purulento/turvo, predomínio de PMN"],["Leucócitos sinoviais","Tipicamente >50.000/mm³"],["Conduta","Desbridamento cirúrgico de urgência + drenagem com cateter de sucção"],["Antibiótico","Parenteral empírico, iniciado logo após a coleta de culturas"],["Quadril","Emergência cirúrgica verdadeira — risco de necrose avascular do quadril"]]},
    r3:{type:"r",cls:"conservative",title:"Diagnóstico Não Confirmado — Investigar Diferenciais",
      txt:"Derrame/aspiração não confirmam artrite séptica apesar de critérios de Kocher positivos. Reavaliar diagnósticos diferenciais (sinovite transitória, artrite idiopática juvenil, febre reumática pelos critérios de Jones, doença de Lyme) e repetir exames laboratoriais/imagem se a suspeita clínica persistir.",
      details:[["Diferenciais a excluir","Sinovite transitória, JIA, febre reumática (Jones), doença de Lyme"],["Conduta","Observação clínica seriada + reavaliação laboratorial"],["Reaspiração","Considerar se houver piora clínica"]]},
    r4:{type:"r",cls:"surgical",title:"Osteomielite Aguda com Abscesso — Desbridamento Cirúrgico",
      txt:"A presença de abscesso subperiosteal ou intraósseo na imagem exige desbridamento cirúrgico associado a antibioticoterapia parenteral, com fechamento sobre dreno e posterior conversão para via oral conforme resposta clínica e laboratorial.",
      details:[["Achado de imagem","Abscesso subperiosteal ou intraósseo"],["Conduta","Desbridamento cirúrgico + drenagem, fechamento sobre dreno"],["Antibiótico","Parenteral inicial → conversão para via oral após resposta favorável"],["Duração total","≈3 semanas, conforme evolução clínica/laboratorial (PCR)"]]},
    r5:{type:"r",cls:"conservative",title:"Osteomielite Aguda sem Abscesso — Tratamento Clínico",
      txt:"Na ausência de abscesso à imagem, a cirurgia não é indicada. Iniciar antibioticoterapia parenteral empírica com cobertura para S. aureus, convertendo para via oral após melhora clínica e queda da PCR.",
      details:[["Achado de imagem","Sem abscesso subperiosteal/intraósseo"],["Conduta","Antibioticoterapia parenteral, sem cirurgia"],["Conversão para via oral","Após resposta clínica favorável"],["Duração total","≈3 semanas, conforme evolução clínica/laboratorial"]]}
  }
},

// ===== Cap.13 Bone and Soft Tissue Tumors ===== (CORRECTED/rebuilt version — from the second, fixed extraction pass)

lesao_ossea_suspeita_ped:{
  region:"pediatria", num:"CAP.13",
  title:"Abordagem da Lesão Óssea Suspeita na Criança",
  src:"Lovell and Winter's Pediatric Orthopaedics — Cap. 13 Bone and Soft Tissue Tumors",
  icon:"🎗️", tags:["p","e"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"A radiografia mostra margem geográfica bem definida, com borda esclerótica nítida, sem reação periosteal agressiva e sem massa de partes moles?", ctx:"Lesão bem circunscrita (ex.: fibroma não ossificante, cisto ósseo simples) versus padrão apolilhado/permeativo com transição mal definida sugerindo agressividade.", yes:"q2", no:"q3"},
    q2:{type:"q",text:"A lesão é pequena (< 50% do diâmetro do osso), assintomática ou com dor leve, sem fratura patológica e com localização/idade típicas de lesão benigna (ex.: metáfise em criança com fibroma não ossificante ou cisto ósseo simples)?", ctx:"Achado incidental ou dor discreta, sem sinais sistêmicos, sem elevação de FA/LDH/VHS relevante.", yes:"r1", no:"r2"},
    q3:{type:"q",text:"Há reação periosteal agressiva (triângulo de Codman, padrão em «casca de cebola» ou «raios de sol»), massa de partes moles associada, ou padrão de destruição apolilhado/permeativo?", ctx:"Achados radiográficos clássicos de osteossarcoma e sarcoma de Ewing descritos no capítulo.", yes:"r3", no:"q4"},
    q4:{type:"q",text:"A criança apresenta dor progressiva que piora à noite e não está claramente relacionada à atividade, associada a massa palpável em crescimento, fratura patológica, ou alterações laboratoriais (VHS muito elevado, FA ou LDH aumentados)?", ctx:"Dor noturna progressiva não ligada a atividade é típica de tumor maligno; dor noturna aliviada por AINE sugere osteoma osteoide (lesão benigna com padrão de dor diagnóstico).", yes:"r4", no:"r1"},
    r1:{type:"r",cls:"conservative",title:"Observação clínica e radiográfica — provável lesão benigna latente",txt:"Padrão radiográfico não agressivo e apresentação clínica típica de lesão benigna (ex.: fibroma não ossificante, defeito cortical fibroso, cisto ósseo simples pequeno). Biópsia geralmente desnecessária.",details:[["Conduta","Seguimento radiográfico periódico até maturidade esquelética ou resolução"],["Sinal de alerta","Reavaliar se surgir dor progressiva, aumento de tamanho ou fratura patológica"],["Fonte","Cap. 13, NOF/defeito cortical fibroso — biópsia geralmente desnecessária"]]},
    r2:{type:"r",cls:"surgical",title:"Lesão benigna ativa — avaliação ortopédica eletiva",txt:"Lesão com risco de fratura patológica (ex.: cisto ósseo simples ou fibroma não ossificante maior, ativo) ou sintomática, sem sinais de agressividade radiográfica. Encaminhar para ortopedista para decidir entre observação estruturada, curetagem/enxerto ou tratamento minimamente invasivo.",details:[["Conduta","Avaliação eletiva por ortopedista (não emergencial)"],["Risco","Lesões >50% do diâmetro do osso têm maior risco de fratura patológica"],["Fonte","Cap. 13, Cisto Ósseo Unicameral e Fibroma Não Ossificante"]]},
    r3:{type:"r",cls:"emergency",title:"Padrão radiográfico agressivo — encaminhamento urgente à oncologia ortopédica",txt:"Reação periosteal agressiva e/ou massa de partes moles associada são sinais clássicos de sarcoma primário ósseo (osteossarcoma, sarcoma de Ewing). Não realizar biópsia fora de um centro especializado — biópsia mal planejada compromete o tratamento definitivo (inclusive risco de amputação desnecessária).",details:[["Conduta","Encaminhamento urgente a centro de oncologia ortopédica pediátrica"],["Biópsia","Somente planejada em conjunto com a equipe que fará o tratamento definitivo"],["Exames complementares","RM local, TC de tórax, VHS/PCR, FA, LDH; estadiamento (Enneking/AJCC) antes de qualquer procedimento"],["Fonte","Cap. 13, Reação Periosteal e Biópsia — sociedade de tumores musculoesqueléticos"]]},
    r4:{type:"r",cls:"surgical-major",title:"Sinais clínicos de alarme — investigação oncológica completa",txt:"Dor progressiva não relacionada à atividade, que desperta a criança à noite, associada a massa em crescimento, fratura patológica ou alterações laboratoriais, exige investigação completa mesmo com radiografia inicial equívoca — tumores malignos podem ter apresentação radiográfica sutil em fase inicial.",details:[["Conduta","RM da lesão + laboratório completo (VHS, PCR, FA, LDH, cálcio/fósforo) e encaminhamento à oncologia ortopédica"],["Diagnóstico diferencial","Considerar abscesso de Brodie (osteomielite subaguda) se dor não aliviada por AINE; osteoma osteoide se dor noturna aliviada por AINE/aspirina"],["Fonte","Cap. 13, Queixa Principal — características da dor"]]}
  }
},

quadril_pc_vigilancia:{
  region:"pediatria", num:"CAP.14",
  title:"Vigilância e Manejo do Quadril na Paralisia Cerebral",
  src:"Lovell and Winter's Pediatric Orthopaedics, 8ª edição, Cap.14 — Cerebral Palsy (Shore, Thomason, Reid, Shrader, Graham)",
  icon:"🧠", tags:["p","c","s","sm"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Criança com PC confirmada está em GMFCS nível I, sem alterações ao exame clínico do quadril (abdução simétrica, sem contratura)?", ctx:"A vigilância do quadril na PC é estratificada pelo nível GMFCS — quanto maior o nível, maior o risco de deslocamento (I ≈ risco basal da população geral; V ≈ 90%).", yes:"r1", no:"q2"},
    q2:{type:"q",text:"Radiografia de bacia em AP, com técnica padronizada, mostra Índice de Migração (MP) de Reimers menor que 30%?", ctx:"MP = percentual da cabeça femoral não coberta pelo acetábulo; erro de medida aceitável <10%.", yes:"r2", no:"q3"},
    q3:{type:"q",text:"MP entre 30% e 40%, com progressão confirmada em 2 ou mais radiografias seriadas, em criança ambulante (GMFCS II-III) com contratura de adutores/flexores do quadril?", yes:"r3", no:"q4"},
    q4:{type:"q",text:"MP maior que 40% — mantido por mais de 12 meses após liberação de partes moles, ou já presente ao diagnóstico em criança maior de 8 anos — sem deformidade grave de cabeça femoral/acetábulo e com condição clínica otimizável para cirurgia?", yes:"r4", no:"q5"},
    q5:{type:"q",text:"Quadril já luxado, doloroso, com deformidade grave e não passível de reconstrução?", yes:"r5", no:"r6"},
    r1:{type:"r",cls:"conservative",title:"Vigilância mínima — GMFCS I",txt:"Risco de deslocamento do quadril semelhante ao da população geral; radiografia apenas se surgirem achados no exame clínico.",details:[["Conduta","Exame clínico periódico do quadril"],["Radiografia","Somente se houver sinais clínicos de risco"],["Nível GMFCS","I"]]},
    r2:{type:"r",cls:"conservative",title:"Vigilância radiográfica seriada",txt:"Quadril estável (MP<30%); manter radiografias seriadas com frequência de acordo com o nível GMFCS, sem indicação cirúrgica neste momento.",details:[["MP","< 30%"],["Frequência GMFCS II-III","anual"],["Frequência GMFCS IV-V","a cada 6-12 meses"],["Intervenção cirúrgica","Não indicada"]]},
    r3:{type:"r",cls:"surgical",title:"Cirurgia preventiva de partes moles",txt:"Liberação cirúrgica de adutores (± iliopsoas sobre a borda pélvica) para deter a progressão da migração e reduzir o efeito de tesoura (scissoring), idealmente em criança mais jovem.",details:[["MP","30-50% e progressiva"],["Procedimento","Liberação de adutor longo + grácil ± psoas"],["Melhor resultado","GMFCS II-III, crianças mais jovens"],["Meta","Prevenir progressão para deslocamento"]]},
    r4:{type:"r",cls:"surgical-major",title:"Cirurgia reconstrutiva do quadril",txt:"Reconstrução óssea — liberação de adutores + osteotomia femoral de varização/derrotação (VDRO) ± osteotomia pélvica — indicada por MP persistentemente >40% ou como cirurgia índice em criança maior.",details:[["MP","> 40%"],["Componentes","Liberação de adutores + VDRO ± osteotomia pélvica"],["Pré-operatório","Otimizar nutrição, quadro respiratório e constipação"],["Complicações relatadas","~50% clínicas / ~10% cirúrgicas"]]},
    r5:{type:"r",cls:"surgical-major",title:"Cirurgia de salvamento",txt:"Indicada para quadril luxado, doloroso, não passível de reconstrução; nenhuma técnica de salvamento é totalmente previsível — priorizar controle da dor e otimização clínica antes da cirurgia.",details:[["Indicação","Deslocamento doloroso irredutível"],["Opções","Osteotomia de ressecção proximal do fêmur, McHale, artroplastia"],["Alternativa temporária","Infiltração intra-articular + toxina botulínica em adutores/flexores"],["Prognóstico","Resultados imprevisíveis; equipe multidisciplinar essencial"]]},
    r6:{type:"r",cls:"conservative",title:"Otimização clínica e reavaliação",txt:"Quadril deslocado ou com deformidade grave, porém sem dor incapacitante no momento; otimizar saúde geral e reavaliar periodicamente antes de indicar cirurgia de salvamento.",details:[["Conduta","Controle da dor, posicionamento, cuidados de higiene"],["Reavaliação","Multidisciplinar periódica"],["Gatilho para salvamento","Dor refratária ou piora funcional"]]}
  }
},

escoliose_idiopatica_ped:{region:'pediatria', num:'LW Cap.16', title:'Escoliose Idiopática em Paciente Esqueleticamente Imaturo', src:'Yaszay B, Newton PO, Cap.16 Idiopathic Scoliosis, In: Lovell and Winter\'s Pediatric Orthopaedics, p.2043-2284', icon:'🦴', tags:['p','c','s','sm','e'], start:'q1', nodes:{
q1:{type:'q', text:'Presença de sinais de alerta para causa não idiopática (dor intensa/noturna, curva torácica esquerda, início <10 anos, déficit neurológico, cavo unilateral, reflexo abdominal cutâneo assimétrico)?', ctx:'Escoliose idiopática é diagnóstico de exclusão — achados atípicos exigem RM de neuroeixo completo antes de aplicar os critérios de manejo abaixo.', yes:'r1', no:'q2'},
q2:{type:'q', text:'Ângulo de Cobb na radiografia PA em pé <10°?', ctx:'Abaixo de 10° é considerada assimetria espinhal normal, não escoliose verdadeira.', yes:'r2', no:'q3'},
q3:{type:'q', text:'Curva entre 10-24° em paciente com crescimento remanescente significativo (Risser 0-2, pré/perimenárquica ou Sanders <6)?', ctx:'Risco de progressão é inversamente proporcional à maturidade esquelética.', yes:'r3', no:'q4'},
q4:{type:'q', text:'Curva progressiva (aumento ≥6° documentado) ou magnitude ≥25° em paciente ainda imaturo (Risser ≤2)?', ctx:'Indicação clássica de órtese: ≥25° com crescimento remanescente; considerar já em 20° se forte história familiar de progressão.', yes:'r4', no:'q5'},
q5:{type:'q', text:'Curva torácica ≥40-50° em paciente imaturo, OU ≥50° em paciente maduro, OU deformidade de tronco desproporcional ao Cobb (translação/rotação apical importante)?', ctx:'Os limiares de Cobb são orientadores — considerar também padrão de curva e balanço do tronco.', yes:'q6', no:'r5'},
q6:{type:'q', text:'Curva torácica dominante (padrão Lenke 1) com componente lombar flexível (<25° no bending) e boa correspondência clínica?', ctx:'Avaliar viabilidade de fusão seletiva torácica, poupando segmentos lombares.', yes:'r6', no:'r7'},
r1:{type:'r', cls:'emergency', title:'Suspeita de Escoliose Não Idiopática — Investigação Adicional', txt:'Achados de alerta sugerem etiologia não idiopática (intraespinal, neuromuscular, congênita). Solicitar RM de neuroeixo completo e reavaliação neurológica detalhada antes de aplicar os critérios de escoliose idiopática.', details:[['Sinais de alerta','Dor intensa/noturna, curva torácica esquerda, início <10 anos, déficit neurológico, cavo unilateral, reflexo abdominal assimétrico'],['RM','Neuroeixo completo — da fossa posterior ao sacro'],['Achados a excluir','Siringomielia, malformação de Chiari, medula presa, tumor intraespinal'],['Encaminhamento','Neurocirurgia se lesão intraespinal confirmada']]},
r2:{type:'r', cls:'conservative', title:'Assimetria Espinhal — Sem Escoliose', txt:'Curva <10° é considerada assimetria espinhal normal. Reforçar orientação e devolver ao acompanhamento pediátrico de rotina.', details:[['Conduta','Alta para pediatra; sem necessidade de radiografia seriada'],['Reavaliação','Se novo achado no exame físico em consulta de rotina']]},
r3:{type:'r', cls:'conservative', title:'Observação Clínica e Radiográfica', txt:'Curva leve (10-24°) com crescimento remanescente: seguimento periódico para detectar progressão precocemente.', details:[['Intervalo padrão','A cada 6-12 meses'],['Fase de crescimento rápido','A cada 4-6 meses'],['Critério de progressão','Aumento ≥6° no Cobb entre exames'],['Após maturidade','Radiografia a cada ~5 anos se curva >30°']]},
r4:{type:'r', cls:'conservative', title:'Indicação de Órtese (Colete)', txt:'Curva progressiva ≥25° (ou 20° com forte história familiar) em paciente com crescimento remanescente: tratamento com órtese para modular o crescimento e evitar progressão até a maturidade.', details:[['Tipo','TLSO para ápice abaixo de T7; órtese noturna de flexão para curva toracolombar/lombar única'],['Uso recomendado','18-20h/dia — efeito dose-dependente (BRAIST)'],['Meta in-brace','≥50% correção (TLSO) ou >75% (órtese noturna)'],['Limite superior','Curva até ~40-45°'],['Seguimento','Radiografia fora do colete a cada 6 meses']]},
r5:{type:'r', cls:'conservative', title:'Observação Estendida — Sem Critério Cirúrgico', txt:'Curva não atinge o limiar cirúrgico e/ou o desequilíbrio de tronco não justifica cirurgia neste momento. Manter observação; reconsiderar órtese se ainda imaturo e progressiva.', details:[['Reavaliação','A cada 4-6 meses se em crescimento rápido'],['Reconsiderar órtese','Se progressão ≥6° documentada e Risser ≤2'],['Sinal para cirurgia','Progressão contínua após maturidade ou piora clínica do tronco']]},
r6:{type:'r', cls:'surgical', title:'Fusão Seletiva Torácica', txt:'Padrão de curva torácica dominante com componente lombar flexível: fusão instrumentada limitada à curva torácica, poupando os segmentos lombares.', details:[['Nível distal','Vértebra estável ou 1 nível proximal a ela'],['Requisito','Curva lombar corrige para <25° no bending'],['Risco','Descompensação do tronco pós-operatória se indicação inadequada'],['Abordagem','Instrumentação posterior com parafusos pediculares']]},
r7:{type:'r', cls:'surgical-major', title:'Artrodese Instrumentada Torácica e Lombar', txt:'Curva grande e/ou dupla estrutural (padrões Lenke 2, 3, 4 ou 6), ou deformidade de tronco desproporcional: artrodese instrumentada abrangendo torácica e lombar conforme a classificação de Lenke.', details:[['Seleção de níveis','Definida pelo tipo de curva de Lenke + modificador lombar + modificador sagital torácico'],['Abordagem','Instrumentação posterior segmentar com parafusos pediculares'],['Alternativa fusionless','Tethering vertebral anterior em curva de 45-65° com 2-3 anos de crescimento remanescente'],['Objetivo','Impedir progressão e obter realinhamento 3D preservando segmentos lombares móveis']]}}
},

// ===== Cap.19 Spondylolysis and Spondylolisthesis =====
espondilolistese_ped:{region:'pediatria', num:'19', title:'Espondilólise e Espondilolistese — Avaliação e Conduta', src:'Andras L, Luhmann SJ, Skaggs DL, Cap.19 Spondylolysis and Spondylolisthesis, In: Lovell and Winter\'s Pediatric Orthopaedics, p.2528-2609', icon:'🦴', tags:['p','c','s','sm','e'], start:'q1', nodes:{
q1:{type:'q', text:'O achado de espondilólise/espondilolistese é incidental, em radiografia obtida por outro motivo, em paciente completamente assintomático?', ctx:'Ex.: avaliação de escoliose ou radiografia de trauma. Espondilólise/listese leve não causa necessariamente lombalgia — a presença radiográfica não implica que seja a causa da queixa do paciente.', yes:'r1', no:'q2'},
q2:{type:'q', text:'Há déficit neurológico agudo ou progressivo (síndrome da cauda equina, disfunção esfincteriana, fraqueza motora, claudicação neurogênica) ou instabilidade grave ao exame?', ctx:'Avaliar reflexo aquileu, força do extensor longo do hálux, sensibilidade perineal, marcha (padrão de Phalen-Dickson: flexão de quadris e joelhos na marcha) e encurtamento de isquiotibiais. Sinais neurológicos são raros mas mais prováveis em graus altos (dysplásicos, arco neural intacto).', yes:'r2', no:'q3'},
q3:{type:'q', text:'Ao medir em radiografia em perfil ortostática (com carga), o escorregamento é ≥50% (Meyerding grau III, IV ou V) e/ou o ângulo de escorregamento (cifose lombossacral) é maior que +45°?', ctx:'Radiografia em perfil, de pé, é o exame inicial de escolha. Se negativa mas com alta suspeita clínica, complementar com RM (preferível, sem radiação, avalia atividade inflamatória/edema ósseo) ou TC/cintilografia SPECT para o defeito da pars.', yes:'q4', no:'q5'},
q4:{type:'q', text:'Trata-se de espondiloptose grau V ou o escorregamento permanece irredutível mesmo em estudo de posicionamento (RM/TC em decúbito prono)?', ctx:'Escorregamentos graves que não reduzem exigem estratégia diferente daqueles parcialmente redutíveis — o objetivo nunca é a redução completa, pelo risco de estiramento das raízes L5/S1.', yes:'r5', no:'r4'},
q5:{type:'q', text:'Os sintomas persistem ou são incapacitantes após um período adequado (4 a 6 meses) de tratamento conservador bem conduzido (restrição de atividades, órtese TLSO/LSO por 6-12 semanas e fisioterapia)?', ctx:'A maioria dos pacientes com espondilólise/listese de baixo grau melhora com tratamento conservador; a cirurgia só é considerada após falha documentada dessa abordagem, exceto se houver indicação absoluta (déficit neurológico ou escorregamento ≥50%).', yes:'q6', no:'r3'},
q6:{type:'q', text:'O defeito é ístmico, com atividade metabólica confirmada em RM/cintilografia, sem doença discal degenerativa adjacente e sem sintomas radiculares associados?', ctx:'Estes são os critérios para candidatura ao reparo direto da pars interarticularis, uma alternativa que preserva o segmento móvel em pacientes jovens.', yes:'r6', no:'r7'},
r1:{type:'r', cls:'conservative', title:'Observação — achado incidental assintomático', txt:'Nenhuma restrição de atividade ou esportiva é necessária. No paciente em crescimento, repetir radiografia em perfil ortostática ao final do crescimento para monitorar eventual progressão do escorregamento. No paciente com crescimento completo e sem sintomas, nenhum seguimento adicional é necessário.', details:[['Conduta','Observação, sem restrição de atividades'],['Seguimento','Radiografia ao final do crescimento se esqueleto imaturo'],['Prognóstico','História natural geralmente benigna']]},
r2:{type:'r', cls:'emergency', title:'Avaliação cirúrgica urgente — déficit neurológico', txt:'Déficit neurológico agudo ou progressivo (especialmente síndrome da cauda equina) exige RM urgente para avaliar compressão neural e programação cirúrgica em caráter de urgência, com descompressão radicular ampla (laminectomia de L5, foraminotomia bilateral) associada a artrodese instrumentada. Todo déficit pré-operatório, independentemente do grau de escorregamento, deve ser descomprimido.', details:[['Conduta','Descompressão + artrodese instrumentada em caráter de urgência'],['Exame','RM de urgência para mapear compressão neural'],['Observação','Estabilização espinhal costuma ser necessária pela desestabilização causada pela descompressão ampla']]},
r3:{type:'r', cls:'conservative', title:'Manter tratamento conservador — baixo grau, respondendo ao tratamento', txt:'Escorregamento <50% sem déficit neurológico e com melhora, ainda que parcial, sob tratamento conservador: manter observação, modificação de atividades, órtese e fisioterapia de fortalecimento do core, evitando extremos de extensão lombar. Retorno gradual ao esporte quando assintomático; considerar cinta de baixo perfil em casos crônicos para permitir retorno esportivo mesmo sem consolidação óssea completa.', details:[['Grau','Meyerding I-II (<50%)'],['Órtese','TLSO/LSO ou cinta sacroilíaca por 6-12 semanas'],['Retorno ao esporte','Gradual, após controle da dor, tipicamente em 2-4 meses']]},
r4:{type:'r', cls:'surgical-major', title:'Artrodese circunferencial com redução parcial — alto grau redutível', txt:'Escorregamento grau III-IV que não reduz espontaneamente ao posicionamento cirúrgico: indicada artrodese circunferencial (fusão posterior instrumentada com parafusos pediculares associada a fusão intersomática anterior/ALIF), com descompressão radicular ampla de L5 (e S1 se necessário) antes de qualquer manobra de redução. Buscar correção parcial da translação e, principalmente, do ângulo de escorregamento (cifose lombossacral), sem perseguir redução completa pelo risco de radiculopatia iatrogênica de L5/S1. Considerar extensão da fusão a L4 e fixação sacropélvica quando indicado.', details:[['Grau','Meyerding III-IV (≥50%) ou ângulo de escorregamento >45°'],['Técnica','Artrodese circunferencial (posterior + ALIF), redução parcial'],['Cuidado principal','Descompressão neural ampla antes da redução, evitando estiramento radicular'],['Fixação adicional','Considerar extensão a L4 e fixação sacropélvica']]},
r5:{type:'r', cls:'surgical-major', title:'Fixação in situ — espondiloptose grau V / escorregamento irredutível', txt:'Nos escorregamentos graves e irredutíveis, incluindo espondiloptose grau V, o objetivo é proteger as raízes nervosas, aliviar a dor e melhorar a cifose lombossacral — não a redução completa da translação. Realizar fixação in situ por via posterior, com parafusos pediculares de L5 estendidos através do disco L5-S1 até o corpo de S1 (proporcionando suporte anterior), associada a descompressão radicular ampla e osteotomia do promontório sacral quando houver bloqueio ósseo posterior à dura-máter. Considerar fixação sacropélvica.', details:[['Grau','Meyerding V (espondiloptose) ou escorregamento irredutível'],['Técnica','Fixação in situ, parafusos de L5 estendidos ao corpo de S1'],['Objetivo','Proteção neural e correção da cifose — não a redução completa'],['Adjunto','Osteotomia do promontório sacral se houver obstrução dural']]},
r6:{type:'r', cls:'surgical', title:'Reparo direto da pars interarticularis', txt:'Em espondilólise ou escorregamento mínimo que reduz ao posicionamento, sem degeneração discal adjacente, com atividade metabólica confirmada em RM/cintilografia e sem sintomas radiculares: reparo direto do istmo (técnica de parafuso pedicular com gancho infralaminar, ou fios/cerclagem), preservando o segmento de movimento. Retorno ao esporte geralmente liberado em torno de 3 meses, após confirmação radiográfica/tomográfica da consolidação.', details:[['Indicação ideal','Espondilólise/listese mínima, L5 lordótico, sem doença discal'],['Técnica','Osteossíntese direta da pars (parafuso+gancho ou cerclagem) com enxerto ósseo local'],['Contraindicação relativa','Ausência de atividade metabólica na RM, sintomas radiculares']]},
r7:{type:'r', cls:'surgical', title:'Artrodese L5-S1 instrumentada — baixo grau refratário', txt:'Paciente não candidato a reparo direto da pars (defeito crônico/sem atividade metabólica, doença discal adjacente ou sintomas radiculares): fusão posterolateral instrumentada com parafusos pediculares de L5-S1, com forte consideração de fusão anterior associada (ALIF) para aumentar a área de superfície de fusão disponível, especialmente em atletas de alto rendimento que desejam retornar à competição.', details:[['Indicação','Falha do tratamento conservador, sem critérios para reparo direto'],['Técnica','Artrodese posterolateral instrumentada L5-S1 ± ALIF'],['Retorno ao esporte','Tipicamente liberado aos 3 meses, com confirmação de fusão por TC limitada']]}}
},

// ===== Cap.20 The Cervical Spine =====
torcicolo_atlantoaxial_ped:{region:'pediatria', num:'20', title:'Torcicolo Pediátrico e Instabilidade Atlantoaxial — Diagnóstico Diferencial e Conduta', src:'El-Hawary R, Pahys JM, Cap.20 The Cervical Spine, In: Lovell and Winter\'s Pediatric Orthopaedics — p.2641-2708, 2728-2749, 2778, 2798-2799', icon:'🦴', tags:['p','c','s','sm','e'], start:'q1', nodes:{
q1:{type:'q', text:'Lactente com torcicolo (inclinação cefálica + rotação do queixo para o lado oposto), com massa ou contratura firme e não dolorosa no ventre do esternocleidomastóideo, início nas primeiras semanas de vida, sem sinais neurológicos e com radiografia cervical simples normal?', ctx:'Torcicolo muscular congênito é a causa mais comum de torcicolo no lactente (idade mediana de apresentação: 2 meses). Ultrassonografia do ECM ajuda a diferenciar de outras causas.', yes:'q2', no:'q3'},
q2:{type:'q', text:'Défice de rotação cervical passiva igual ou maior que 30 graus e/ou assimetria facial (plagiocefalia) já estabelecida, OU falha de resposta a um programa supervisionado de alongamento por 6 a 12 meses em criança com mais de 1 ano de idade?', ctx:'Fibrose que acomete todo o comprimento do músculo ao ultrassom prediz maior chance de necessidade cirúrgica (até 35%), enquanto fibrose restrita ao terço inferior responde bem à fisioterapia.', yes:'r2', no:'r1'},
q3:{type:'q', text:'Início agudo/subagudo em criança maior (pré-escolar ou escolar) de torcicolo doloroso, tipo «cocked-robin», com resistência à mobilização passiva, geralmente precedido por infecção de vias aéreas superiores, trauma cervical leve (ex.: fratura de clavícula) ou cirurgia otorrinolaringológica, com espasmo do esternocleidomastóideo do lado oposto à rotação?', ctx:'Padrão sugestivo de subluxação/fixação rotatória atlantoaxial (AARF), incluindo a síndrome de Grisel pós-infecciosa. O diagnóstico é primariamente clínico.', yes:'q4', no:'q5'},
q4:{type:'q', text:'Sintomas presentes há menos de 4 semanas?', ctx:'Casos com menos de 1 mês de evolução são geralmente os mais leves e mais responsivos ao tratamento não cirúrgico.', yes:'r3', no:'q4b'},
q4b:{type:'q', text:'Há comprometimento neurológico, deslocamento anterior de C1 sobre C2 (Fielding-Hawkins tipo II a IV), falha em obter ou manter a redução após tração, deformidade presente há mais de 3 meses, ou recidiva após um período adequado de tratamento conservador (imobilização de pelo menos 6 semanas)?', ctx:'Estas são as indicações formais de artrodese C1-C2 posterior segundo o capítulo.', yes:'r4', no:'r3'},
q5:{type:'q', text:'Há sinais de alerta — sinais neurológicos (hiperreflexia, fraqueza, alteração de marcha, incontinência), instabilidade craniocervical conhecida ou de risco (síndrome de Down, os odontoideum, invaginação basilar, displasias esqueléticas, síndrome de Klippel-Feil) ou torcicolo atípico/progressivo apesar de tratamento adequado?', ctx:'Causas neurogênicas (tumor de fossa posterior, malformação de Chiari, tumor medular), oculares e outras devem ser consideradas quando o torcicolo não se enquadra no padrão de TMC ou AARF.', yes:'q6', no:'r3'},
q6:{type:'q', text:'Exames de imagem (RM/TC) evidenciam compressão medular aguda — sinal medular em T2, ADI acentuadamente aumentado com SAC criticamente reduzido — associada a déficit neurológico agudo ou rapidamente progressivo?', ctx:'Nesta situação, o risco de lesão medular catastrófica é iminente.', yes:'r5', no:'q7'},
q7:{type:'q', text:'Critérios radiográficos de instabilidade estão confirmados mesmo sem compressão medular aguda (ex.: ADI 5 mm ou mais / SAC 14 mm ou menos na síndrome de Down; ADI 10 mm ou mais / SAC 13 mm ou menos no os odontoideum), especialmente com anomalia óssea associada (os odontoideum, sincondrose persistente, espinha bífida oculta de C1)?', ctx:'Nesses casos, mesmo sem compressão aguda, a fusão eletiva costuma ser indicada pelo risco de lesão medular com trauma mínimo.', yes:'r6', no:'r3'},
r1:{type:'r', cls:'conservative', title:'Torcicolo Muscular Congênito — tratamento conservador', txt:'Iniciar programa de alongamento passivo do esternocleidomastóideo guiado por fisioterapeuta, associado a modificações posturais e ambientais (posicionamento de brinquedos/berço estimulando rotação para o lado contralateral). Reavaliar periodicamente.', details:[['Taxa de sucesso','90-95% com alongamento isolado'],['Subgrupo massa/tumoração','54-70% de resposta, ~8% necessitam cirurgia'],['Subgrupo postural','resolução quase universal, cirurgia rara'],['Se falhar após 1 ano de idade','considerar liberação cirúrgica']]},
r2:{type:'r', cls:'surgical', title:'Torcicolo Muscular Congênito — liberação cirúrgica do esternocleidomastóideo', txt:'Indicada após falha do alongamento (geralmente após 1 ano de idade) ou diante de deformidade facial estabelecida/déficit rotacional importante. Técnica preferida: liberação bipolar (origem mastóidea + inserção esternoclavicular) com plastia em Z do ramo esternal, preservando o contorno em V do pescoço.', details:[['Janela ideal','1 a 4 anos de idade'],['Resultado (liberação bipolar + Z-plastia)','até 92% satisfatórios'],['Estruturas em risco','nervo acessório espinhal, veias jugular externa/anterior, feixe carotídeo, nervo facial'],['Pós-operatório','alongamento precoce + órtese cervical por 3-4 meses']]},
r3:{type:'r', cls:'conservative', title:'AARF/Grisel — redução não cirúrgica ou observação de outras causas de torcicolo', txt:'Tratamento inicial com colar cervical macio, analgésicos e relaxante muscular (ex.: diazepam) por 1-2 semanas. Se não houver redução espontânea, hospitalizar para tração halter; em casos com mais de 1 mês de evolução, considerar tração halo por até 2 semanas (prognóstico mais reservado). Sem deslocamento anterior após redução: manter suporte apenas enquanto persistirem sintomas. Com deslocamento anterior: imobilizar por 6 semanas. Nos casos sem padrão típico de TMC/AARF e sem sinais de alerta, manter observação clínica e investigação direcionada (avaliação oftalmológica/neurológica conforme suspeita).', details:[['Resolução espontânea','maioria dos casos de AARS/Grisel'],['Duração do colar','1-2 semanas até resolução dos sintomas'],['Tração halo (>1 mês de sintomas)','até 2 semanas, prognóstico reservado'],['Deslocamento anterior presente','imobilização por 6 semanas']]},
r4:{type:'r', cls:'surgical', title:'AARF fixa/crônica — fusão C1-C2 posterior', txt:'Quando presentes critérios de cronicidade ou falha do tratamento conservador, realizar tração halo por alguns dias para alinhamento (evitar redução manipulativa forçada), seguida de artrodese C1-C2 posterior instrumentada (parafusos de massa lateral de C1 + parafusos pediculares/pars de C2, técnica de Harms-Melcher).', details:[['Indicações','comprometimento neurológico, deslocamento anterior, falha em manter redução, deformidade >3 meses, recidiva pós-tratamento adequado'],['Preparo pré-operatório','tração halo por alguns dias, sem manipulação forçada'],['Técnica preferida','parafusos de massa lateral C1 + parafusos pediculares/pars C2']]},
r5:{type:'r', cls:'emergency', title:'Instabilidade craniocervical com compressão medular aguda — estabilização e descompressão urgentes', txt:'Situação de emergência com risco de lesão medular catastrófica. Estabilizar imediatamente a coluna cervical (evitar manipulação e tração excessiva se houver suspeita de luxação atlanto-occipital), obter RM/TC urgentes e proceder à descompressão/fusão cirúrgica em caráter de urgência (ex.: laminectomia de C1 associada a fusão occipitocervical ou C1-C2, conforme o nível acometido).', details:[['Sinais de alarme','déficit neurológico agudo/progressivo, sinal medular em T2'],['Tração','contraindicada se suspeita de luxação atlanto-occipital (risco de distração)'],['Conduta','estabilização imediata + descompressão/fusão cirúrgica de urgência']]},
r6:{type:'r', cls:'surgical-major', title:'Instabilidade craniocervical crônica com critério cirúrgico — fusão occipitocervical/C1-C2 eletiva', txt:'Instabilidade radiograficamente confirmada (síndrome de Down, os odontoideum, outras anomalias craniocervicais) sem compressão medular aguda, mas com critérios formais de instabilidade. Planejar fusão eletiva com TC pré-operatória detalhada da anatomia craniocervical; tração halo pré-operatória pode reduzir a necessidade de descompressão transoral. Fixação rígida com parafusos de massa lateral de C1 e parafusos pediculares/pars de C2, enxerto autólogo (costela ou crista ilíaca conforme idade).', details:[['Taxas de fusão (fixação rígida moderna)','58-95%'],['Taxas de fusão (técnicas antigas/sublaminares)','~40%, alta taxa de complicação'],['Tração halo pré-operatória','pode evitar descompressão transoral'],['Enxerto','autólogo — costela ou crista ilíaca']]}}
},
