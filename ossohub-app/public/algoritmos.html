ddh_tratamento_idade_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.22",
  title:"Conduta na Displasia do Desenvolvimento do Quadril (DDH) por Idade ao Diagnóstico",
  src:"Stuart L. Weinstein, Cap.22 Developmental Hip Dysplasia and Dislocation, In: Lovell and Winter's Pediatric Orthopaedics — p.3152-3210",
  icon:"🦴", tags:["p","c","s","sm"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Idade da criança no momento do diagnóstico do quadril instável/luxado (Ortolani ou Barlow positivo) é menor que 6 meses?",
      ctx:"Nessa faixa etária o arnês de Pavlik é o tratamento de escolha, mantendo o quadril em flexão de 100-110° e abdução dentro da 'zona segura' (entre a redução e a luxação), evitando abdução ampla forçada.",
      yes:"q2", no:"q4"},
    q2:{type:"q",text:"O quadril se estabiliza clinicamente (torna-se Ortolani/Barlow negativo) com o arnês de Pavlik usado corretamente e em tempo integral?",
      ctx:"A estabilização costuma ocorrer em dias a semanas; quando ocorre, o arnês deve ser mantido em tempo integral por mais 6 semanas além do ponto de estabilidade, com checagens a cada 7-10 dias.",
      yes:"r1", no:"q4"},
    q4:{type:"q",text:"Idade entre 6 e 18 meses (ou falha do arnês de Pavlik, cuja taxa de sucesso cai para menos de 50% após os 6 meses)?",
      ctx:"Nessa faixa etária, quadris subluxados ou luxados devem ser tratados por meios fechados ou abertos, pois é difícil manter a criança mais ativa no arnês.",
      yes:"q5", no:"q6"},
    q5:{type:"q",text:"É possível obter redução concêntrica anatômica por manipulação suave sob anestesia geral (redução fechada), idealmente confirmada por artrografia dinâmica?",
      ctx:"Tenotomia do adutor (aberta ou percutânea) é geralmente necessária para ampliar a 'zona segura' e reduzir o risco de necrose avascular; abdução ampla forçada ou com rotação interna deve ser sempre evitada.",
      yes:"r2", no:"r3"},
    q6:{type:"q",text:"Idade entre 18 meses e 3 anos, considerada 'zona cinzenta', com luxação ou subluxação persistente?",
      ctx:"Nessa faixa etária o potencial de desenvolvimento acetabular espontâneo já está reduzido; a redução aberta é geralmente necessária e uma osteotomia pélvica concomitante ou estadiada (Salter/Pemberton) é frequentemente indicada, conforme a estabilidade obtida e a evolução radiográfica subsequente.",
      yes:"r4", no:"r5"},
    r1:{type:"r",cls:"conservative",title:"Manter arnês de Pavlik em tempo integral",
      txt:"Continuar o arnês de Pavlik em tempo integral por 6 semanas além da estabilização clínica, com desmame gradual guiado por exame clínico (e ultrassonografia seriada, se necessário). Sucesso geral de aproximadamente 95% no quadril Ortolani-positivo.",
      details:[["Faixa etária","< 6 meses"],["Sucesso esperado","~95% (Ortolani-positivo); ~85% quando usado para guiar redução de quadril luxado/subluxado"],["Alerta","Persistir com o arnês diante de falha de redução pode causar a 'doença do arnês de Pavlik' (dano à cabeça femoral e à cartilagem acetabular)"]]},
    r2:{type:"r",cls:"conservative",title:"Imobilização em gesso pelvipodálico após redução fechada",
      txt:"Manter a redução concêntrica em gesso pelvipodálico bem moldado dorsalmente aos trocânteres maiores, na 'posição humana' (hiperflexão com abdução limitada), por cerca de 6 semanas com o joelho imobilizado e mais 6 semanas com o joelho livre, seguido de órtese de abdução.",
      details:[["Faixa etária","6-18 meses"],["Documentação","Radiografia, TC de corte único, RM ou ultrassonografia após o gesso"],["Cuidado","Evitar abdução ampla forçada ou com rotação interna (posição de Lorenz), que aumenta o risco de necrose avascular"]]},
    r3:{type:"r",cls:"surgical",title:"Redução aberta",
      txt:"Indicada por falha da redução fechada, subluxação persistente ou interposição de partes moles. Abordagem anteromedial (Weinstein-Ponseti) preferida em menores de 18-24 meses; abordagem anterior (Smith-Petersen/Salter) permite capsulorrafia e osteotomia pélvica associada no mesmo acesso, se necessário.",
      details:[["Faixa etária","6-18 meses (falha de redução fechada)"],["Pós-operatório","Gesso pelvipodálico ('posição humana')"],["Observação","Procedimento acetabular secundário raramente necessário antes dos 18 meses; potencial de desenvolvimento acetabular após redução persiste por 4-8 anos"]]},
    r4:{type:"r",cls:"surgical-major",title:"Redução aberta + osteotomia pélvica concomitante ou estadiada",
      txt:"Redução aberta (via anterolateral de Smith-Petersen modificada) associada a osteotomia inominada de Salter (cobertura anterior, CE angle >10° associado a melhor prognóstico) ou de Pemberton (remodelação anterolateral, requer cartilagem trirradiada aberta), realizada no mesmo tempo cirúrgico ou 6-8 semanas depois, conforme estabilidade e evolução radiográfica.",
      details:[["Faixa etária","18 meses-3 anos ('zona cinzenta')"],["Decisão da osteotomia","Observar desenvolvimento acetabular por radiografias seriadas; se não houver melhora do índice acetabular/figura em lágrima, indicar osteotomia"],["Alternativa em desuso","Tração pré-redução prolongada — cada vez menos utilizada"]]},
    r5:{type:"r",cls:"surgical-major",title:"Redução aberta + encurtamento femoral + osteotomia pélvica",
      txt:"Após os 3 anos de idade, a redução aberta deve ser acompanhada de encurtamento femoral, que reduz de forma importante a incidência de necrose avascular em comparação à tração esquelética isolada (54% de necrose e 32% de reluxação relatadas com tração isolada nessa faixa etária), além de osteotomia pélvica concomitante na maioria dos casos.",
      details:[["Faixa etária","> 3 anos"],["Objetivo do encurtamento","Evitar pressão excessiva sobre a cabeça femoral vulnerável e permitir correção do anteversão femoral excessiva"],["Hardware","Fixação interna geralmente removida em 12-18 meses"]]}
  }
},

ddh_displasia_residual_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.22",
  title:"Conduta na Displasia Acetabular Residual/Incidental (criança maior, adolescente e adulto jovem)",
  src:"Stuart L. Weinstein, Cap.22 Developmental Hip Dysplasia and Dislocation, In: Lovell and Winter's Pediatric Orthopaedics — p.3263-3371",
  icon:"🦴", tags:["c","s","sm"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"Displasia acetabular residual (após redução prévia) ou incidental foi identificada em paciente esqueleticamente imaturo, com cartilagem trirradiada ainda aberta?",
      ctx:"Após redução concêntrica mantida, o acetábulo tem potencial de desenvolvimento espontâneo por vários anos, mas esse potencial diminui marcadamente após os 4 anos de idade.",
      yes:"q2", no:"q4"},
    q2:{type:"q",text:"Há falha de melhora radiográfica da displasia (índice acetabular estacionário/piora, ausência de figura em lágrima, instabilidade documentada) após período razoável de observação?",
      ctx:"Uma osteotomia do ílio pode estimular neovascularização e ossificação da cartilagem acetabular periférica não ossificada, além de redirecionar a anatomia óssea.",
      yes:"r1", no:"r2"},
    q4:{type:"q",text:"Paciente com cartilagem trirradiada já fechada (adolescente/adulto jovem), quadril congruente e sem artrose significativa, que é sintomático (ex.: síndrome do rebordo acetabular) ou apresenta subluxação radiográfica?",
      ctx:"Pré-requisito absoluto para osteotomia periacetabular: radiografia em abdução máxima demonstrando cabeça femoral reduzida, coberta e congruente, com bom espaço articular preservado.",
      yes:"r3", no:"q5"},
    q5:{type:"q",text:"Displasia mínima, assintomática, sem evidência de subluxação radiográfica (achado incidental em paciente maduro)?",
      ctx:"A história natural da displasia isolada sem diagnóstico prévio de DDH é incerta; já a história natural após DDH conhecida é de evolução para osteoartrose.",
      yes:"r4", no:"r5"},
    r1:{type:"r",cls:"surgical-major",title:"Osteotomia pélvica redirecionadora ou remodeladora",
      txt:"Em paciente com cartilagem trirradiada aberta e falha de desenvolvimento acetabular espontâneo, indicar osteotomia inominada de Salter (redirecionamento completo, cobertura anterior) ou acetabuloplastia de Pemberton/Dega (remodelação incompleta com dobradiça na cartilagem trirradiada), conforme o padrão de deficiência e a idade.",
      details:[["Pré-requisitos","Redução concêntrica mantida, contraturas musculares liberadas, articulação congruente"],["Limite de idade usual","Preferencialmente antes dos 6 anos para osteotomias redirecionadoras completas"],["Alerta","Osteotomias que dependem da cartilagem trirradiada como fulcro (Pemberton/Dega) exigem cartilagem trirradiada aberta"]]},
    r2:{type:"r",cls:"conservative",title:"Observação seriada com radiografias",
      txt:"Acompanhar o desenvolvimento acetabular com radiografias seriadas (índice acetabular, figura em lágrima, linha de Shenton), pois a ossificação da cartilagem acetabular periférica pode continuar espontaneamente por vários anos após a redução.",
      details:[["Racional","Muitos casos de aparente 'deficiência' acetabular são, na verdade, cartilagem não ossificada que ainda cobre bem a cabeça femoral"],["Reavaliação","Considerar intervenção cirúrgica se não houver melhora radiográfica com o tempo"]]},
    r3:{type:"r",cls:"surgical-major",title:"Osteotomia periacetabular de Ganz (PAO) ou osteotomia tríplice",
      txt:"Reorientação do acetábulo maduro displásico por PAO de Ganz (técnica mais versátil e potente para cartilagem trirradiada fechada) ou alternativas como a osteotomia tríplice de Tönnis/Steel ou osteotomias esféricas (Wagner, Naito). Patologia labial associada pode necessitar abordagem concomitante, aberta ou artroscópica.",
      details:[["Pré-requisito absoluto","Cabeça femoral reduzida, coberta e congruente em abdução máxima, com bom espaço articular"],["Contexto clínico comum","Síndrome do rebordo acetabular: dor inguinal súbita, teste de impacto positivo (flexão + adução + rotação interna)"],["Exames","RM com artrografia por gadolínio para lesão labial; TC 3D para deficiência acetabular"]]},
    r4:{type:"r",cls:"conservative",title:"Observação clínica, tratar apenas se sintomático",
      txt:"Orientar a família sobre o potencial de evolução adversa a longo prazo (osteoartrose), mas reservar o tratamento cirúrgico para o início dos sintomas, já que costuma haver longo intervalo entre o início dos sintomas e a doença degenerativa radiográfica.",
      details:[["Indicação de cirurgia futura","Início de sintomas (dor, instabilidade)"],["Diferencial","Se houver subluxação radiográfica, mesmo assintomática, a correção cirúrgica é recomendada, pois a história natural adversa é praticamente certa"]]},
    r5:{type:"r",cls:"surgical-major",title:"Artrodese do quadril ou artroplastia total",
      txt:"Em casos extremos de doença articular degenerativa já instalada em adulto jovem, a artrodese (se quadril contralateral, joelho ipsilateral e coluna normais) ou a artroplastia total do quadril podem ser as únicas alternativas de tratamento.",
      details:[["Artrodese","Excelente opção no paciente jovem com artrose terminal unilateral e demais articulações normais, embora hoje raramente utilizada"],["Alternativa","Artroplastia total do quadril, conforme idade e demanda funcional"]]}
  }
},

perthes_conduta_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.23",
  title:"Conduta na doença de Legg-Calvé-Perthes (LCPD) conforme idade de início e estágio evolutivo",
  src:"Sankar WN, Castañeda P, Joseph B, Cap.23 Legg-Calvé-Perthes Disease and Other Conditions, In: Lovell and Winter's Pediatric Orthopaedics — p.3509-3538",
  icon:"🦴", tags:["p","c","s","sm"],
  start:"q1",
  nodes:{
    q1:{type:"q", text:"O início dos sintomas ocorreu na adolescência (perto da fusão fisária, sem o processo reparativo espontâneo típico da criança)?", ctx:"O prognóstico e a abordagem terapêutica diferem profundamente conforme o início seja na infância (<12 anos, doença autolimitada) ou na adolescência, em que a contenção não funciona.", yes:"q2", no:"q3"},
    q2:{type:"q", text:"A apresentação é precoce, antes de colapso apreciável da epífise?", ctx:"No adolescente, a intervenção precisa ser urgente pois não há o processo reparativo espontâneo eficiente visto em crianças mais jovens.", yes:"r1", no:"r2"},
    q3:{type:"q", text:"O quadril está em estágio inicial ou fragmentação precoce (Ia, Ib ou IIa), ou seja, antes do início da deformidade da cabeça femoral?", ctx:"A deformação da cabeça femoral tipicamente começa na fragmentação tardia (IIb) ou logo após; esta é a janela de oportunidade para tratamento preventivo.", yes:"q4", no:"q7"},
    q4:{type:"q", text:"A idade de início da doença é 8 anos ou mais?", ctx:"Crianças com início tardio (≥8 anos) quase invariavelmente desenvolvem extrusão epifisária mais cedo ou mais tarde.", yes:"r3", no:"q5"},
    q5:{type:"q", text:"Há extrusão epifisária detectável na radiografia AP de acompanhamento?", ctx:"Em crianças menores de 8 anos, a contenção só está indicada quando a extrusão é efetivamente detectada.", yes:"r4", no:"q6"},
    q6:{type:"q", text:"Menos de 50% da epífise está envolvida (padrão compatível com Catterall 1-2 / Salter-Thompson tipo A)?", ctx:"Doença leve, sem extrusão, em criança jovem tem prognóstico natural muito bom e não necessita de contenção.", yes:"r5", no:"r4"},
    q7:{type:"q", text:"Há abdução em dobradiça (hinge abduction) sintomática — dor à abdução do quadril associada a contratura em adução?", ctx:"Ocorre quando a cabeça femoral deformada impacta a margem acetabular superior ao se tentar abduzir o quadril; confirmação por artrografia sob anestesia.", yes:"q8", no:"q9"},
    q8:{type:"q", text:"A artrografia sob anestesia confirma que a hinge abduction é irredutível (a porção lateral da cabeça não desliza sob a margem acetabular mesmo sob anestesia)?", ctx:"Distinção de Choi entre hinge abduction redutível e irredutível, feita no momento da artrografia sob anestesia geral.", yes:"r6", no:"r7"},
    q9:{type:"q", text:"Já existe deformidade estabelecida da cabeça femoral (estágio IIIb/IV), com coxa breve e sobrecrescimento trocantérico sintomático (marcha de Trendelenburg)?", ctx:"Nesta fase o tratamento deixa de ser preventivo da deformidade e passa a abordar as sequelas mecânicas já instaladas.", yes:"r8", no:"r9"},
    r1:{type:"r", cls:"surgical-major", title:"Intervenção urgente para tentar prevenir o colapso no adolescente", txt:"A contenção não funciona na LCPD de início adolescente. Considerar enxerto vascularizado de fíbula (usado com sucesso em necrose avascular do adulto) ou artrodiastase com fixador externo para tentar preservar a epífise antes do colapso.", details:[["Faixa etária","Início adolescente, pré-colapso"],["Motivo da urgência","Ausência do processo reparativo espontâneo eficiente da criança jovem"],["Opções","Enxerto vascularizado de fíbula; artrodiastase com fixador externo"],["Fonte","p.3533-3534"]]},
    r2:{type:"r", cls:"surgical-major", title:"Cirurgia de salvamento após colapso estabelecido no adolescente", txt:"Uma vez colapsada, a cabeça femoral permanece permanentemente deformada e artrite incapacitante pode sobrevir rapidamente. Considerar artroplastia total do quadril, artrodese do quadril ou ressecção da cabeça femoral com osteotomia de suporte pélvico.", details:[["Prognóstico","Grave — deformidade permanente"],["Opções de salvamento","Artroplastia total; artrodese; ressecção femoral + osteotomia de suporte pélvico"],["Fonte","p.3534"]]},
    r3:{type:"r", cls:"surgical", title:"Contenção preventiva (preemptive containment) na criança ≥8 anos", txt:"Iniciar contenção assim que o diagnóstico é estabelecido, mesmo sem extrusão demonstrável na radiografia, pois a extrusão ocorrerá mais cedo ou mais tarde nesta faixa etária. Opções: osteotomia femoral em varo-derrotação, osteotomia inominada (Salter) ou acetabuloplastia tipo shelf.", details:[["Indicação","Idade de início ≥8 anos, estágio Ia-IIa"],["Racional","Odds ratio de mau resultado de 16,5 quando a contenção é feita após o estágio IIa"],["Opções cirúrgicas","Osteotomia femoral varo-derrotação; osteotomia inominada; shelf acetabular"],["Fonte","p.3514-3524"]]},
    r4:{type:"r", cls:"surgical", title:"Contenção assim que a extrusão epifisária for detectada", txt:"Iniciar contenção (cirúrgica ou não operatória com órtese em abdução/rotação interna) assim que a extrusão for detectada na radiografia AP de acompanhamento em criança menor de 8 anos.", details:[["Indicação","Extrusão detectada, idade <8 anos, estágio Ia-IIa"],["Opções não cirúrgicas","Órtese de abdução (Atlanta Scottish Rite, Toronto, gesso de Petrie)"],["Opções cirúrgicas","Osteotomia femoral varo-derrotação"],["Fonte","p.3514-3524"]]},
    r5:{type:"r", cls:"conservative", title:"Observação clínica e tratamento sintomático", txt:"Criança jovem com menos de 50% da epífise envolvida e sem extrusão tem prognóstico natural muito bom; não há necessidade de contenção. Manter seguimento radiográfico regular e tratamento sintomático (analgesia, restrição de atividades de impacto conforme dor).", details:[["Indicação","Idade <8 anos, <50% de acometimento epifisário, sem extrusão"],["Conduta","Observação + tratamento sintomático"],["Fonte","p.3509-3515"]]},
    r6:{type:"r", cls:"surgical-major", title:"Osteotomia valga intertrocantérica para hinge abduction irredutível", txt:"Realizar osteotomia valga intertrocantérica na posição de adução onde se observa a máxima congruência articular ao exame sob anestesia, restaurando a posição congruente do quadril em carga neutra e aliviando o impacto doloroso.", details:[["Indicação","Hinge abduction irredutível confirmada por artrografia sob anestesia"],["Efeito adicional","Alonga o membro, abaixa e lateraliza o trocanter maior, pode alongar o colo femoral curto"],["Fonte","p.3527-3533"]]},
    r7:{type:"r", cls:"surgical", title:"Acetabuloplastia tipo shelf para hinge abduction redutível", txt:"Em hinge abduction redutível, uma acetabuloplastia tipo shelf costuma melhorar a amplitude de movimento e aliviar a dor sem necessidade de osteotomia femoral valga.", details:[["Indicação","Hinge abduction redutível"],["Efeito esperado","Melhora do movimento e alívio da dor"],["Fonte","p.3527-3533"]]},
    r8:{type:"r", cls:"surgical", title:"Correção cirúrgica das sequelas de deformidade estabelecida", txt:"Avanço distal e lateral do trocanter maior (ou osteotomia de Morscher) em pacientes com cabeça femoral esférica ou ovoide para corrigir coxa breve/sobrecrescimento trocantérico e abolir a marcha de Trendelenburg. Em casos selecionados com coxa magna e impacto femoroacetabular, considerar luxação cirúrgica do quadril para remodelamento da cabeça e correção do impacto/lesões labrais.", details:[["Indicação","Estágio IIIb/IV, coxa breve sintomática com marcha de Trendelenburg"],["Pré-requisito","Melhor resultado isolado quando a cabeça é esférica ou ovoide"],["Opção avançada","Luxação cirúrgica do quadril para remodelamento em casos selecionados"],["Fonte","p.3532-3534"]]},
    r9:{type:"r", cls:"conservative", title:"Tratamento sintomático e observação", txt:"Na ausência de hinge abduction ou deformidade estabelecida sintomática, manter tratamento sintomático, fisioterapia para preservar amplitude de movimento e observação clínica/radiográfica seriada.", details:[["Conduta","Fisioterapia + observação"],["Objetivo","Preservar amplitude de movimento até a resolução do processo de doença"],["Fonte","p.3526-3527"]]}
  }
},

quadril_doloroso_diferencial_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.23",
  title:"Diferencial do quadril doloroso agudo na criança (sinovite transitória vs. artrite séptica vs. LCPD)",
  src:"Sankar WN, Castañeda P, Joseph B, Cap.23 Legg-Calvé-Perthes Disease and Other Conditions, In: Lovell and Winter's Pediatric Orthopaedics — p.3617-3627",
  icon:"🦴", tags:["p","c","e"],
  start:"q1",
  nodes:{
    q1:{type:"q", text:"A criança apresenta febre E recusa completa de carga de peso sobre o membro afetado?", ctx:"Estes são dois dos quatro critérios preditivos de Kocher para diferenciar artrite séptica de sinovite transitória do quadril.", yes:"q2", no:"q4"},
    q2:{type:"q", text:"VHS maior que 40 mm/hora OU leucócitos séricos maiores que 12.000 células/mL?", ctx:"Critérios adicionais de Kocher; a combinação de múltiplos critérios positivos aumenta muito a probabilidade de artrite séptica verdadeira.", yes:"r1", no:"q3"},
    q3:{type:"q", text:"A ultrassonografia confirma efusão articular no quadril?", ctx:"Efusão é necessária mas não suficiente para diagnosticar artrite séptica; cerca de 71% dos quadris dolorosos têm efusão à ultrassonografia, a maioria por sinovite transitória.", yes:"r2", no:"r3"},
    q4:{type:"q", text:"A dor é insidiosa e prolongada (semanas), com limitação predominante de abdução e rotação interna, e a radiografia mostra núcleo ossificado femoral menor e/ou alargamento do espaço articular medial no lado afetado?", ctx:"Achados sugestivos de doença de Legg-Calvé-Perthes, que pode mimetizar sinovite transitória mas tem curso mais insidioso e prolongado.", yes:"r4", no:"r3"},
    r1:{type:"r", cls:"emergency", title:"Alta probabilidade de artrite séptica do quadril", txt:"Com febre, recusa de carga e VHS/leucócitos elevados, a probabilidade de artrite séptica é muito alta. Indicar aspiração articular guiada por ultrassonografia ou fluoroscopia com Gram e cultura, e considerar drenagem cirúrgica urgente para evitar destruição da cabeça femoral e deformidade permanente.", details:[["Critérios de Kocher positivos","≥3 de 4 (febre, não-carga, VHS>40, leucócitos>12.000)"],["Conduta","Aspiração articular urgente + considerar drenagem cirúrgica"],["Risco se não tratado","Destruição da cabeça femoral, artrose precoce"],["Fonte","p.3624-3625"]]},
    r2:{type:"r", cls:"surgical", title:"Probabilidade intermediária — aspiração articular para excluir infecção", txt:"Poucos critérios de Kocher presentes, mas efusão confirmada por ultrassonografia. Realizar aspiração do quadril sob fluoroscopia ou ultrassonografia para excluir artrite séptica antes de assumir sinovite transitória, especialmente se a irritabilidade do quadril for importante.", details:[["Achado","Efusão presente, poucos critérios de Kocher"],["Conduta","Aspiração articular para Gram/cultura antes de tratar como sinovite transitória"],["Fonte","p.3620-3625"]]},
    r3:{type:"r", cls:"conservative", title:"Provável sinovite transitória do quadril", txt:"Repouso, restrição de carga, anti-inflamatórios não esteroidais por curto período (evitar aspirina pelo risco de síndrome de Reye). Resolução esperada em 5 a 7 dias na maioria dos casos. Reavaliar se sintomas piorarem ou persistirem além de 2-3 semanas, quando outros diagnósticos devem ser reconsiderados.", details:[["Conduta","Repouso, anti-inflamatórios, observação"],["Evolução esperada","Resolução em 5-7 dias (até 2-3 semanas em casos mais lentos)"],["Sinal de alerta","Piora dos sintomas sugere artrite séptica"],["Fonte","p.3617-3627"]]},
    r4:{type:"r", cls:"conservative", title:"Suspeita de doença de Legg-Calvé-Perthes", txt:"Solicitar radiografias seriadas do quadril em AP e Lauenstein (frog-leg lateral); considerar ressonância magnética (idealmente com perfusão) se houver dúvida diagnóstica precoce. Encaminhar para estadiamento pelo sistema de Waldenström modificado e definição de conduta conforme idade de início e extensão do acometimento epifisário.", details:[["Próximo passo","Radiografias AP e Lauenstein seriadas; RM se dúvida"],["Encaminhamento","Estadiamento de Waldenström + avaliação de idade de início e extensão epifisária"],["Fonte","p.3501-3509, 3625-3627"]]}
  }
},


scfe_conduta_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.24",
  title:"Conduta na Epifisiólise Femoral Proximal (EFCF/SCFE) conforme estabilidade de Loder",
  src:"Kim YJ, Ramachandran M, Cap.24 Slipped Capital Femoral Epiphysis, In: Lovell and Winter's Pediatric Orthopaedics — p.3664-3790",
  icon:"🦴", tags:["p","s","sm","e"],
  start:"q1",
  nodes:{
    q1:{type:"q",text:"EFCF confirmado radiograficamente (linha de Klein/Trethowan positiva, alargamento e irregularidade fisária, mancha metafisária de Steel)?", ctx:"Obter radiografias AP e em perfil (frog-leg) de ambos os quadris. Em EFCF instável agudo, evitar o frog lateral pré-operatório; usar incidência em perfil cross-table.", yes:"q2", no:"r_investigacao"},

    r_investigacao:{type:"r", cls:"conservative", title:"Suspeita clínica sem confirmação radiográfica — investigar pré-escorregamento", txt:"Manter descarga de peso e repetir avaliação. Em criança obesa/peripuberal com dor persistente em quadril, coxa ou joelho e radiografia normal, solicitar RM para descartar 'preslip' (alargamento fisário e edema ósseo justafisário sem deslocamento verdadeiro).", details:[["Achados de preslip na RM","Alargamento e irregularidade fisária, edema ósseo adjacente"],["Conduta","Repetir exame físico bilateral; RM se suspeita persistir"]]},

    q2:{type:"q",text:"O paciente consegue deambular, com ou sem muletas, apesar da dor? (classificação de estabilidade de Loder)", ctx:"Considerar que 13/24 quadris clinicamente 'instáveis' podem ter fise mecanicamente estável ao intraoperatório e vice-versa (Ziebarth et al.) — todo quadril com fise aberta deve ser tratado como potencialmente instável.", yes:"q3", no:"r_instavel"},

    r_instavel:{type:"r", cls:"emergency", title:"EFCF instável — urgência cirúrgica", txt:"Internação imediata com repouso absoluto no leito, sem carga de peso. Fixação cirúrgica in situ com 2 parafusos canulados grandes, o mais precocemente possível. Considerar aspiração/artrotomia articular. Não realizar manipulação ou redução forçada (associada a maior risco de osteonecrose). Descarga de peso por 3-4 semanas no pós-operatório.", details:[["Classificação","Loder — Instável (5-10% de todos os EFCF)"],["Fixação","2 parafusos canulados grandes"],["Risco de osteonecrose","12,5% a 58% (47% na série de Loder et al.)"],["Pós-operatório","Descarga de peso por 3-4 semanas"]]},

    q3:{type:"q",text:"Há endocrinopatia/doença sistêmica subjacente, idade de início atípica (<10 anos ou >14-16 anos), baixa estatura (<percentil 10), radioterapia pélvica prévia ou acesso limitado a seguimento clínico?", ctx:"Critérios de Loder (teste idade-peso-altura) e de Burrow et al. (estatura <percentil 10) ajudam a identificar EFCF atípico com maior risco de bilateralidade e de causa endócrina.", yes:"r_profilatica", no:"q4"},

    r_profilatica:{type:"r", cls:"surgical", title:"Fixação in situ do lado afetado + fixação profilática contralateral", txt:"Fixar cirurgicamente o quadril afetado (parafuso canulado único se estável) e considerar fixação profilática do quadril contralateral ainda não escorregado, dado o alto risco de bilateralidade nesses grupos (endocrinopatia, RT pélvica, idade <10 anos, difícil seguimento).", details:[["Indicações","Endocrinopatia, RT pélvica prévia, idade <10 anos, seguimento inadequado"],["Contraindicação relativa","Doença renal — preferir manejo clínico da osteodistrofia renal"],["Risco de condrólise profilática","~2%"],["Risco de osteonecrose profilática","~1%"]]},

    q4:{type:"q",text:"EFCF estável, sem fatores de risco atípicos — proceder com fixação in situ eletiva. Após a fixação, há dor e/ou limitação funcional significativa persistindo por 1 ano ou mais (deformidade residual moderada a grave)?", ctx:"A maioria dos sintomas melhora dentro do primeiro ano após a fixação in situ; a persistência sugere deformidade residual clinicamente relevante.", yes:"q5", no:"r_estavel_rotina"},

    r_estavel_rotina:{type:"r", cls:"surgical", title:"EFCF estável — fixação in situ com parafuso único", txt:"Um parafuso canulado grande (6,5-7,3 mm), rosca reversa, perpendicular à fise, posição centro-centro na cabeça femoral. Carga total permitida como tolerado no pós-operatório. Seguimento radiográfico com 1 semana, 1 e 2 meses, depois a cada 3-6 meses até o fechamento fisário bilateral, vigiando quadril contralateral e sinais de condrólise (dor e ADM que não melhoram em 2-3 semanas).", details:[["Fixação","1 parafuso canulado grande"],["Carga","Total, como tolerado"],["Risco de osteonecrose","0-5% (mais comum 2-3%)"],["Seguimento","Até fechamento fisário bilateral"]]},

    q5:{type:"q",text:"Deslocamento residual maior que 45 graus pelo ângulo cabeça-diáfise (critério de Sugioka)?", ctx:"A escolha do tipo de osteotomia corretiva depende da magnitude da deformidade residual (graus de Southwick/Wilson) e da experiência do cirurgião.", yes:"r_sugioka", no:"r_osteotomia_intertrocanterica"},

    r_osteotomia_intertrocanterica:{type:"r", cls:"surgical-major", title:"Osteotomia intertrocantérica corretiva (Southwick/Imhauser)", txt:"Osteotomia intertrocantérica triplanar (valgo, flexão e rotação interna) é a técnica mais comumente empregada para deformidade residual sintomática, com menor risco de osteonecrose comparada a osteotomias mais proximais, embora a correção seja mais distante do foco real da deformidade.", details:[["Técnica","Southwick ou Imhauser (triplanar: valgo-flexão-RI)"],["Risco de osteonecrose","Muito baixo (até 6% relatado)"],["Risco de condrólise","2% a 25%"],["Complicações associadas","LLD, retardo de consolidação, reoperação"]]},

    r_sugioka:{type:"r", cls:"surgical-major", title:"Osteotomia rotacional transtrocantérica (Sugioka)", txt:"Reservada para deformidade residual grave, com deslocamento >45 graus pelo ângulo cabeça-diáfise. Tecnicamente exigente e de uso restrito, mas com potencial de correção anatômica superior às osteotomias intertrocantéricas convencionais.", details:[["Indicação","Deslocamento >45 graus (head-shaft angle)"],["Resultados","~90% excelentes na série original"],["Risco","Osteonecrose relatada; tecnicamente muito exigente"]]}
  }
},

fai_adolescente_ped:{
  region:'fraturas-pediatricas', num:'LW Cap.25',
  title:'Avaliação e Conduta no Impacto Femoroacetabular (FAI) do Quadril do Adolescente',
  src:'Zaltz I, Sink EL, Cap.25 The Adolescent Hip, In: Lovell and Winter\'s Pediatric Orthopaedics — p.3813-3814',

  start:'q1',
  nodes:{
    q1:{type:'q', text:'História (dor anterior no quadril/virilha ou região peritrocantérica, sintomas mecânicos como travamento/estalido, dor à flexão do quadril como sentar), exame físico e radiografias/RM/TC compatíveis com deformidade cam e/ou pincer com dano labral ou condral associado?', ctx:'O diagnóstico de FAI baseia-se em achado histórico, clínico e radiográfico consistentes. A avaliação completa inclui radiografias simples, RM com sequências para labrum/cartilagem hialina e TC 3D para definir a anatomia do fêmur proximal e do acetábulo.', yes:'q2', no:'r1'},
    q2:{type:'q', text:'Já foi realizado um período de tratamento não cirúrgico adequado (modificação/repouso de atividade, anti-inflamatório oral, fisioterapia e/ou terapia intra-articular), com falha em aliviar a dor ou permitir retorno às atividades?', ctx:'Falha do tratamento não cirúrgico e dor limitante de atividade são consideradas as indicações apropriadas para cirurgia. Não há evidência de que o tratamento cirúrgico do FAI modifique a história natural da artrose.', yes:'q3', no:'r2'},
    q3:{type:'q', text:'A avaliação por TC 3D/RM demonstra deformidade cam de grande magnitude, retrotorsão femoral significativa, malrotação acetabular maior, ou impacto extra-articular envolvendo estruturas como o trocânter maior?', ctx:'Esses achados foram associados a melhor manejo por técnica aberta na literatura citada pelo capítulo.', yes:'r3', no:'q4'},
    q4:{type:'q', text:'A lesão responsável pelo impacto é acessível por via artroscópica (fêmur anterior ou rebordo acetabular), na ausência de defeitos ou deformidade cartilaginosa articular maiores (femoral ou acetabular)?', ctx:'Esta é a indicação ideal descrita no capítulo para tratamento artroscópico isolado.', yes:'r4', no:'r5'},
    r1:{type:'r', cls:'conservative', title:'Critérios de FAI Não Preenchidos — Investigar Diagnóstico Diferencial', txt:'Quando história, exame físico e imagem não são consistentes com FAI, investigar outras causas intra-articulares (lesão pós-traumática, sinovite crônica, osteoma osteoide, condromatose sinovial), extra-articulares (tendinopatia, bursite, compressão nervosa periarticular) ou não ortopédicas (causas neurológicas, retroperitoneais, de parede abdominal ou intraperitoneais) de dor no quadril do adolescente.', details:[['Conduta','Excluir causas não ortopédicas antes de prosseguir com investigação ortopédica'],['Reavaliação','Repetir história/exame físico focados e considerar imagem adicional conforme suspeita clínica']]},
    r2:{type:'r', cls:'conservative', title:'Tratamento Não Cirúrgico Inicial do FAI', txt:'Iniciar trial de modificação/repouso de atividade, anti-inflamatório oral, fisioterapia e/ou terapia intra-articular. A cirurgia só é considerada após falha documentada dessa abordagem associada a dor limitante de atividade.', details:[['Componentes','Repouso/modificação de atividade, AINE oral, fisioterapia, infiltração intra-articular'],['Reavaliação','Se falha e dor persistente limitando atividades, reconsiderar indicação cirúrgica']]},
    r3:{type:'r', cls:'surgical-major', title:'Cirurgia Aberta — Luxação Cirúrgica do Quadril', txt:'Deformidades cam de maior magnitude, retrotorsão femoral significativa, ou malrotação acetabular maior/impacto extra-articular (trocânter maior) são mais efetivamente manejados por técnica aberta, permitindo osteoplastia femoral circunferencial, osteotomia periacetabular anteversora (PAO) e/ou osteotomia de desrotação femoral conforme a deformidade específica.', details:[['Indicações','Cam extenso, retrotorsão femoral relevante, malrotação acetabular maior, impacto extra-articular do trocânter maior'],['Procedimentos possíveis','Osteoplastia aberta, PAO anteversora, osteotomia de desrotação femoral, ou combinações'],['Ressalva','Não há indicação universal única — o procedimento deve ser individualizado à deformidade do paciente']]},
    r4:{type:'r', cls:'surgical', title:'Artroscopia de Quadril', txt:'Indicação ideal para lesão acessível por via artroscópica no fêmur anterior ou rebordo acetabular, na ausência de defeitos ou deformidade cartilaginosa articular maiores (femoral ou acetabular).', details:[['Indicação ideal','Lesão anterior do fêmur ou do rebordo acetabular, acessível artroscopicamente'],['Contraindicação relativa','Defeitos ou deformidade cartilaginosa articular maiores, cam extenso ou malrotação acetabular importante']]},
    r5:{type:'r', cls:'surgical-major', title:'Procedimento Individualizado / Combinado', txt:'Quando a deformidade não preenche claramente os critérios de grande magnitude para cirurgia aberta nem é totalmente acessível por artroscopia isolada, o tratamento deve ser individualizado, podendo combinar osteoplastia aberta ou artroscópica com osteotomia periacetabular anteversora e/ou osteotomia de desrotação femoral, conforme a deformidade específica responsável pelo impacto.', details:[['Base da decisão','Tipo e magnitude específicos da deformidade femoral e acetabular do paciente'],['Procedimentos possíveis','Femoroplastia aberta ou artroscópica, PAO anteversora, osteotomia de desrotação femoral, ou combinações'],['Observação do capítulo','A indicação precisa para cada procedimento ainda é ponto controverso na literatura']]}
  }
},



genu_varum_valgum_avaliacao_ped: {
  region: "fraturas-pediatricas", num: "LW Cap.26",
  title: "Avaliação da Deformidade Angular do Joelho (Genu Varum/Valgum) na Criança",
  src: "Iobst C, Jain V, McCarthy JJ, Cap.26 The Lower Extremity, In: Lovell and Winter's Pediatric Orthopaedics — p.3925-3947, 3996-4004",
  icon: "🦵", tags: ["p", "c", "s"],
  start: "q1",
  nodes: {
    q1: {
      q: "Criança com menos de 2-3 anos, arqueamento (genu varum) bilateral e simétrico, em curva longa e suave, sem thrust à marcha e sem assimetria?",
      yes: "leaf_physio_varum",
      no: "q2"
    },
    q2: {
      q: "Criança entre 2 e 8 anos, joelho valgo (genu valgum) bilateral e simétrico, sem dor, assimetria ou thrust?",
      yes: "leaf_physio_valgum",
      no: "q3"
    },
    q3: {
      q: "Há assimetria entre os membros, thrust lateral (varo) ou medial à marcha, estatura anormal (suspeita de raquitismo/displasia esquelética) ou a deformidade está fora da faixa etária esperada?",
      yes: "q4",
      no: "leaf_observacao_seriada"
    },
    q4: {
      q: "Radiografia panorâmica em pé: predomínio de VARO focal na tíbia proximal, com bico metafisário medial, MDA >11 graus e/ou EMA >20 graus (achados de tibia vara/Blount)?",
      yes: "leaf_blount_suspeito",
      no: "q5"
    },
    q5: {
      q: "Teste de malalinhamento mostra desvio do eixo mecânico lateral ao centro do joelho (genu valgum patológico), com JOA anormal no fêmur distal e/ou tíbia proximal?",
      yes: "q6",
      no: "leaf_outra_causa"
    },
    q6: {
      q: "Deformidade leve a moderada (eixo mecânico no terço medial/médio do platô tibial lateral), com mais de 2-3 anos de crescimento restante e fise normal e funcionante?",
      yes: "leaf_guided_growth_valgo",
      no: "leaf_osteotomia_valgo"
    },

    leaf_physio_varum: {
      q: "Genu varum fisiológico. Conduta: tranquilizar a família; documentar com fotografias clínicas seriadas a cada poucos meses; radiografar apenas se piorar ou não resolver por volta dos 2 anos.",
      cls: "conservative"
    },
    leaf_physio_valgum: {
      q: "Genu valgum fisiológico (pico esperado de 10-15 graus aos 3 anos, resolvendo para ~7 graus de valgo aos 7-8 anos). Conduta: tranquilizar a família; sem tratamento.",
      cls: "conservative"
    },
    leaf_observacao_seriada: {
      q: "Deformidade angular provavelmente dentro da variação normal para a idade. Conduta: observação clínica seriada; reavaliar em consultas de rotina; radiografar se progressão.",
      cls: "conservative"
    },
    leaf_blount_suspeito: {
      q: "Achados compatíveis com tibia vara patológica (Blount). Encaminhar para o algoritmo específico de conduta na doença de Blount (classificação de Langenskiöld, idade de início, estágio da fise).",
      cls: "surgical"
    },
    leaf_outra_causa: {
      q: "Considerar causas alternativas: displasia fibrocartilaginosa focal, lesão fisária pós-traumática/infecciosa, doença metabólica óssea (raquitismo), displasia esquelética. Investigar com exames laboratoriais/imagem direcionados.",
      cls: "conservative"
    },
    leaf_guided_growth_valgo: {
      q: "Crescimento guiado (hemiepifisiodese temporária com placa de tensão medial) é o tratamento de escolha. Monitorar a cada poucos meses para evitar supercorreção; considerar técnica de placa \"sleeper\" se recidiva esperada.",
      cls: "surgical"
    },
    leaf_osteotomia_valgo: {
      q: "Paciente próximo da maturidade esquelética ou deformidade grande: osteotomia (femoral e/ou tibial). Correção aguda possível até 10 graus; gradual recomendada para deformidades maiores, especialmente na tíbia (risco de estiramento do nervo fibular — considerar descompressão profilática).",
      cls: "surgical-major"
    }
  }
},

blount_doenca_conduta_ped: {
  region: "fraturas-pediatricas", num: "LW Cap.26",
  title: "Conduta na Doença de Blount (Tibia Vara) por Idade de Início e Estado da Fise",
  src: "Iobst C, Jain V, McCarthy JJ, Cap.26 The Lower Extremity, In: Lovell and Winter's Pediatric Orthopaedics — p.3936-3980",
  icon: "🦵", tags: ["p", "c", "s"],
  start: "q1",
  nodes: {
    q1: {
      q: "Início precoce/infantil (2-7 anos), possivelmente bilateral, com achados radiográficos de MDA/EMA compatíveis com Blount?",
      yes: "q2",
      no: "q_tardio"
    },
    q2: {
      q: "Criança magra (peso <percentil 90), doença unilateral leve, idade <3 anos, sem thrust em varo à marcha, Langenskiöld estágio I-II?",
      yes: "leaf_orte_precoce",
      no: "q3"
    },
    q3: {
      q: "Fise medial ainda funcionante, sem barra óssea completa (Langenskiöld I-IV / grupo de baixo grau)?",
      yes: "leaf_guided_growth_blount_precoce",
      no: "q4"
    },
    q4: {
      q: "Depressão do platô tibial medial >30 graus ao raio X, com instabilidade ligamentar/thrust à marcha confirmados (considerar RM/artrografia antes de decidir)?",
      yes: "leaf_hemiplateau_elevacao",
      no: "leaf_osteotomia_precoce"
    },

    q_tardio: {
      q: "Início tardio (≥10 anos), tipicamente obeso, unilateral, sem barra óssea medial ou depressão do platô — crescimento guiado prévio falhou OU bone age avançado com pouco crescimento remanescente?",
      yes: "leaf_osteotomia_tardia",
      no: "leaf_guided_growth_tardio"
    },

    leaf_orte_precoce: {
      q: "Órtese (KAFO com apoio medial, uso em tempo integral) pode ser tentada como primeira linha por 6-12 meses, reconhecendo taxa relevante de resolução espontânea concomitante.",
      cls: "conservative"
    },
    leaf_guided_growth_blount_precoce: {
      q: "Crescimento guiado (placa de tensão/parafuso/grampo) como primeira linha cirúrgica, o mais precoce possível no curso da doença, antes de alterações fisárias irreversíveis. Bone age deve ser avaliado antes (avanço médio de puberdade em obesos).",
      cls: "surgical"
    },
    leaf_hemiplateau_elevacao: {
      q: "Elevação do hemiplatô tibial medial, associada a fechamento da fise lateral (epifisiodese) no mesmo tempo cirúrgico para prevenir recidiva; considerar correção associada de varo/procurvato/rotação por osteotomia.",
      cls: "surgical-major"
    },
    leaf_osteotomia_precoce: {
      q: "Osteotomia tibial proximal (aguda ou gradual, conforme magnitude e plano da deformidade), com fixação por pinos cruzados/placa/fixador externo conforme idade e tamanho do paciente; considerar supercorreção em leve valgo pela perda de correção esperada com crescimento.",
      cls: "surgical-major"
    },
    leaf_guided_growth_tardio: {
      q: "Crescimento guiado ainda é opção se houver crescimento remanescente suficiente e fise sadia; avaliar bone age antes (frequentemente avançado em obesos com Blount tardio).",
      cls: "surgical"
    },
    leaf_osteotomia_tardia: {
      q: "Osteotomia (tibial e, se deformidade femoral associada, também femoral) para restaurar o eixo mecânico neutro; considerar fixador externo circular/hexapod para correção gradual em deformidades multiplanares graves ou paciente obeso.",
      cls: "surgical-major"
    }
  }
},

deformidade_rotacional_avaliacao_ped: {
  region: "fraturas-pediatricas", num: "LW Cap.26",
  title: "Avaliação da Deformidade Rotacional dos Membros Inferiores e Síndrome do Mau Alinhamento",
  src: "Iobst C, Jain V, McCarthy JJ, Cap.26 The Lower Extremity, In: Lovell and Winter's Pediatric Orthopaedics — p.3880-3900",
  icon: "🦵", tags: ["p", "c", "s"],
  start: "q1",
  nodes: {
    q1: {
      q: "Perfil rotacional (TFA/torção tibial e teste de Craig-Ryder para anteversão femoral) simétrico e dentro da faixa normal para a idade?",
      yes: "leaf_normal",
      no: "q2"
    },
    q2: {
      q: "Há assimetria significativa de rotação do quadril entre os lados, ou rotação externa do quadril em adolescente (possível sinal de epifisiólise proximal do fêmur)?",
      yes: "leaf_alerta_scfe",
      no: "q3"
    },
    q3: {
      q: "Combinação de anteversão femoral aumentada + torção tibial externa, com rotação interna excessiva do quadril e TFA excessivamente externo, causando dor anterior no joelho ao caminhar (padrão de mau alinhamento rotacional / miserable malalignment)?",
      yes: "q4",
      no: "leaf_variacao_normal"
    },
    q4: {
      q: "Sintomático (dor anterior no joelho limitante) e tratamento conservador (fortalecimento/fisioterapia) já tentado sem melhora, com deformidade confirmada por TC axial ou análise de marcha tridimensional?",
      yes: "leaf_osteotomia_rotacional",
      no: "leaf_conservador_rotacional"
    },

    leaf_normal: {
      q: "Variação rotacional normal para a idade. Conduta: tranquilizar a família; não há intervenção não cirúrgica comprovadamente eficaz para acelerar a normalização da marcha.",
      cls: "conservative"
    },
    leaf_alerta_scfe: {
      q: "Assimetria rotacional do quadril em adolescente, especialmente rotação externa, exige avaliação urgente para excluir epifisiólise proximal do fêmur (radiografia de quadril em AP e perfil/rã).",
      cls: "emergency"
    },
    leaf_variacao_normal: {
      q: "Variação rotacional leve/assintomática, mesmo se assimétrica em algum grau. Conduta: observação; reavaliar se surgir dor ou piora progressiva.",
      cls: "conservative"
    },
    leaf_conservador_rotacional: {
      q: "Manter fortalecimento muscular e fisioterapia; reavaliar periodicamente. Cirurgia reservada para casos refratários e bem documentados.",
      cls: "conservative"
    },
    leaf_osteotomia_rotacional: {
      q: "Osteotomia rotacional bilateral: rotação externa do fêmur combinada com rotação interna compensatória da tíbia (osteotomia supramaleolar da tíbia/fíbula e osteotomia femoral com haste intramedular ou placa, conforme maturidade esquelética).",
      cls: "surgical-major"
    }
  }
},

// ===== Cap.27 Limb-Length Discrepancy (Noonan KJ, Halanski MA) — Lovell and Winter's Pediatric Orthopaedics, 8th ed. — livro p.4113-4262 =====
// 2 algoritmos gerados, fiéis aos critérios explícitos do texto:
// 1) Conduta geral por magnitude de discrepância prevista na maturidade esquelética (seção "Treatment Goals", p.4172,
//    integrada com as seções de epifisiodese p.4176-4192, encurtamento ósseo p.4196-4217, reconstrução/alongamento
//    p.4226-4253 e amputação/prótese p.4176-4177).
// 2) Decisão de ressecção de barra/ponte óssea fisária (physeal bar excision), com os critérios numéricos explícitos
//    da seção "Growth Arrest (Physeal Bar) Excision" (p.4224-4226).

conduta_discrepancia_mmii_ped:{
  region:'fraturas-pediatricas', num:'LW Cap.27',
  title:'Conduta na Discrepância de Comprimento dos Membros Inferiores por Magnitude Prevista na Maturidade Esquelética',
  src:'Noonan KJ, Halanski MA, Cap.27 Limb-Length Discrepancy, In: Lovell and Winter\'s Pediatric Orthopaedics — p.4172-4253',
  icon:'📏', tags:['p','c','s'],
  start:'q1',
  nodes:{
    q1:{type:'q', text:'A discrepância funcional (clínica) atual é menor que 2 cm, sem previsão de piora relevante até a maturidade esquelética?', ctx:'Discrepâncias menores que 2 cm não têm consequência funcional ou clínica demonstrada no adulto. A decisão de tratamento deve sempre se basear na discrepância PREVISTA na maturidade (por Green-Anderson, Moseley, Menelaus/White, Dimeglio ou Multiplicador de Paley), não apenas na medida atual.', yes:'r1', no:'q2'},
    q2:{type:'q', text:'A discrepância prevista na maturidade esquelética é maior que 20 cm, especialmente se associada a pé funcionalmente inútil (ex.: hemimelia fibular completa com tornozelo instável, deficiência focal femoral proximal grave)?', ctx:'Quando a morbidade, o tempo e a dificuldade do alongamento seriado superam largamente seus benefícios, a amputação com adaptação protética é preferida à tentativa heroica de salvamento do membro.', yes:'r5', no:'q3'},
    q3:{type:'q', text:'A discrepância prevista está entre 6 e 20 cm?', ctx:'Esta faixa corresponde à indicação de reconstrução do membro (alongamento ósseo, com ou sem procedimentos adjuvantes), segundo as diretrizes de tratamento por magnitude do capítulo.', yes:'q4', no:'q6'},
    q4:{type:'q', text:'Há deformidade articular, instabilidade ou contratura associada que precisa ser corrigida antes do alongamento definitivo (ex.: displasia de quadril no fêmur curto congênito, valgo/instabilidade de tornozelo na hemimelia fibular, contraturas de partes moles)?', ctx:'A otimização do membro (limb optimization) deve preceder a distração para evitar luxação/subluxação articular durante o alongamento; é razoável concluir essa otimização antes da idade escolar.', yes:'r3', no:'r4'},
    q6:{type:'q', text:'Ainda há crescimento remanescente suficiente, com dados seriados confiáveis de comprimento e idade óssea, para prever com confiança o momento ideal de uma epifisiodese (discrepância prevista de 2 a 6 cm)?', ctx:'A epifisiodese é o tratamento de escolha para discrepância prevista de 2-6 cm em paciente ainda em crescimento, por sua baixa morbidade. O objetivo é mirar leve subcorreção (0,5-1,0 cm), realizando o procedimento um pouco mais tarde do que o momento de correção perfeita.', yes:'r2', no:'q7'},
    q7:{type:'q', text:'O paciente é candidato técnico ao alongamento com prego intramedular motorizado (diâmetro diafisário ≥ 10,5 mm, fises proximais não amplamente abertas, ausência de obesidade importante) e prefere não perder estatura final?', ctx:'Dispositivos intramedulares motorizados (ex.: PRECICE) tornaram o alongamento de 3-6 cm bem tolerado em pacientes de baixa estatura que não aceitariam encurtamento ou epifisiodese, mesmo fora do contexto de crescimento ativo. Nota: cobertura por seguradoras pode ser negada para discrepâncias isoladas menores que 5-6 cm.', yes:'r6', no:'r7'},
    r1:{type:'r', cls:'conservative', title:'Sem Tratamento Cirúrgico', txt:'Discrepância prevista menor que 2 cm: nenhum tratamento é necessário, segundo as diretrizes de conduta por magnitude do capítulo e a história natural documentada em adultos (sem consequência funcional/clínica demonstrada abaixo desse limiar).', details:[['Conduta','Observação; palmilha/salto pode ser oferecido a critério clínico se o paciente referir desconforto'],['Seguimento','Reavaliação periódica até a maturidade esquelética para confirmar que a previsão se mantém estável']]},
    r2:{type:'r', cls:'surgical', title:'Epifisiodese', txt:'Discrepância prevista de 2 a 6 cm com crescimento remanescente suficiente para previsão confiável: epifisiodese (percutânea sob fluoroscopia, técnica de Phemister, grampeamento ou parafusos transfisários tipo PETS) da fise contralateral, buscando leve subcorreção de 0,5-1,0 cm.', details:[['Perda de crescimento esperada','27% na tíbia proximal isolada; 38% no fêmur distal isolado; 65% na epifisiodese combinada (pan-genu)'],['Preferência técnica dos autores','Epifisiodese percutânea sob fluoroscopia como padrão atual de tratamento'],['Seguimento','Radiografia de alinhamento em 6 meses e scanogramas seriados até a cessação do crescimento, para confirmar parada completa e detectar eventual crescimento residual inesperado']]},
    r3:{type:'r', cls:'surgical-major', title:'Otimização do Membro Antes do Alongamento (Limb Optimization)', txt:'Correção de deformidades e instabilidades articulares associadas (osteotomia pélvica para displasia acetabular, correção de varo/retroversão femoral, correção de valgo de tornozelo, liberação de contraturas de partes moles) antes de proceder ao alongamento definitivo, para prevenir luxação, subluxação articular ou piora da deformidade durante a distração.', details:[['Exemplo do capítulo','Displasia de quadril no fêmur curto congênito deve ser corrigida antes do alongamento femoral para evitar luxação do quadril'],['Próximo passo','Após otimização e período de recuperação, reconduzir para reconstrução/alongamento do membro (mesmos princípios do nó "Reconstrução do Membro")']]},
    r4:{type:'r', cls:'surgical-major', title:'Reconstrução do Membro / Alongamento Ósseo (6-20 cm)', txt:'Alongamento por osteogênese por distração (fixador externo tipo Ilizarov/monolateral ou prego intramedular motorizado, conforme candidatura técnica), tipicamente em tentativas seriadas de 10-20% do comprimento ósseo original (até 8-10 cm por tentativa antes de complicações/dor limitarem o prosseguimento).', details:[['Fases do processo','Latência (3-14 dias) → distração (1 mm/dia, em incrementos de 0,25 mm 4x/dia) → consolidação (até 3 de 4 corticais visíveis)'],['Tempo de fixador','Regra prática de 1 mês de fixador externo por centímetro de comprimento ganho, mais período de reabilitação'],['Aviso à família','Espera-se ao menos uma complicação e um tratamento/cirurgia adicional por procedimento de alongamento; considerar equipe multidisciplinar de apoio'],['Discrepância residual','Pode requerer epifisiodese ou encurtamento esquelético do lado não afetado ao final do processo, para completar a equalização dentro de 2 cm']]},
    r5:{type:'r', cls:'surgical-major', title:'Amputação e Adaptação Protética', txt:'Amputação (Syme ou Boyd) e adaptação protética, com procedimentos adjuvantes conforme o caso (artrodese iliofemoral, artrodese de joelho, rotacionplastia de Van Ness). É o tratamento preferido quando a discrepância prevista é maior que 15-20 cm ou há pé funcionalmente inútil, evitando múltiplas hospitalizações e cirurgias de reconstrução de resultado incerto.', details:[['Momento ideal','Amputação de Syme ao final do primeiro ano de vida; rotacionplastia de Van Ness por volta dos 3 anos de idade'],['Resultado funcional','Marcha quase normal, participação em atividades recreativas/esportivas; deficiência focal femoral proximal tratada com prótese acima do joelho funciona bem, embora não tão bem quanto amputações abaixo do joelho'],['Suporte à família','Recomenda-se contato com famílias de crianças mais velhas já submetidas ao mesmo procedimento para apoiar a decisão']]},
    r6:{type:'r', cls:'surgical', title:'Alongamento com Prego Intramedular Motorizado (PRECICE)', txt:'Alongamento ósseo com prego intramedular magneticamente motorizado, indicado nessa faixa (discrepância prevista de 2-6 cm sem crescimento remanescente confiável para epifisiodese, ou paciente/família que não aceita encurtamento nem perda de estatura), desde que o paciente seja candidato técnico ao dispositivo.', details:[['Especificações do dispositivo','Diâmetros de 8,5/10,7/12,5 mm; comprimentos de 155-365 mm; ganho máximo de 3-8 cm conforme o tamanho do prego'],['Contraindicação relativa','Fises proximais amplamente abertas (risco de necrose avascular do fêmur ou lesão de apófise tibial); obesidade importante (enfraquece o campo magnético)'],['Protocolo domiciliar','Ativações programadas via dispositivo remoto (ERC), tipicamente 3x/dia, com radiografia de controle 1 semana após o início da distração']]},
    r7:{type:'r', cls:'surgical', title:'Encurtamento Ósseo Agudo (Skeletal Shortening)', txt:'Encurtamento agudo do membro longo, indicado quando o paciente está próximo ou além da maturidade esquelética (sem crescimento remanescente suficiente para epifisiodese) ou não é candidato/não deseja o alongamento intramedular, dentro da faixa de discrepância prevista de 2-6 cm.', details:[['Limite de segurança','Regra prática de ~10% do comprimento do osso; até 7,5 cm relatados no fêmur e 5 cm na tíbia sem perda funcional'],['Preferência anatômica','Fêmur preferencialmente (técnica fechada com serra intramedular e haste bloqueada, ou técnica aberta com placa proximal); tíbia raramente encurtada pelo maior risco neurovascular e de pseudartrose'],['Contraindicação relativa a encurtamento >5-6cm em paciente maduro','Aparência bulbosa objetável da coxa']]}
  }
},

ressecao_barra_fisaria_ped:{
  region:'fraturas-pediatricas', num:'LW Cap.27',
  title:'Decisão de Ressecção de Barra/Ponte Óssea Fisária (Physeal Bar Excision)',
  src:'Noonan KJ, Halanski MA, Cap.27 Limb-Length Discrepancy, In: Lovell and Winter\'s Pediatric Orthopaedics — p.4224-4226',
  icon:'🦴', tags:['p','c','s'],
  start:'q1',
  nodes:{
    q1:{type:'q', text:'Há confirmação por imagem avançada (TC e/ou RM) de uma barra/ponte óssea fisária localizada, com deformidade documentada (angulação ou discrepância de comprimento já mensurável, ou linhas de crescimento assimétricas)?', ctx:'A RM é extremamente sensível; nos casos sem deformidade óbvia (angulação ou discrepância) já instalada, é prudente documentar de forma irrefutável a alteração de crescimento antes de indicar tratamento. A TC é muito eficaz para mapear a localização da barra e calcular seu tamanho em relação à área total da fise.', yes:'q2', no:'r1'},
    q2:{type:'q', text:'A barra/ponte óssea envolve menos de 50% da área de superfície da fise?', ctx:'A extensão da barra em relação à área total da fise é o principal determinante da indicação de ressecção versus completar a parada de crescimento.', yes:'q3', no:'q5'},
    q3:{type:'q', text:'A discrepância de comprimento prevista na maturidade esquelética é de pelo menos 2 cm?', ctx:'Ressecções de barra são reservadas a casos em que a discrepância prevista justifica o risco de um procedimento de resultado parcialmente imprevisível.', yes:'q4', no:'r2'},
    q4:{type:'q', text:'Há deformidade angular associada maior que 15-20 graus?', ctx:'A deformidade angular não é, por si só, contraindicação à ressecção da barra, mas deformidades maiores que 15-20 graus geralmente requerem correção cirúrgica concomitante.', yes:'r3', no:'r4'},
    q5:{type:'q', text:'(Barra ≥ 50% da área fisária) A perda de crescimento prevista decorrente da barra é maior que 5 cm?', ctx:'Barras extensas (≥50%) só são candidatas à ressecção em casos selecionados, quando a alternativa (parada completa de crescimento seguida de grande discrepância) seria pior — preferível ao difícil tratamento de alongamento em pacientes muito jovens.', yes:'r5', no:'r6'},
    r1:{type:'r', cls:'conservative', title:'Documentar Antes de Tratar', txt:'Sem confirmação irrefutável de dano fisário (deformidade angular, discrepância mensurável ou linhas de crescimento assimétricas em imagem avançada), o capítulo recomenda documentar a alteração de crescimento antes de considerar qualquer tratamento cirúrgico da barra.', details:[['Conduta','Seguimento clínico-radiográfico seriado (alinhamento e comprimento) para confirmar progressão antes de indicar TC/RM de mapeamento e cirurgia']]},
    r2:{type:'r', cls:'conservative', title:'Completar a Parada de Crescimento (Epifisiodese) em vez de Ressecar', txt:'Quando a barra é menor que 50% da fise mas a discrepância prevista é inferior a 2 cm, completar a parada de crescimento (epifisiodese da fise remanescente) é preferível à ressecção da barra, cujos resultados são imprevisíveis e não se justificam para um ganho potencial pequeno.', details:[['Racional','O potencial ganho de crescimento residual pela ressecção não compensa a imprevisibilidade do procedimento quando a discrepância final projetada já é pequena']]},
    r3:{type:'r', cls:'surgical-major', title:'Ressecção da Barra + Osteotomia Concomitante', txt:'Ressecção da barra fisária (central: acesso metafisário com remoção circunferencial até visualização de 360 graus da fise, facilitada por artroscópio ou espelho dental; periférica: exposição direta com remoção sob magnificação) associada a osteotomia corretiva concomitante da deformidade angular maior que 15-20 graus, com preenchimento do defeito por material inerte (gordura ou cimento cranioplástico).', details:[['Indicação','Barra < 50% da fise, discrepância prevista ≥ 2 cm, deformidade angular > 15-20 graus'],['Detalhe técnico','Colocação de fios-K na epífise e metáfise facilita o monitoramento pós-operatório da função da fise']]},
    r4:{type:'r', cls:'surgical', title:'Ressecção Isolada da Barra Fisária', txt:'Ressecção da barra fisária (central ou periférica, conforme localização) sem necessidade de osteotomia associada, com preenchimento do defeito por material inerte (gordura ou cimento cranioplástico) para prevenir a reformação da ponte óssea.', details:[['Indicação','Barra < 50% da fise, discrepância prevista ≥ 2 cm, sem deformidade angular relevante (≤15-20 graus)'],['Seguimento','Fios-K epifisário e metafisário para monitorar função fisária residual']]},
    r5:{type:'r', cls:'surgical-major', title:'Ressecção de Barra Extensa em Caso Selecionado', txt:'Em casos selecionados de barra ≥50% da área fisária com perda de crescimento prevista maior que 5 cm, a tentativa de ressecção pode ser preferível ao difícil tratamento subsequente de alongamento em paciente jovem, apesar da maior complexidade técnica (remoção circunferencial mais desafiadora, sobretudo em barras centrais).', details:[['Racional','Em pacientes jovens com grande perda de crescimento projetada, a tentativa de preservar a fise reduz a necessidade futura de reconstrução/alongamento de maior magnitude'],['Ressalva do capítulo','Resultado da ressecção nessas barras extensas permanece menos prognosticável que em barras menores']]},
    r6:{type:'r', cls:'surgical-major', title:'Completar Parada de Crescimento e Planejar Conforme Magnitude', txt:'Para barras ≥50% da fise com perda de crescimento prevista de até 5 cm, a ressecção não é a conduta preferida pelo capítulo; a alternativa é completar a parada de crescimento (epifisiodese) e tratar a discrepância residual resultante de acordo com sua magnitude prevista na maturidade (ver diretrizes gerais de conduta por magnitude: epifisiodese contralateral, encurtamento ósseo ou alongamento, conforme o caso).', details:[['Próximo passo','Reconduzir para as diretrizes gerais de conduta por magnitude de discrepância prevista (0-2 cm: observação; 2-6 cm: epifisiodese/encurtamento/alongamento intramedular; 6-20 cm: reconstrução do membro)']]}
  }
},

ponseti_pe_torto_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.28",
  title:"Protocolo de Ponseti para o Pé Torto Congênito Idiopático (do Diagnóstico à Manutenção)",
  src:"Mosca VS, Bouchard M, Cap.28 The Foot, In: Lovell and Winter's Pediatric Orthopaedics — p.4317-4348",
  icon:"🦶", tags:["p","c","s"],
  start:"q1",
  nodes:{
    q1:{type:"q", text:"Trata-se de pé torto congênito idiopático (sem síndrome, artrogripose ou defeito neuromuscular identificado), com início da manipulação/gessagem de Ponseti em lactente?", ctx:"Pés tortos sindrômicos/neurogênicos ou de apresentação tardia respondem pior ao Ponseti isolado, exigem mais gessos e maior taxa de cirurgia, embora o método ainda deva ser tentado (inclusive até 9 anos em casos negligenciados).", yes:"q2", no:"r9"},
    q2:{type:"q", text:"Após a série de gessos seriados (trocas a cada 5-7 dias, sequência cavo → adução → varo → equino), os componentes de cavo, adução e varo foram corrigidos, restando apenas equino residual?", ctx:"A correção completa de cavo/adução/varo pelo método de Ponseti é alcançada em cerca de 90% dos casos; a sequência de correção deve ser respeitada, com contrapressão na face dorsolateral da cabeça do tálus (nunca no calcâneo/cuboide).", yes:"q3", no:"q6"},
    q3:{type:"q", text:"É possível atingir pelo menos 10 graus de dorsiflexão do tornozelo apenas com os gessos, sem falsa dorsiflexão através do mediopé (calcâneo permanece palpável na posição normal)?", ctx:"A correção completa do equino apenas com gesso ocorre em menos de 10% dos casos; deve-se confirmar que o movimento é verdadeiro no tornozelo, e não uma falsa dorsiflexão do mediopé.", yes:"q4", no:"r2"},
    q4:{type:"q", text:"A família está disponível e orientada para manter a órtese de abdução do pé (FAB) em tempo integral por 3 meses e depois em uso noturno por 3 a 5 anos?", ctx:"Sem programa adequado de órtese, o risco de recidiva do pé torto chega a 70%; a orientação familiar deve começar no primeiro encontro, bem antes do início do tratamento.", yes:"r1", no:"r4"},
    q6:{type:"q", text:"Já se completaram cerca de 3 meses de gessagem seriada semanal sem melhora adicional da deformidade residual?", ctx:"Se boa correção não for alcançada após 3 meses de gesso, é improvável que o tratamento não operatório continuado seja bem-sucedido.", yes:"r5", no:"r8"},
    r1:{type:"r", cls:"conservative", title:"Manutenção com órtese de abdução do pé (FAB), sem necessidade de tenotomia", txt:"Correção completa alcançada apenas com manipulação e gesso. Iniciar imediatamente a fase de manutenção com a órtese de abdução do pé (FAB): uso em tempo integral (23h/dia) por 3 meses, seguido de uso noturno por 3 a 5 anos. Reforçar exercícios de alongamento em dorsiflexão pelos pais (pelo menos 1 minuto, 3x/dia), pois o equino é o componente que recidiva primeiro.", details:[["Indicação","Correção completa de cavo/adução/varo/equino apenas com gesso"],["Conduta","Iniciar fase de manutenção com FAB imediatamente"],["Fonte","p.4342-4346"]]},
    r2:{type:"r", cls:"surgical", title:"Tenotomia percutânea do tendão de Aquiles indicada", txt:"Realizar tenotomia percutânea do tendão de Aquiles (em consultório ou centro cirúrgico, conforme rotina institucional) quando não se atinge pelo menos 10 graus de dorsiflexão apenas com os gessos — necessário em mais de 90% dos casos. Aplicar gesso final por 3 semanas com o pé em 15-20 graus de dorsiflexão e 70-75 graus de rotação externa, seguido do início da fase de manutenção com FAB.", details:[["Indicação","Dorsiflexão <10 graus apesar de gessagem seriada adequada"],["Técnica","Tenotomia percutânea completa do tendão de Aquiles"],["Pós-operatório","Gesso final por 3 semanas + início da FAB"],["Fonte","p.4343-4345"]]},
    r4:{type:"r", cls:"conservative", title:"Reforçar orientação familiar sobre a órtese — alto risco de recidiva", txt:"Sem adesão adequada à órtese de abdução do pé, o risco de recidiva da deformidade chega a 70%. Reforçar de forma intensiva a orientação familiar sobre a importância da FAB antes de assumir falha do tratamento. Se a deformidade recidivar apesar da orientação, reiniciar manipulação e gessagem seguida de nova tentativa de bracing, com consideração de transferência do tibial anterior se houver desequilíbrio muscular dinâmico identificado após a idade de marcha.", details:[["Problema identificado","Dificuldade de adesão à FAB"],["Risco","Recidiva em até 70% sem bracing adequado"],["Conduta se recidiva","Remanipulação/gesso + reforço de bracing ± transferência do tibial anterior"],["Fonte","p.4345-4348"]]},
    r5:{type:"r", cls:"surgical-major", title:"Falha do tratamento não operatório — considerar liberação cirúrgica", txt:"Após tentativa adequada de gessagem seriada (cerca de 3 meses) sem melhora adicional da deformidade residual, considerar liberação cirúrgica. Preferir abordagem à la carte, liberando seletivamente apenas as estruturas patológicas que não responderam ao tratamento não operatório, com preservação obrigatória do ligamento interósseo talocalcâneo (técnicas de Carroll/McKay) para evitar translação lateral do calcâneo.", details:[["Indicação","Ausência de melhora após ~3 meses de gessagem seriada adequada"],["Abordagem preferencial","À la carte, com preservação do ligamento interósseo talocalcâneo"],["Idade usual de cirurgia","3 a 12 meses na maioria dos centros"],["Fonte","p.4350-4364"]]},
    r8:{type:"r", cls:"conservative", title:"Continuar gessagem seriada e reavaliar", txt:"Ainda não se completou um período adequado de tratamento não operatório. Continuar a gessagem seriada semanal (trocas a cada 5-7 dias), reavaliando a progressão da correção na sequência cavo → adução → varo → equino, com escore de Pirani ou Dimeglio a cada consulta.", details:[["Conduta","Manter gessagem seriada semanal"],["Reavaliação","Escore de Pirani/Dimeglio a cada troca de gesso"],["Fonte","p.4334-4343"]]},
    r9:{type:"r", cls:"surgical", title:"Manejo individualizado do pé torto não idiopático ou de apresentação tardia", txt:"Em pé torto sindrômico, neurogênico, artrogripótico ou de apresentação tardia (criança maior previamente não tratada), ainda vale a pena tentar o método de Ponseti (documentado como útil mesmo até 9 anos em casos negligenciados), mas com expectativa de gessagem mais prolongada e maior probabilidade de necessidade de cirurgia. Manter avaliação neuromuscular completa e monitoramento rigoroso da resposta ao gesso.", details:[["Contexto","Pé torto sindrômico/neurogênico/artrogripótico ou apresentação tardia"],["Conduta inicial","Tentar método de Ponseti mesmo assim, com expectativas ajustadas"],["Observação","Maior rigidez, mais sessões de gesso e maior taxa de cirurgia esperadas"],["Fonte","p.4312-4317, 4333-4334"]]}
  }
},

coalizao_tarsal_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.28",
  title:"Conduta na Coalizão Tarsal Sintomática (do Diagnóstico à Cirurgia)",
  src:"Mosca VS, Bouchard M, Cap.28 The Foot, In: Lovell and Winter's Pediatric Orthopaedics — p.4572-4585",
  icon:"🦶", tags:["p","c","s"],
  start:"q1",
  nodes:{
    q1:{type:"q", text:"O pé apresenta dor real, compatível com coalizão tarsal sintomática (dor insidiosa em seio do tarso ou face medial do retropé, tipicamente entre 8 e 16 anos, com rigidez subtalar)?", ctx:"Apenas cerca de 25% das coalizões tarsais tornam-se sintomáticas; não há evidência de incapacidade a longo prazo nas coalizões assintomáticas, que não devem ser tratadas.", yes:"q2", no:"r5"},
    q2:{type:"q", text:"Radiografias em carga (AP, lateral, oblíqua e Harris axial) mostram sinais sugestivos de coalizão (barra calcaneonavicular na oblíqua/anteater nose sign, ou talar beaking/C-sign/faceta estreita sugerindo coalizão talocalcaneana)?", ctx:"O C-sign tem baixa sensibilidade e não é patognomônico; a faceta média estreita ou ausente é o achado mais acurado para coalizão subtalar.", yes:"q3", no:"q4"},
    q4:{type:"q", text:"Persiste dúvida diagnóstica ou suspeita de coalizão ainda em estágio fibroso (não visível em radiografia simples)?", ctx:"RM pode identificar coalizão em estágio fibroso quando radiografia e TC são inconclusivas; bone scan pode ajudar a identificar a verdadeira causa da dor.", yes:"q5", no:"r6"},
    q5:{type:"q", text:"RM ou outros exames confirmam a presença de coalizão (fibrosa) ou identificam outra causa para o pé rígido doloroso?", ctx:"Causas alternativas de pé rígido doloroso incluem artrite idiopática juvenil, infecção subtalar, lesões ósseas do tálus/calcâneo/mediopé e sequelas de trauma.", yes:"q3", no:"r6"},
    q3:{type:"q", text:"Já foi realizada uma tentativa adequada de tratamento não operatório (modificação de atividade, anti-inflamatórios, bota gessada ou gesso abaixo do joelho)?", ctx:"Alívio completo da dor costuma ocorrer em 24-48h após imobilização; cerca de 30% permanecem sem dor após a retirada do gesso/bota 6 semanas depois.", yes:"q6b", no:"r7"},
    q6b:{type:"q", text:"Houve alívio duradouro da dor após o tratamento não operatório?", ctx:"Um subgrupo de pacientes mantém-se assintomático apenas com imobilização e palmilha de acomodação, sem necessidade de cirurgia.", yes:"r8", no:"q7"},
    q7:{type:"q", text:"TC de cortes finos (coronal/sagital/transverso com reconstrução 3D) foi realizada, definindo histologia, tamanho relativo à faceta posterior, saúde cartilaginosa e grau de deformidade do retropé?", ctx:"Esses quatro critérios tomográficos orientam diretamente a decisão cirúrgica e o prognóstico da ressecção, incluindo a identificação do subtipo posteromedial (28% dos casos, com melhor prognóstico de ressecção).", yes:"q8", no:"r11"},
    q8:{type:"q", text:"A coalizão é predominantemente calcaneonavicular, sem acometimento relevante da articulação subtalar?", ctx:"Coalizões calcaneonaviculares e talocalcaneanas respondem por cerca de 90% de todos os casos e têm técnicas de ressecção distintas.", yes:"r9", no:"r10"},
    r5:{type:"r", cls:"conservative", title:"Coalizão assintomática — nenhum tratamento indicado", txt:"Cerca de 75% das coalizões tarsais permanecem assintomáticas ao longo da vida, sem evidência de incapacidade a longo prazo. Não há indicação de tratamento profilático; orientar a família e manter acompanhamento clínico se necessário.", details:[["Indicação","Coalizão identificada incidentalmente, sem dor"],["Conduta","Observação, sem tratamento"],["Fonte","p.4584"]]},
    r6:{type:"r", cls:"conservative", title:"Investigar outras causas de pé rígido doloroso", txt:"Sem confirmação de coalizão tarsal, investigar diagnósticos diferenciais de pé rígido doloroso: artrite idiopática juvenil (hemograma, VHS, PCR, FAN, fator reumatoide), infecção subtalar, lesões ósseas do tálus/calcâneo/mediopé e sequelas de trauma.", details:[["Achado","Sem sinais radiográficos/RM de coalizão"],["Diferenciais","AIJ, infecção, tumor ósseo, sequela de trauma"],["Fonte","p.4579-4583"]]},
    r7:{type:"r", cls:"conservative", title:"Iniciar tratamento não operatório", txt:"Iniciar modificação de atividade, anti-inflamatórios não esteroidais e imobilização em bota gessada ou gesso abaixo do joelho por cerca de 4 a 6 semanas. Alívio completo da dor é esperado em 24-48h após a imobilização.", details:[["Conduta","Bota/gesso 4-6 semanas + AINE + modificação de atividade"],["Resposta esperada","Alívio em 24-48h; ~30% permanecem sem dor após retirada"],["Fonte","p.4584"]]},
    r8:{type:"r", cls:"conservative", title:"Manter conduta conservadora com palmilha de acomodação", txt:"Bom alívio duradouro com tratamento não operatório. Manter palmilha de acomodação (cushioned insert), evitar palmilha rígida moldada (que pode piorar a dor), e reservar reavaliação para recidiva dos sintomas.", details:[["Indicação","Alívio duradouro após imobilização"],["Conduta","Palmilha de acomodação + seguimento clínico"],["Fonte","p.4584"]]},
    r9:{type:"r", cls:"surgical", title:"Ressecção da coalizão calcaneonavicular com interposição de tecido mole", txt:"Realizar ressecção da barra calcaneonavicular com interposição de gordura autógena (preferencial, menor reossificação e reoperação) ou extensor curto dos dedos (EDB). A combinação de ressecção com interposição reduz claramente a recidiva e aumenta a taxa de alívio duradouro da dor comparada à ressecção isolada.", details:[["Indicação","Coalizão calcaneonavicular sintomática refratária ao tratamento conservador"],["Técnica preferida","Ressecção + interposição de gordura autógena (ou EDB)"],["Fonte","p.4584-4585"]]},
    r10:{type:"r", cls:"surgical-major", title:"Ressecção da coalizão talocalcaneana guiada por critérios tomográficos", txt:"Realizar ressecção da coalizão talocalcaneana guiada pelos critérios de TC (tamanho relativo à faceta posterior, saúde da cartilagem remanescente, grau de deformidade do retropé), com atenção ao subtipo posteromedial, que tem melhor prognóstico que a coalizão da faceta média clássica. Reservar osteotomia ou artrodese para casos avançados com degeneração articular estabelecida ou coalizão muito extensa.", details:[["Indicação","Coalizão talocalcaneana sintomática refratária, critérios de TC favoráveis à ressecção"],["Alternativa em casos avançados","Osteotomia corretiva ou artrodese se degeneração articular já estabelecida"],["Fonte","p.4580-4585"]]},
    r11:{type:"r", cls:"conservative", title:"Solicitar TC antes de definir a conduta cirúrgica", txt:"Antes de indicar qualquer ressecção, obter TC de cortes finos nos três planos com reconstrução 3D para definir histologia da coalizão, tamanho relativo à faceta posterior, saúde da cartilagem remanescente e grau de deformidade do retropé — informações indispensáveis para o planejamento cirúrgico e para excluir coalizão talocalcaneana concomitante em casos de coalizão calcaneonavicular.", details:[["Conduta","Solicitar TC de cortes finos com reconstrução 3D"],["Objetivo","Definir tipo, tamanho, cartilagem e deformidade antes da cirurgia"],["Fonte","p.4580-4582"]]}
  }
},

pe_plano_pediatrico_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.28",
  title:"Triagem do Pé Plano Pediátrico — Flexível vs. Rígido e Conduta Correspondente",
  src:"Mosca VS, Bouchard M, Cap.28 The Foot, In: Lovell and Winter's Pediatric Orthopaedics — p.4441-4468",
  icon:"🦶", tags:["p","c"],
  start:"q1",
  nodes:{
    q1:{type:"q", text:"O retropé é flexível — o arco surge e o calcanhar corrige de valgo para varo ao ficar na ponta dos pés e/ou o teste de Jack (dorsiflexão passiva do hálux) é positivo?", ctx:"O critério central de Harris e Beath é a flexibilidade/mobilidade do pé, não o achatamento do arco em si; pé plano rígido geralmente indica coalizão tarsal ou outra causa estrutural.", yes:"q2", no:"q6"},
    q2:{type:"q", text:"A criança é assintomática, sem dor sob a cabeça do tálus e sem outras queixas?", ctx:"O pé plano flexível é uma variação anatômica normal presente na maioria das crianças; órteses e modificações de calçado não alteram o desenvolvimento espontâneo do arco em estudos controlados randomizados.", yes:"r1", no:"q3"},
    q3:{type:"q", text:"Há contratura isolada do Aquiles/gastrocnêmio (dorsiflexão do tornozelo menor que 10 graus com a subtalar invertida) associada a dor sob a cabeça do tálus plantar-fletido?", ctx:"O teste diferencial gastrocnêmio vs sóleo (joelho fletido vs estendido) orienta a técnica cirúrgica caso se chegue a essa indicação; a dor sob a cabeça do tálus é típica desse padrão de pé plano com Aquiles curto.", yes:"q4", no:"r2"},
    q4:{type:"q", text:"Um programa dirigido de alongamento do Aquiles (com a subtalar invertida) e/ou palmilha de acomodação, mantidos por tempo prolongado, aliviaram a dor?", ctx:"A refratariedade ao tratamento conservador prolongado (não apenas a presença de dor) é o critério para considerar reconstrução cirúrgica.", yes:"r2", no:"r3"},
    q6:{type:"q", text:"Radiografias em carga (AP, lateral, oblíqua e Harris axial) mostram sinais de coalizão tarsal (C-sign, anteater nose sign, talar beaking, faceta média estreita/ausente)?", ctx:"O pé plano rígido (peroneal espasmódico) é classicamente causado por coalizão tarsal, mas outras causas de retropé rígido devem ser sistematicamente excluídas.", yes:"r4", no:"q7"},
    q7:{type:"q", text:"Há evidência de artrite (VHS/PCR/FAN/fator reumatoide alterados) ou outra causa identificável (infecção, tumor, sequela de trauma) para a rigidez subtalar?", ctx:"O pé plano rígido também pode ser causado por artrite idiopática juvenil, infecção subtalar, lesões ósseas do tálus/calcâneo/mediopé ou sequelas de trauma, diagnósticos que devem ser sistematicamente excluídos antes de assumir causa idiopática.", yes:"r5", no:"r6"},
    r1:{type:"r", cls:"conservative", title:"Orientação e observação — pé plano flexível assintomático", txt:"Nenhum tratamento é necessário. Orientar a família de que o pé plano flexível é uma variação anatômica normal e não uma deformidade potencialmente incapacitante; o arco tende a se desenvolver espontaneamente ao longo da primeira década de vida, com ampla faixa de normalidade.", details:[["Indicação","Pé plano flexível, assintomático"],["Conduta","Educação da família, sem tratamento"],["Fonte","p.4449-4452"]]},
    r2:{type:"r", cls:"conservative", title:"Órtese de acomodação e/ou alongamento do Aquiles", txt:"Usar palmilhas de amortecimento (prontas ou moldadas) para alívio sintomático em dor inespecífica, ou programa dirigido de alongamento do tríceps sural com a subtalar mantida invertida quando houver contratura de Aquiles/gastrocnêmio associada a dor sob a cabeça do tálus. Manter por período prolongado antes de considerar cirurgia.", details:[["Indicação","Pé plano flexível sintomático, sem falha de tratamento conservador prolongado"],["Conduta","Palmilha de acomodação ± alongamento dirigido do Aquiles/gastrocnêmio"],["Fonte","p.4452-4453"]]},
