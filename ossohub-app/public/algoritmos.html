    r3:{type:"r", cls:"surgical", title:"Considerar reconstrução cirúrgica preservadora de movimento", txt:"Diante de falha comprovada do tratamento conservador prolongado (dor persistente sob a cabeça do tálus com Aquiles/gastrocnêmio curto), considerar osteotomia de alongamento do calcâneo (Evans/Mosca) ou osteotomia de deslocamento medial do calcâneo, associadas a alongamento do Aquiles/gastrocnêmio conforme o padrão de contratura identificado. Evitar artrodeses (tríplice ou subtalar) pelo risco comprovado de artrose degenerativa adjacente em longo prazo.", details:[["Indicação","Dor refratária sob a cabeça do tálus, Aquiles/gastrocnêmio curto, falha do tratamento conservador prolongado"],["Opções cirúrgicas","Osteotomia de alongamento do calcâneo (Evans/Mosca) ± alongamento do Aquiles/gastrocnêmio"],["Evitar","Artrodeses do complexo subtalar"],["Fonte","p.4452-4468"]]},
    r4:{type:"r", cls:"conservative", title:"Pé plano rígido por provável coalizão tarsal — seguir algoritmo específico", txt:"Sinais radiográficos sugerem coalizão tarsal. Conduzir a investigação e o tratamento conforme o algoritmo específico de coalizão tarsal sintomática: confirmação por TC de cortes finos, tentativa inicial de tratamento não operatório (bota/gesso) e, se refratário, ressecção guiada pelos critérios tomográficos (calcaneonavicular vs talocalcaneana).", details:[["Achado","Sinais radiográficos de coalizão tarsal"],["Próximo passo","Algoritmo de coalizão tarsal sintomática (TC + conduta escalonada)"],["Fonte","p.4572-4585"]]},
    r5:{type:"r", cls:"conservative", title:"Investigar e tratar a causa subjacente identificada", txt:"Encaminhar para investigação e tratamento específico conforme a causa identificada (reumatologia para artrite idiopática juvenil, investigação de infecção subtalar/osteomielite, avaliação oncológica para lesão óssea suspeita, ou manejo de sequela de trauma).", details:[["Achado","Evidência de artrite, infecção, tumor ou sequela de trauma"],["Conduta","Encaminhamento e tratamento específico da causa"],["Fonte","p.4578-4583"]]},
    r6:{type:"r", cls:"conservative", title:"Pé plano rígido idiopático (peroneal espasmódico) sem coalizão identificada", txt:"Sem coalizão tarsal visível em radiografia e sem outra causa identificada, considerar investigação adicional com RM (para coalizão ainda em estágio fibroso não visível em radiografia/TC) e manter seguimento clínico rigoroso, já que a rigidez subtalar sem causa aparente ainda requer explicação antes de qualquer decisão terapêutica definitiva.", details:[["Achado","Pé rígido sem coalizão visível ao raio-x, sem outra causa evidente"],["Próximo passo","Considerar RM para coalizão fibrosa oculta; seguimento clínico"],["Fonte","p.4583-4584"]]}
  }
},

// ===== Cap.29 The Child with a Limb Deficiency (Bowen RE, Otsuka NY, Doty SA) — Lovell and Winter's Pediatric Orthopaedics, 8th ed. — livro p.4625-4901 =====
// 2 algoritmos gerados, fiéis às recomendações explícitas do texto (deficiência fibular longitudinal
// segundo Birch et al./Westin et al., p.4684-4685; e deficiência femoral congênita/PFFD segundo as
// recomendações dos próprios autores do capítulo, p.4770-4771, 4773-4780, 4793-4794).

fibular_hemimelia_ped:{
  region:'fraturas-pediatricas', num:'LW Cap.29',
  title:'Conduta na Deficiência Fibular Longitudinal (Fíbula Hemimelia)',
  src:'Bowen RE, Otsuka NY, Doty SA, Cap.29 The Child with a Limb Deficiency, In: Lovell and Winter\'s Pediatric Orthopaedics — p.4681-4685',
  icon:'🦴', tags:['p','c','s','sm'],
  start:'q1',
  nodes:{
    q1:{type:'q', text:'O pé é funcional — permite apoio de peso com mobilidade e estabilidade adequadas, sem deformidade significativa — ou pode ser tornado funcional?', ctx:'Esta é a pergunta central da classificação funcional de Birch et al. para a deficiência fibular longitudinal: a funcionalidade do pé (e não apenas a discrepância de comprimento) determina o ramo inicial de decisão.', yes:'q2', no:'q6'},
    q2:{type:'q', text:'A discrepância de comprimento de membro prevista para a maturidade esquelética é menor que 5%?', ctx:'A discrepância deve ser calculada para a maturidade (regra da proporcionalidade), não apenas medida no momento atual. Um fêmur+tíbia de tamanho médio somam cerca de 80 cm na maturidade em uma menina, o que ajuda a converter percentual em centímetros.', yes:'r1', no:'q3'},
    q3:{type:'q', text:'A discrepância prevista está entre 6% e 10%?', ctx:'Nessa faixa, epifisiodese contralateral ou um único procedimento de alongamento costuma ser suficiente.', yes:'r2', no:'q4'},
    q4:{type:'q', text:'A discrepância prevista está entre 10% e 30%?', ctx:'Esta é a "zona cinzenta" descrita no capítulo: tanto a amputação quanto o alongamento estagiado são considerados aceitáveis, e a decisão final depende da discussão detalhada com a família sobre riscos, número de cirurgias e expectativas.', yes:'q5', no:'r4'},
    q5:{type:'q', text:'Após aconselhamento completo (incluindo contato com outras famílias/pacientes com amputação e com alongamento), a família opta pela tentativa de salvamento do membro por alongamento estagiado?', ctx:'O capítulo enfatiza que os pais, antes de conhecerem outras crianças com deficiência similar, quase sempre preferem inicialmente salvar o membro, sem noção real do que envolve um alongamento estagiado (múltiplas cirurgias, instabilidade de tornozelo/joelho) nem do que é a vida com uma amputação de Syme.', yes:'r3', no:'r4'},
    q6:{type:'q', text:'Há deficiência de membro superior concomitante que torna esse pé funcionalmente necessário como substituto de "mão"?', ctx:'Esta é a única exceção explícita à recomendação de amputação em pé não funcional citada no capítulo.', yes:'r5', no:'r4'},
    r1:{type:'r', cls:'conservative', title:'Observação com Calço Compensador', txt:'Quando o pé é funcional e a discrepância prevista na maturidade é inferior a 5%, não há indicação cirúrgica. Recomenda-se calço no calçado contralateral e monitoramento seriado do crescimento para deformidade progressiva de joelho ou tornozelo.', details:[['Conduta','Calço contralateral + acompanhamento clínico/radiográfico seriado'],['Sem cirurgia indicada','Discrepância prevista < 5% com pé funcional']]},
    r2:{type:'r', cls:'surgical', title:'Epifisiodese Contralateral ou Alongamento Único', txt:'Discrepância prevista de 6% a 10% em pé funcional: epifisiodese do lado contralateral ou um único procedimento de alongamento do lado afetado costuma corrigir adequadamente a discrepância.', details:[['Opções','Epifisiodese contralateral (fise distal do fêmur e/ou proximal da tíbia) ou alongamento único do membro afetado'],['Objetivo','Igualar comprimento de membros com uma única intervenção']]},
    r3:{type:'r', cls:'surgical-major', title:'Alongamento Ósseo Estagiado (Múltiplos Procedimentos)', txt:'Discrepância prevista de 10% a 30%, pé funcional e família optando por salvamento do membro: alongamento estagiado (Ilizarov ou haste intramedular motorizada, conforme idade/maturidade esquelética), associado a reconstrução de tornozelo/joelho quando houver instabilidade, e frequentemente correção do arqueamento tibial anterior e da deformidade em valgo do tornozelo/retropé antes ou durante o alongamento.', details:[['Requisitos','Estabilização de tornozelo e/ou joelho conforme necessário antes/durante o alongamento (ex.: fixador estendido pela articulação, cirurgia estabilizadora prévia)'],['Expectativa realista','Múltiplos procedimentos ao longo da infância/adolescência; resultado cosmético e funcional variável'],['Alternativa se instabilidade grave','Considerar amputação de Syme se o salvamento se mostrar inviável durante o processo']]},
    r4:{type:'r', cls:'surgical-major', title:'Amputação de Syme (ou Boyd)', txt:'Indicada quando o pé não é funcional (independente do comprimento do membro, exceto se necessário como "mão" contralateral), quando a discrepância prevista é maior que 30% em pé funcional, ou quando, na faixa de 10-30%, a família opta por não realizar alongamento estagiado.', details:[['Técnica preferida','Amputação de Syme (apoio terminal, tecnicamente mais simples) ou amputação de Boyd (calcâneo fundido à tíbia, cresce com a criança, adiciona comprimento ao coto)'],['Momento ideal','Poucos meses antes de a criança começar a ficar em pé, para permitir protetização no momento certo do desenvolvimento motor'],['Correção associada','Osteotomia do arqueamento anterior da tíbia no mesmo tempo cirúrgico, se significativo']]},
    r5:{type:'r', cls:'surgical', title:'Tentativa Individualizada de Preservação/Reconstrução do Pé', txt:'Exceção à indicação padrão de amputação em pé não funcional: quando há deficiência de membro superior concomitante que torna esse pé funcionalmente necessário como substituto de "mão", a preservação e reconstrução do pé deve ser tentada de forma individualizada, mesmo em detrimento do resultado protético/de marcha do membro inferior.', details:[['Racional','Prioridade funcional para atividades de vida diária pode superar a prioridade de marcha nesses casos raros'],['Abordagem','Individualizada, conforme função residual do pé e necessidade específica do paciente']]}
  }
},

pffd_deficiencia_femoral_congenita_ped:{
  region:'fraturas-pediatricas', num:'LW Cap.29',
  title:'Conduta na Deficiência Femoral Congênita (PFFD)',
  src:'Bowen RE, Otsuka NY, Doty SA, Cap.29 The Child with a Limb Deficiency, In: Lovell and Winter\'s Pediatric Orthopaedics — p.4770-4771, 4773-4780, 4791-4794',
  icon:'🦵', tags:['p','c','s','sm'],
  start:'q1',
  nodes:{
    q1:{type:'q', text:'A deficiência é bilateral, com relativa simetria entre os dois quadris/fêmures?', ctx:'O tratamento da deficiência femoral congênita bilateral é predominantemente não operatório: essas crianças, em geral, não usam prótese e caminham usando os próprios membros curtos.', yes:'r1', no:'q2'},
    q2:{type:'q', text:'A discrepância de comprimento prevista na maturidade é menor que 20 cm, com quadril estável (ou passível de estabilização), arco de mobilidade do joelho de pelo menos 60 graus sem contratura em flexão, e pé plantígrado (ou passível de ser tornado plantígrado)?', ctx:'Estes são os critérios citados pelos autores do capítulo para considerar o alongamento estagiado como estratégia de tratamento na deficiência femoral congênita unilateral.', yes:'q3', no:'q4'},
    q3:{type:'q', text:'Há deformidade proximal de fêmur (varo/retroversão com ângulo cervicodiafisário menor que 110 graus) ou displasia acetabular relevante que comprometeria a contenção da cabeça femoral durante o alongamento?', ctx:'Nos pacientes Aitken classe A ou B com cabeça femoral móvel no acetábulo, a estabilização do quadril e do fêmur proximal (ex.: procedimento SUPERhip, associando correção óssea e liberação das contraturas de partes moles) antes do alongamento melhorou os resultados de alongamento femoral em estudo citado no capítulo.', yes:'r2', no:'r3'},
    q4:{type:'q', text:'O pé cai ao nível do joelho contralateral, o tornozelo/retropé tem arco de flexão dorsal/plantar de pelo menos 60 graus sem contratura em equino, e a família aceita a alteração cosmética do pé apontando para trás?', ctx:'Estes são os critérios funcionais e de aceitação familiar citados pelos autores para indicar rotacionoplastia de Van Nes em vez de artrodese de joelho com amputação de pé. Até 70% das crianças com PFFD têm deficiência fibular associada no mesmo lado, o que deve ser avaliado cuidadosamente.', yes:'r4', no:'r5'},
    r1:{type:'r', cls:'conservative', title:'Tratamento Não Operatório (Deficiência Bilateral)', txt:'Na deficiência femoral congênita bilateral, o tratamento é predominantemente não operatório. Essas crianças em geral não usam prótese. Ocasionalmente, se há envolvimento assimétrico dos membros, uma discrepância de comprimento pode existir e o tratamento deve ser individualizado.', details:[['Conduta padrão','Observação e acompanhamento, sem protetização de rotina'],['Exceção','Assimetria significativa entre os lados pode exigir tratamento individualizado da discrepância']]},
    r2:{type:'r', cls:'surgical-major', title:'Estabilização de Quadril/Fêmur Proximal Seguida de Alongamento Estagiado', txt:'Nos pacientes Aitken classe A ou B com deformidade proximal do fêmur (ângulo cervicodiafisário < 110 graus) ou displasia acetabular relevante, recomenda-se reconstrução do quadril (ex.: procedimento SUPERhip, combinando osteotomia femoral proximal com liberação das contraturas de flexores e abdutores do quadril) antes de iniciar o alongamento estagiado do membro, tipicamente por volta dos 8 anos de idade.', details:[['Componentes','Correção de varo/retroversão femoral, reorientação/aumento acetabular quando indicado, liberação de contraturas de partes moles (reto femoral, iliopsoas, glúteo médio/mínimo)'],['Sequência','Estabilização do quadril primeiro, alongamento estagiado depois'],['Acompanhamento','Epifisiodese contralateral associada conforme necessário']]},
    r3:{type:'r', cls:'surgical-major', title:'Alongamento Ósseo Estagiado Direto', txt:'Quando o quadril já é estável e não há deformidade proximal relevante do fêmur nem displasia acetabular significativa, o alongamento estagiado do membro pode ser iniciado diretamente, associado a epifisiodese contralateral e, se necessário, calço de sapato.', details:[['Início típico','Por volta dos 8 anos de idade, segundo a preferência dos autores do capítulo'],['Acompanhamento','Monitoramento de instabilidade de quadril e joelho durante o alongamento, com extensão do fixador pelas articulações ou splintagem em extensão se necessário']]},
    r4:{type:'r', cls:'surgical-major', title:'Rotacionoplastia de Van Nes', txt:'Quando o pé cai ao nível do joelho contralateral e o tornozelo/retropé tem mobilidade e alinhamento adequados, a rotacionoplastia de Van Nes (rotação de 180 graus do segmento distal, predominantemente através da artrodese do joelho) permite que o tornozelo funcione como o novo joelho, com resultado funcional superior ao da artrodese de joelho com amputação de pé.', details:[['Pré-requisito','Fortalecimento pré-operatório de artelhos/tornozelo/retropé; aceitação familiar da alteração cosmética'],['Complicação a monitorar','Desrotação progressiva com o crescimento, tratável com osteotomia rotacional da tíbia'],['Resultado funcional','Superior à artrodese de joelho + amputação de pé; inferior a uma amputação transtibial verdadeira']]},
    r5:{type:'r', cls:'surgical-major', title:'Artrodese de Joelho com Amputação de Pé (Syme ou Boyd)', txt:'Quando a rotacionoplastia não é aceita pela família ou o tornozelo/pé não têm alinhamento/mobilidade adequados (ex.: valgo/equino grave), a artrodese de joelho associada à amputação de pé (Syme ou Boyd) é a alternativa, criando um único segmento de alavanca mais longo e eficiente para a prótese. A remoção de uma ou ambas as fises ao redor do joelho (fêmur distal e/ou tíbia proximal) é decidida conforme o comprimento previsto dos segmentos, para permitir espaço para o joelho protético.', details:[['Fixação','Haste intramedular rígida cruzando o sítio de artrodese, com fio-K adicional para estabilidade rotacional'],['Planejamento de fises','A maioria dos casos remove ambas as fises (femoral distal e tibial proximal) para evitar coto residual longo demais para acomodar o joelho protético'],['Alinhamento','A tíbia deve ser fundida em linha com o fêmur (não na posição fletida/aduzida/rodada do segmento proximal), pois a deformidade proximal tende a se resolver com o uso protético ao longo dos meses']]}
  }
},



ocd_joelho_estabilidade_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.30",
  title:"Conduta na osteocondrite dissecante (OCD) do joelho conforme estabilidade da lesão",
  src:"Kocher MS, Ganley TJ, Cap.30 Sports Medicine in the Growing Child, In: Lovell and Winter's Pediatric Orthopaedics — p.5054-5063",
  icon:"🏃", tags:["p","c","s"],
  start:"q1",
  nodes:{
    q1:{
      text:"Paciente esqueleticamente imaturo (fises abertas) com lesão de OCD do joelho ESTÁVEL na RM (sem linha de sinal alto em T2 entre o fragmento e o osso subcondral) e sem corpo livre?",
      cls:"conservative",
      yes:"q2", no:"q5"
    },
    q2:{
      text:"Iniciar tratamento não operatório: restrição de atividades de alto impacto e imobilização/gesso (cilíndrico se pouco colaborativo) por 6 a 10 semanas, com afastamento do esporte por até 6 meses. Cicatrização radiográfica confirmada dentro desse período?",
      cls:"conservative",
      yes:"q3", no:"q5"
    },
    q3:{
      text:"Consolidação confirmada (lesões estáveis cicatrizam em média em 4 a 5 meses, com taxa de cicatrização em torno de 78% com tratamento não operatório): liberar retorno gradual ao esporte.",
      cls:"conservative"
    },
    q5:{
      text:"Lesão instável na RM, ou lesão estável que falhou ao tratamento conservador por 6 meses: indicar avaliação e tratamento artroscópicos. Classificação artroscópica de Guhl — lesão íntegra (intacta), sem separação?",
      cls:"surgical",
      yes:"q6", no:"q7"
    },
    q6:{
      text:"Lesão íntegra: realizar perfuração (drilling) transarticular ou retrógrada para estimular a cicatrização vascular através dos pequenos canais criados.",
      cls:"surgical"
    },
    q7:{
      text:"Lesão em separação inicial ou parcialmente destacada, ainda passível de preservação e fixação (leito ainda viável)?",
      cls:"surgical",
      yes:"q8", no:"q9"
    },
    q8:{
      text:"Redução e fixação interna do fragmento (pinos bioabsorvíveis, tiras ósseas ou parafusos), com desbridamento do leito até osso sangrante e enxerto ósseo se necessário; sem carga por 6 a 8 semanas, com segunda artroscopia (second-look) antes de liberar carga.",
      cls:"surgical"
    },
    q9:{
      text:"Cratera insalvável ou corpo(s) livre(s): remoção do fragmento/corpo livre e regularização das bordas articulares; a excisão isolada tem maus resultados a longo prazo, sendo recomendadas técnicas de restauração da superfície articular (perfuração/microfratura, enxerto osteocondral autólogo/alogênico ou implante de condrócitos autólogos).",
      cls:"surgical-major"
    }
  }
},

acl_reconstrucao_maturidade_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.30",
  title:"Seleção da técnica de reconstrução do LCA conforme a maturidade esquelética na criança em crescimento",
  src:"Kocher MS, Ganley TJ, Cap.30 Sports Medicine in the Growing Child, In: Lovell and Winter's Pediatric Orthopaedics — p.4999-5002",
  icon:"🏃", tags:["p","c","s"],
  start:"q1",
  nodes:{
    q1:{
      text:"Lesão do LCA em criança/adolescente: há ruptura completa com instabilidade funcional, lesão parcial refratária ao tratamento não operatório, ou lesão associada reparável (menisco/condral)?",
      cls:"conservative",
      yes:"q2", no:"q1b"
    },
    q1b:{
      text:"Lesão parcial do LCA sem instabilidade funcional e sem lesão associada reparável: tratamento não operatório — modificação de atividades (evitar esportes de pivô/corte), fortalecimento e reavaliação clínica seriada (risco de lesão meniscal/condral secundária se não aderente).",
      cls:"conservative"
    },
    q2:{
      text:"Indicação de reconstrução cirúrgica do LCA (cirurgia tipicamente adiada ≥3 semanas até recuperar amplitude de movimento e reduzir o derrame, pelo maior risco de rigidez se reconstrução aguda). Paciente com maturidade esquelética completa (Tanner 5)?",
      cls:"surgical",
      yes:"q_adult", no:"q3"
    },
    q_adult:{
      text:"Tratar como adulto: reconstrução transfisária padrão do LCA, com escolha de enxerto habitual.",
      cls:"surgical"
    },
    q3:{
      text:"Tanner estágio 1 ou 2 (pré-púbere; idade óssea tipicamente < 14 anos em meninos ou < 13 anos em meninas), com grande quantidade de crescimento remanescente?",
      cls:"surgical",
      yes:"q_prepub", no:"q4"
    },
    q_prepub:{
      text:"Reconstrução poupadora da fise (physeal-sparing): técnica combinada intra-articular e extra-articular (modificação de MacIntosh com banda iliotibial) ou túneis totalmente epifisários (fêmur e tíbia), evitando a física de ambos os lados.",
      cls:"surgical"
    },
    q4:{
      text:"Tanner estágio 3 ou 4 (adolescente com crescimento significativo remanescente): reconstrução transfisária convencional com enxerto autólogo de isquiotibiais. Há instabilidade rotatória lateral acentuada, hiperfrouxidão ou aumento do slope tibial posterior associados?",
      cls:"surgical",
      yes:"q_alt", no:"q_transphyseal"
    },
    q_transphyseal:{
      text:"Reconstrução transfisária isolada com enxerto autólogo de isquiotibiais.",
      cls:"surgical"
    },
    q_alt:{
      text:"Associar aumento extra-articular à reconstrução transfisária do LCA (reconstrução do ligamento anterolateral ou tenodese extra-articular lateral), reduzindo as taxas de pivot-shift residual e de reinjúria nesse subgrupo.",
      cls:"surgical"
    }
  }
},



salter_harris_conduta_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.31",
  title:"Classificação e Conduta Inicial nas Fraturas Fisárias (Salter-Harris)",
  src:"Edmonds EW, Herman MJ, Cap.31 The Principles of Pediatric Fracture and Trauma, In: Lovell and Winter's Pediatric Orthopaedics — p.5129-5135",
  icon:"🦴", tags:["fise","salter-harris","trauma-pediatrico"],
  start:"q1",
  nodes:{
    q1:{
      q:"Radiografia: a linha de fratura atravessa toda a espessura da fise, sem fragmento metafisário associado (separação transepifisária pura)?",
      yes:"leaf_sh1", no:"q2"
    },
    q2:{
      q:"Há fragmento metafisário triangular associado a uma porção da fise intacta (fragmento de Thurston-Holland)? É o padrão mais comum (~75% das fraturas fisárias).",
      yes:"leaf_sh2", no:"q3"
    },
    q3:{
      q:"A linha de fratura é vertical, intra-articular, cruzando parte da fise e saindo pela epífise até a superfície articular — SEM atingir a metáfise?",
      yes:"leaf_sh3", no:"q4"
    },
    q4:{
      q:"A linha de fratura é vertical, intra-articular, cruzando metáfise + fise + epífise até a superfície articular (todas as zonas)?",
      yes:"leaf_sh4", no:"q5"
    },
    q5:{
      q:"Suspeita de lesão por esmagamento (crush) axial da fise, sem linha de fratura visível na radiografia inicial, com diagnóstico geralmente firmado de forma retrospectiva (após ≥6 meses, ao notar-se parada de crescimento)?",
      yes:"leaf_sh5", no:"leaf_sh_outro"
    },
    leaf_sh1:{
      cls:"conservative",
      title:"Salter-Harris Tipo I",
      desc:"Redução fechada suave (se deslocada) e imobilização gessada. Fratura germinativa geralmente poupada — parada de crescimento incomum, mas pode ocorrer em fraturas de maior energia ou com periósteo interposto. Comum em lactentes/crianças pequenas e de diagnóstico clínico (dor localizada à palpação da fise), pois a radiografia pode ser normal ou minimamente alterada."
    },
    leaf_sh2:{
      cls:"conservative",
      title:"Salter-Harris Tipo II",
      desc:"Redução fechada e imobilização gessada na maioria dos casos — o fragmento de Thurston-Holland confere estabilidade. Parada de crescimento incomum na maior parte das localizações (ex.: rádio distal raramente evolui com fechamento fisário precoce), porém no fêmur distal o risco de distúrbio de crescimento chega a 50% devido à fise mais ondulada, que exige mais energia para fraturar — recomenda-se seguimento clínico-radiográfico prolongado independentemente do tratamento escolhido."
    },
    leaf_sh3:{
      cls:"surgical",
      title:"Salter-Harris Tipo III",
      desc:"Fratura intra-articular — redução anatômica é indicada (fechada ou aberta) para restaurar a superfície articular a ≤2 mm de degrau/gap e minimizar o risco de ponte fisária localizada. Redução aberta com fixação interna (evitando implantes que cruzem a fise sempre que possível) quando a redução fechada não for anatômica."
    },
    leaf_sh4:{
      cls:"surgical-major",
      title:"Salter-Harris Tipo IV",
      desc:"Risco de distúrbio de crescimento mais elevado entre os tipos de Salter-Harris. Redução anatômica precisa (habitualmente aberta, com fixação interna) é obrigatória — a má redução com contato epífise-metáfise favorece formação de ponte óssea (exemplo prototípico de barra fisária). Fratura intra-articular: restaurar superfície articular a ≤2 mm de degrau/gap."
    },
    leaf_sh5:{
      cls:"conservative",
      title:"Salter-Harris Tipo V (esmagamento fisário)",
      desc:"Sem tratamento cirúrgico específico agudo disponível (lesão frequentemente não identificada no momento do trauma); conduta é observação clínico-radiográfica prolongada (mínimo 18 meses) para detecção precoce de parada de crescimento. Existência da entidade é controversa na literatura."
    },
    leaf_sh_outro:{
      cls:"conservative",
      title:"Padrão atípico / Salter-Harris Tipo VI (Rang)",
      desc:"Lesão periférica ao nível do anel pericondral (avulsão ligamentar, trauma direto ou queimadura). Conduta inicial conservadora com vigilância; pode evoluir com parada de crescimento assimétrica e deformidade angular, exigindo tratamento de barra fisária periférica se confirmada (ver algoritmo de barra fisária)."
    }
  }
},

triagem_maus_tratos_ped:{
  region:"fraturas-pediatricas", num:"LW Cap.31",
  title:"Triagem de Suspeita de Maus-Tratos Infantis (Child Abuse) em Criança com Fratura",
  src:"Edmonds EW, Herman MJ, Cap.31 The Principles of Pediatric Fracture and Trauma, In: Lovell and Winter's Pediatric Orthopaedics — p.5193-5208",
  icon:"🚨", tags:["maus-tratos","child-abuse","trauma-pediatrico"],
  start:"q1",
  nodes:{
    q1:{
      q:"A fratura é do tipo metafisário em \"alça de balde\"/\"canto\" (bucket-handle/corner), OU há fratura(s) de costela (especialmente posteriores), OU fratura complexa de crânio com mecanismo relatado trivial?",
      yes:"leaf_alta_pat", no:"q2"
    },
    q2:{
      q:"A criança é não ambulante (ainda não anda/não \"cruising\") OU tem menos de 1 ano de idade?",
      yes:"q3", no:"q4"
    },
    q3:{
      q:"Há fratura de osso longo (ex.: fratura espiral/diafisária de fêmur ou úmero) nesta criança não ambulante/menor de 1 ano?",
      yes:"leaf_alta_naoambulante", no:"q4"
    },
    q4:{
      q:"A história ou mecanismo relatado não corresponde ao padrão de lesão observado, OU há atraso na procura de atendimento (apresentação dias após o evento descrito)?",
      yes:"leaf_alta_discordancia", no:"q5"
    },
    q5:{
      q:"Levantamento esquelético (skeletal survey) mostra fraturas em múltiplos estágios de consolidação (achados de datação distintos) ou achados associados (hematomas atípicos, retinopatia hemorrágica)?",
      yes:"leaf_alta_multiplos_estagios", no:"leaf_baixa_suspeita"
    },
    leaf_alta_pat:{
      cls:"emergency",
      title:"Achado patognomônico / altamente sugestivo de maus-tratos",
      desc:"Notificação obrigatória ao conselho tutelar/serviço de proteção à criança. Internação para levantamento esquelético completo (não usar \"baby-gram\"), avaliação multidisciplinar (pediatra especializado em abuso, radiologista pediátrico, oftalmologia para exame de retina, neurocirurgia/cirurgia pediátrica conforme indicado) e garantia de ambiente seguro antes da alta."
    },
    leaf_alta_naoambulante:{
      cls:"emergency",
      title:"Fratura de osso longo em criança não ambulante/menor de 1 ano — alta suspeita",
      desc:"Fratura espiral diafisária de fêmur/úmero em criança que ainda não anda é fortemente suspeita de maus-tratos (mesmo sendo padrão de fratura acidental comum em crianças que já andam). Notificar, internar para levantamento esquelético completo e avaliação multidisciplinar."
    },
    leaf_alta_discordancia:{
      cls:"emergency",
      title:"Discordância história-lesão ou apresentação tardia — alta suspeita",
      desc:"Investigação completa: levantamento esquelético, avaliação multidisciplinar (pediatria especializada em abuso, radiologia, oftalmologia, neurocirurgia/cirurgia pediátrica se indicado) e notificação ao serviço de proteção à criança conforme obrigação ética e legal do médico."
    },
    leaf_alta_multiplos_estagios:{
      cls:"emergency",
      title:"Fraturas em múltiplos estágios de consolidação — alta suspeita",
      desc:"Achados de datação radiográfica distintos (osso subperiosteal novo ~5-7 dias, reabsorção da linha de fratura ~10-14 dias, calo mole em 2-3 semanas, remodelação ≥6 semanas) sugerindo eventos traumáticos em momentos diferentes. Notificar, internar, avaliação multidisciplinar completa; considerar cintilografia óssea ou novo levantamento esquelético em 2 semanas se dúvida persistir."
    },
    leaf_baixa_suspeita:{
      cls:"conservative",
      title:"Baixa suspeita de maus-tratos neste momento",
      desc:"Tratar a fratura conforme o padrão indicado (gesso/tala/cirurgia conforme o tipo). Manter vigilância clínica: qualquer nova informação (mecanismo incompatível, atraso na procura, achados cutâneos atípicos) deve reabrir a investigação. Lembrar diagnósticos diferenciais de fragilidade óssea (osteogênese imperfeita, osteopenia por desuso) que podem mimetizar ou coexistir com quadros de abuso."
    }
  }
},



  supracondilar_vascular_ped: {
    region: "fraturas-pediatricas", num: "LW Cap.32",
    title: "Conduta na Fratura Supracondiliana do Úmero (Gartland) com Avaliação Neurovascular",
    src: "Shah AS, Caird MS, Cap.32 Upper Extremity Fractures, In: Lovell and Winter's Pediatric Orthopaedics — p.5302,5320-5330,5343-5345",
    icon: "🦴", tags: ["cotovelo", "vascular", "emergencia"],
    start: "q1",
    nodes: {
      q1: {
        q: "Mão mal perfundida (pálida/fria) e sem pulso radial palpável?",
        yes: "q_vasc_pos_reducao",
        no: "q2"
      },
      q_vasc_pos_reducao: {
        q: "Após redução fechada e fixação percutânea (CRPP) IMEDIATA, a perfusão da mão foi restaurada (mão rósea, quente, enchimento capilar normal)?",
        yes: "leaf_vasc_restaurada",
        no: "leaf_vasc_exploracao"
      },
      leaf_vasc_restaurada: {
        cls: "emergency",
        label: "Comprometimento vascular — resolvido após redução emergencial",
        desc: "Mão mal perfundida e sem pulso: prompt reduction (CRPP emergencial) geralmente restaura o fluxo arterial. Não é necessária exploração de rotina se a mão ficar bem perfundida após a redução. Observação hospitalar rigorosa com imobilização não circunferencial e flexão <60 graus por 48 horas; monitorar sinais de síndrome compartimental (aumento da necessidade de opioides IV é sinal de alerta)."
      },
      leaf_vasc_exploracao: {
        cls: "surgical-major",
        label: "Isquemia persistente — exploração vascular emergencial",
        desc: "Mão permanece avascular (pálida, fria) apesar da redução/fixação da fratura: aproximadamente 50% de chance de necessitar cirurgia vascular e quase 25% de chance de síndrome compartimental. Indicada redução aberta por via anterior — o feixe neurovascular costuma ser encontrado angulado (kinked) no foco de fratura; a liberação do tether geralmente restaura o pulso. Reconstrução vascular (reparo ou enxerto) é realizada se a mão permanecer avascular apesar de medidas locais (liberação, lidocaína, aquecimento); a fratura deve ser estabilizada antes do reparo vascular."
      },
      q2: {
        q: "Fratura tipo III ou IV de Gartland (completamente desviada / multidirecionalmente instável)?",
        yes: "leaf_tipo34",
        no: "q3"
      },
      leaf_tipo34: {
        cls: "surgical",
        label: "Gartland III/IV — CRPP com 3 fios",
        desc: "CRPP é o tratamento preferido. Reduz o risco de deformidade residual e de contratura isquêmica de Volkmann comparado ao gesso isolado. Usar 3 fios (laterais divergentes ou 2 laterais + 1 medial). No tipo IV (instabilidade multidirecional), inserir os fios primeiro no fragmento distal e rotacionar a fluoroscopia (não o braço) para obter as imagens AP e lateral sem perder a redução. Se usar fio medial, inserir antes os fios laterais para reduzir risco de lesão do nervo ulnar (subluxação com flexão ≥120° em >50% das crianças)."
      },
      q3: {
        q: "Fratura tipo II com linha umeral anterior não tangenciando o capítulo, ou ângulo de Baumann >80° (instabilidade)?",
        yes: "leaf_tipo2_instavel",
        no: "leaf_tipo1_2_estavel"
      },
      leaf_tipo2_instavel: {
        cls: "surgical",
        label: "Gartland II instável — CRPP com 2 fios",
        desc: "Necessidade de flexão ≥90° para manter a redução aumenta a pressão compartimental e reduz o fluxo da artéria braquial — indicação de CRPP com 2 fios laterais divergentes. Mais de 20% dos tratados apenas com gesso podem perder a redução e necessitar cirurgia tardia."
      },
      leaf_tipo1_2_estavel: {
        cls: "conservative",
        label: "Gartland I ou II estável — gesso acima do cotovelo",
        desc: "Fratura não desviada (tipo I) ou tipo II estável (córtex posterior íntegro, LUA tangenciando o capítulo, Baumann normal): gesso acima do cotovelo por 3 semanas. Atenção à impactação medial sutil (pode simular fratura não desviada mas evoluir para cúbito varo)."
      }
    }
  },

  monteggia_conduta_ped: {
    region: "fraturas-pediatricas", num: "LW Cap.32",
    title: "Conduta na Lesão de Monteggia (Classificação de Bado)",
    src: "Shah AS, Caird MS, Cap.32 Upper Extremity Fractures, In: Lovell and Winter's Pediatric Orthopaedics — p.5469-5482",
    icon: "🦴", tags: ["antebraco", "monteggia", "cotovelo"],
    start: "q1",
    nodes: {
      q1: {
        q: "Apresentação aguda (diagnóstico dentro de 3 semanas da lesão)?",
        yes: "q2",
        no: "leaf_cronica"
      },
      leaf_cronica: {
        cls: "surgical-major",
        label: "Lesão de Monteggia crônica/negligenciada (>4 semanas)",
        desc: "Diagnóstico tardio é a complicação mais frequente da lesão de Monteggia. Se a ulna puder ser reduzida e estabilizada dentro de 3 semanas, a cabeça do rádio costuma reduzir e permanecer estável. Após 4 semanas, geralmente é necessária redução aberta com osteotomia corretiva (e por vezes alongamento) da ulna, excisão da massa fibrocartilaginosa interposta e reconstrução do ligamento anular (retalho de fáscia/tendão do tríceps). Resultados clínicos e radiográficos bons são esperados se a criança tiver menos de 12 anos ou a cirurgia ocorrer dentro de 3 anos da lesão original."
      },
      q2: {
        q: "Fratura da ulna é incompleta (deformação plástica ou fratura em galho verde)?",
        yes: "leaf_incompleta",
        no: "q3"
      },
      leaf_incompleta: {
        cls: "conservative",
        label: "Fratura ulnar incompleta — redução fechada e gesso",
        desc: "Redução fechada e gesso acima do cotovelo por via não operatória. Posicionamento pós-redução guiado pelo tipo de Bado: tipo I (cotovelo fletido >90°, antebraço supinado), tipo II (cotovelo em extensão, antebraço supinado), tipo III (redução em varo — mais difícil de manter apenas com gesso). Seguimento radiográfico semanal de alta qualidade por 2-3 semanas para detectar subluxação recorrente da cabeça radial. Se a cabeça do rádio permanecer luxada após a correção do comprimento/alinhamento ulnar, exploração cirúrgica da articulação está indicada (pode haver interposição do ligamento anular ou fragmento osteocondral)."
      },
      q3: {
        q: "Traço de fratura da ulna é transverso ou oblíquo curto?",
        yes: "leaf_im_nail",
        no: "leaf_orif_placa"
      },
      leaf_im_nail: {
        cls: "surgical",
        label: "Fratura ulnar completa transversa/oblíqua curta — haste intramedular",
        desc: "Redução fechada com fixação intramedular (haste flexível) da ulna. A redução anatômica e estável da ulna geralmente mantém a redução da cabeça do rádio. Verificar reabsorção/subluxação recorrente com radiografias seriadas."
      },
      leaf_orif_placa: {
        cls: "surgical",
        label: "Fratura ulnar oblíqua longa/cominuída — redução aberta e placa",
        desc: "A fixação intramedular isolada é insuficiente para manter o comprimento nesses padrões — indicada redução aberta com fixação por placa da ulna. Se, após a fixação, a cabeça do rádio permanecer luxada, realizar exploração da articulação (interposição do ligamento anular ou fragmento osteocondral); evitar fixação transcapitelar da cabeça radial reduzida."
      }
    }
  },

  condilo_lateral_conduta_ped: {
    region: "fraturas-pediatricas", num: "LW Cap.32",
    title: "Conduta na Fratura do Côndilo Lateral do Úmero (Classificação de Weiss)",
    src: "Shah AS, Caird MS, Cap.32 Upper Extremity Fractures, In: Lovell and Winter's Pediatric Orthopaedics — p.5363-5377",
    icon: "🦴", tags: ["cotovelo", "condilo-lateral"],
    start: "q1",
    nodes: {
      q1: {
        q: "Desvio da fratura ≥2 mm?",
        yes: "q2",
        no: "leaf_tipo1"
      },
      leaf_tipo1: {
        cls: "conservative",
        label: "Weiss tipo I (<2 mm) — imobilização gessada",
        desc: "Gesso com seguimento radiográfico semanal por 2 semanas (retirar o gesso para radiografias AP, lateral e oblíqua interna adequadas). Até 30% dessas fraturas podem desviar mais nos primeiros 15 dias — considerar pinagem profilática se houver dúvida quanto à adesão ao seguimento. Consolidação geralmente completa em 4 semanas, podendo levar até 12 semanas em alguns casos."
      },
      q2: {
        q: "Superfície articular é congruente, com dobradiça cartilaginosa intacta (confirmada por artrografia ou RM)?",
        yes: "leaf_tipo2",
        no: "leaf_tipo3"
      },
      leaf_tipo2: {
        cls: "surgical",
        label: "Weiss tipo II (≥2 mm, congruente) — redução fechada e pinagem percutânea",
        desc: "Após artrografia (preferencialmente por portal posterior/olecraniano, para não obscurecer a anatomia da fratura lateral) confirmando integridade da superfície articular, realizar pinagem percutânea fechada."
      },
      leaf_tipo3: {
        cls: "surgical",
        label: "Weiss tipo III (≥2 mm, incongruente) — redução aberta e fixação",
        desc: "Redução aberta com restauração da congruência articular é o objetivo primário. Fixação com fios lisos cruzando o foco de fratura ou parafusos (menor risco de pseudoartrose, retorno mais rápido ao movimento, porém pode requerer remoção posterior). Evitar dissecção posterior do fragmento para reduzir o risco de necrose avascular do capítulo/tróclea."
      }
    }
  },



fratura_toracolombar_estavel_instavel_ped: {
  region: "fraturas-pediatricas", num: "LW Cap.33",
  title: "Fratura Toracolombar Pediátrica — Estável vs. Instável (Conduta Inicial)",
  src: "Frick SL, Miyanji F, Cap.33 Pediatric Thoracolumbar Spine and Lower Extremity Fractures, In: Lovell and Winter's Pediatric Orthopaedics — p.5561-5572",
  icon: "🦴", tags: ["p", "e", "s"],
  start: "q1",
  nodes: {
    q1: {
      q: "Há déficit neurológico (mesmo transitório) ou evidência de lesão medular associada à fratura toracolombar?",
      yes: "leaf_neuro_emergencia",
      no: "q2"
    },
    q2: {
      q: "TC/RM confirma fratura-luxação com translação de um segmento vertebral em relação ao outro (lesão de três colunas com instabilidade grave)?",
      yes: "leaf_fratura_luxacao_cirurgia",
      no: "q3"
    },
    q3: {
      q: "Fratura em explosão (burst, colunas anterior e média) com lesão do complexo ligamentar posterior (PLC) ou déficit neurológico progressivo?",
      yes: "leaf_burst_plc_cirurgia",
      no: "q4"
    },
    q4: {
      q: "Fratura em flexão-distração (tipo Chance) predominantemente ligamentosa, OU alinhamento sagital em ortostase maior que 20 graus de cifose?",
      yes: "leaf_flexao_distracao_cirurgia",
      no: "q5"
    },
    q5: {
      q: "Fratura em compressão isolada (coluna anterior) OU fratura em explosão/flexão-distração óssea estável, com PLC íntegro, sem déficit neurológico e angulação segmentar menor que 20 graus (compressão: menor que 10 graus)?",
      yes: "leaf_conservador_toracolombar",
      no: "leaf_reavaliar_tlics"
    },

    leaf_neuro_emergencia: {
      q: "Suspeita de lesão medular: RM urgente para avaliar edema/hemorragia medular e integridade do PLC. Considerar descompressão precoce (dentro de 24 horas) e estabilização cirúrgica rígida — dados do STASCIS sugerem melhora neurológica com descompressão precoce. Prognóstico de recuperação é favorável na criança, sendo o estado neurológico inicial o principal determinante.",
      cls: "emergency"
    },
    leaf_fratura_luxacao_cirurgia: {
      q: "Fratura-luxação (translação, três colunas): estabilização cirúrgica rígida com parafusos pediculares para prevenir lesão secundária da medula e realinhar a coluna; descompressão do canal por via posterior ou combinada anterior/posterior conforme necessário.",
      cls: "surgical-major"
    },
    leaf_burst_plc_cirurgia: {
      q: "Fratura em explosão com PLC lesado ou déficit neurológico progressivo (TLICS tende a ser >4): tratamento cirúrgico indicado. Os antigos gatilhos isolados (50% de comprometimento do canal, 50% de perda de altura, 30 graus de cifose) não devem, isoladamente, guiar a decisão.",
      cls: "surgical"
    },
    leaf_flexao_distracao_cirurgia: {
      q: "Lesão em flexão-distração predominantemente ligamentosa ou com cifose acima de 20 graus: tratamento cirúrgico indicado (especialmente em crianças mais velhas), pois lesões puramente ligamentosas tendem a não cicatrizar com tratamento conservador. Avaliar e tratar lesão intra-abdominal associada (incidência de 40-70%), que pode inclusive contraindicar o uso de colete/gesso.",
      cls: "surgical"
    },
    leaf_conservador_toracolombar: {
      q: "Fratura estável (compressão isolada, ou explosão/flexão-distração óssea com PLC íntegro, sem déficit neurológico e dentro dos limiares angulares aceitáveis): tratamento conservador com analgesia, restrição de atividade e colete/gesso em extensão; mobilização progressiva com seguimento radiográfico seriado.",
      cls: "conservative"
    },
    leaf_reavaliar_tlics: {
      q: "Quadro não se encaixa claramente nos critérios acima: reavaliar com RM (integridade do PLC) e calcular o TLICS (morfologia + PLC + estado neurológico) antes de decidir; escore >4 favorece cirurgia, <4 favorece tratamento conservador.",
      cls: "conservative"
    }
  }
},

}; // fim ALGS

// ─── STATE ───
let currentRegion = 'geral';
let currentAlg = null;
let history = [];
let currentNode = null;

// ─── RENDER REGIONS ───
function showRegion(r, btn) {
  currentRegion = r;
  document.querySelectorAll('.rbtn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const region = REGIONS[r];
  const algs = Object.entries(ALGS).filter(([,a]) => a.region === r);
  const content = document.getElementById('content');
  content.className = region.cls;
  content.innerHTML = `
    <div class="rh" style="">
      <span class="rh-icon">${region.icon}</span>
      <h2>${region.label}</h2>
      <span class="rh-count">${algs.length} algoritmo${algs.length!==1?'s':''}</span>
    </div>
    <div class="alg-grid">
      ${algs.map(([id,a]) => `
        <div class="acard ${region.cls}" onclick="openAlg('${id}')">
          <div class="cn">${a.num}</div>
          <div class="ct">${a.icon} ${a.title}</div>
          <div class="cs">${a.src}</div>
          <div class="ctags">${(a.tags||[]).map(t => tagBadge(t)).join('')}</div>
        </div>`).join('')}
    </div>`;
}

function tagBadge(t) {
  const map = {c:['tag-c','Conservador'], s:['tag-s','Cirúrgico'], sm:['tag-sm','Grande Porte'], e:['tag-e','Emergência'], p:['tag-p','Pediatria']};
  const [cls,lbl] = map[t] || ['tag-c',t];
  return `<span class="tag ${cls}">${lbl}</span>`;
}

// ─── OPEN ALGORITHM ───
function openAlg(id) {
  const a = ALGS[id];
  if (!a) return;
  currentAlg = id;
  history = [];
  const region = REGIONS[a.region];
  document.getElementById('mod').className = region.cls;
  document.getElementById('mhd-icon').textContent = a.icon;
  document.getElementById('mhd-title').textContent = a.title;
  document.getElementById('mhd-src').textContent = a.src + ' · ' + a.num;
  document.getElementById('ov').classList.remove('hidden');
  goToNode(a.start);
}

function closeModal() {
  document.getElementById('ov').classList.add('hidden');
  currentAlg = null;
  history = [];
}

function restartAlg() {
  if (!currentAlg) return;
  history = [];
  goToNode(ALGS[currentAlg].start);
}

function goBack() {
  if (history.length < 2) return;
  history.pop();
  const prev = history.pop();
  goToNode(prev);
}

function goToNode(nodeId) {
  const a = ALGS[currentAlg];
  if (!a || !a.nodes[nodeId]) return;
  history.push(nodeId);
  currentNode = nodeId;
  const node = a.nodes[nodeId];
  updateProgress();
  renderNode(node, nodeId);
  document.getElementById('btn-back').disabled = history.length < 2;
}

function updateProgress() {
  const a = ALGS[currentAlg];
  const total = Object.keys(a.nodes).length;
  const visited = history.length;
  const pct = Math.min(100, Math.round((visited / total) * 100));
  document.getElementById('pfill').style.width = pct + '%';
  document.getElementById('ptxt').textContent = `Passo ${visited}`;
  document.getElementById('mft-info').textContent = `${visited}/${total} nós`;
}

function renderNode(node, nodeId) {
  const body = document.getElementById('mbody');
  // breadcrumbs
  const a = ALGS[currentAlg];
  const bcHTML = history.slice(0, -1).map((id, i) => {
    const n = a.nodes[id];
    const lbl = n.text ? n.text.substring(0, 40) + (n.text.length > 40 ? '…' : '') : id;
    return `<span class="bc" title="${n.text||''}">${lbl}</span>`;
  }).join('<span style="color:#374151;font-size:9px">›</span>');
  const curLbl = node.text ? node.text.substring(0, 40) + (node.text.length > 40 ? '…' : '') : nodeId;
  const breadcrumbs = (bcHTML ? bcHTML + '<span style="color:#374151;font-size:9px">›</span>' : '') +
    `<span class="bc cur">${curLbl}</span>`;

  if (node.type === 'r') {
    body.innerHTML = `
      <div class="breadcrumbs">${breadcrumbs}</div>
      <div class="rn ${node.cls}">
        <div class="rn-badge">${clsBadge(node.cls)}</div>
        <div class="rn-title">${node.title}</div>
        <div class="rn-txt">${node.txt}</div>
        ${node.details ? `<div class="rn-details">${node.details.map(([l,v]) =>
          `<div class="rn-di"><span class="dil">${l}</span><span>${v}</span></div>`).join('')}</div>` : ''}
      </div>
      <div style="text-align:center;margin-top:8px">
        <button class="btn btn-sec" onclick="restartAlg()">↺ Recomeçar do início</button>
      </div>`;
    return;
  }

  if (node.type === 'multi') {
    body.innerHTML = `
      <div class="breadcrumbs">${breadcrumbs}</div>
      <div class="nq">
        <div class="nq-lbl">Selecione uma opção</div>
        <div class="nq-txt">${node.text}</div>
        ${node.ctx ? `<div class="nq-ctx">${node.ctx}</div>` : ''}
      </div>
      <div class="opts">
        ${node.options.map((opt, i) => `
          <button class="opt" onclick="goToNode('${opt.next}')">
            <span class="opt-ico">${['①','②','③','④'][i]||'•'}</span>
            <div>
              <div class="opt-lbl">${opt.label}</div>
              ${opt.desc ? `<div class="opt-dsc">${opt.desc}</div>` : ''}
            </div>
          </button>`).join('')}
      </div>`;
    return;
  }

  // type === 'q' (yes/no decision)
  body.innerHTML = `
    <div class="breadcrumbs">${breadcrumbs}</div>
    <div class="nq">
      <div class="nq-lbl">Decisão Clínica</div>
      <div class="nq-txt">${node.text}</div>
      ${node.ctx ? `<div class="nq-ctx">${node.ctx}</div>` : ''}
    </div>
    <div class="opts two">
      <button class="opt yes" onclick="goToNode('${node.yes}')">
        <span class="opt-ico">✓</span>
        <div>
          <div class="opt-lbl">Sim</div>
          <div class="opt-dsc">Critério presente</div>
        </div>
      </button>
      <button class="opt no" onclick="goToNode('${node.no}')">
        <span class="opt-ico">✗</span>
        <div>
          <div class="opt-lbl">Não</div>
          <div class="opt-dsc">Critério ausente</div>
        </div>
      </button>
    </div>`;
}

function clsBadge(cls) {
  const map = {
    conservative: '🌿 Conservador',
    surgical: '🔧 Cirúrgico',
    'surgical-major': '⚕️ Grande Porte',
    emergency: '🚨 Emergência'
  };
  return map[cls] || cls;
}

// ─── INIT ───
showRegion('geral', document.querySelector('.rbtn[data-r="geral"]'));
